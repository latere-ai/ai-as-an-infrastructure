project:
  type: book
  output-dir: _book

book:
  title: "AI as an Infrastructure"
  subtitle: "From Systems to Agents: History, Design Decisions, and Foundations"
  author: "Changkun Ou"
  date: today
  publisher: "latere.ai"
  repo-url: https://github.com/latere-ai/ai-as-an-infrastructure
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  page-footer:
    left: "© 2026 latere.ai"
    right: "Licensed under CC BY-NC-ND 4.0"
  chapters:
    - index.qmd
    - part: "Part I: Systems"
      chapters:
        - systems/inference.qmd
        - systems/training.qmd
        - systems/eval.qmd
    - part: "Part II: Applications"
      chapters:
        - applications/chat-completion.qmd
        - applications/assistants.qmd
        - applications/agents.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    code-link: true
  pdf:
    documentclass: scrbook
    papersize: a4
  epub: default

execute:
  freeze: auto
