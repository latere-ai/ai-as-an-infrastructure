project:
  type: book
  output-dir: _book

book:
  title: "AI as an Infrastructure"
  subtitle: "Inference, Training, and Evaluation, from Engineering Practice to Theoretical Foundations"
  author: "Changkun Ou"
  date: today
  publisher: "latere.ai"
  repo-url: https://github.com/latere-ai/ai-as-an-infrastructure
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  page-footer:
    left: "© 2026 latere.ai"
    right: "Licensed under CC BY-NC-ND 4.0"
  chapters:
    - index.qmd
    - part: "Part I: Engineering Practices"
      chapters:
        - engineering/inference.qmd
        - engineering/training.qmd
        - engineering/eval.qmd
    - part: "Part II: Theoretical Foundations"
      chapters:
        - theory/inference.qmd
        - theory/training.qmd
        - theory/eval.qmd
    - summary.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    code-link: true
  pdf:
    documentclass: scrbook
    papersize: a4
  epub: default

execute:
  freeze: auto
