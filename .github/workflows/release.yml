name: Release

# Tag-triggered release via the central reusable pipeline (latere-ai/ci),
# matching every other latere service. Pushing a version tag (v*) builds the
# image from the single Dockerfile, deploys the kustomize deploy/prod/ overlay
# to the shared `latere` namespace, smokes the live book, and publishes the
# GitHub release with the smoke evidence.
#
# Deploys are now automated on tag; deploy/publish.sh remains as a manual
# escape hatch (it applies the same kustomize overlay by hand).

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  release:
    uses: latere-ai/ci/.github/workflows/service-release.yml@v1
    with:
      service: aaai-web
      image: ghcr.io/latere-ai/ai-as-an-infrastructure
      namespace: latere
      url: https://aaai.latere.ai
      title: AI as an Infrastructure
      build_mode: dockerfile
      dockerfile: Dockerfile
      has_frontend: false
      smoke_script: deploy/smoke.sh
    secrets: inherit
