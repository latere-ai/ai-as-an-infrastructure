name: book

# A push or pull request that changes only markdown starts no run. The book is
# written in .qmd, which stays watched, so the markdown files are notes about
# the book. The exceptions are README.md, which the landing test reads, and
# CHANGELOG.md, whose newest version the landing page reads at build time.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The half the shared bar does not host: the prose lint and the Bun reader's
  # build and tests. The reader's tests need Python packages from
  # app/requirements-test.txt, which the frontend gate does not install.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Style/diagram lint on the .qmd sources: no em dashes, no `---` in prose,
      # no mermaid fences.
      - run: sh tools/lint.sh
      # Compile both books into _book/ (the artifact the Go server embeds).
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run build
        working-directory: app
      - run: python -m pip install --requirement requirements-test.txt
        working-directory: app
      # Reader and content-structure checks: en/zh parity, page rendering,
      # runnable cells, citations, and link resolution against the _book/ just
      # built. These read the build output, so they run after it.
      - run: bun test --timeout 30000
        working-directory: app
