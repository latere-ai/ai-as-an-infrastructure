name: docker

# A push or pull request that changes only markdown starts no run. The book is
# written in .qmd, which stays watched, so the markdown files are notes about
# the book. The exceptions are README.md, which the landing test reads, and
# CHANGELOG.md, whose newest version the landing page reads at build time.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile is multi-stage: it compiles _book/ from source with Bun,
      # then embeds it into the Go server binary. No vendored HTML to pack.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/latere-ai/ai-as-an-infrastructure:main
            ghcr.io/latere-ai/ai-as-an-infrastructure:${{ github.sha }}
