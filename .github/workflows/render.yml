name: render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The Go gates that stand on their own: the ubuntu/macos matrix, gofmt, vet
  # and the suite, the hermetic run, modernize and the shared linter set.
  #
  # They stand alone because _book/ carries a committed .gitkeep, so the embed
  # directive resolves without a build, and the two tests that serve real pages
  # skip when it holds no site. The job below runs the same suite against a
  # real build, where those tests execute rather than skip.
  verify:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Style/diagram lint on the .qmd sources: no em dashes, no plain ```mermaid.
      - run: sh tools/lint.sh
      # Compile both books into _book/ (the artifact the Go server embeds).
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run build
        working-directory: app
      - run: python -m pip install --requirement requirements-test.txt
        working-directory: app
      # Content and reader contracts: first-use glosses, part-summary handoffs,
      # citations, cross-references, zh copy rules, and link resolution against
      # the _book/ just built. These read the build output, so they run after it.
      - run: bun test --timeout 30000
        working-directory: app
      # The routing and cache-header contracts, against the book just built --
      # the run where the tests that serve real pages execute rather than skip.
      # The linters themselves are the verify job's, not this one's.
      - run: go test ./...
      - name: Instrumented HTTP clients
        run: make lint-otel
