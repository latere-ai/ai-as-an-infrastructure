name: render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [en, zh]
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      # Style/diagram lint: no em dashes, no plain ```mermaid fences.
      - run: sh tools/lint.sh
      # HTML smoke test per language. Fails the build if the book does not
      # render. Each language is a standalone project under its own dir.
      - run: quarto render ${{ matrix.lang }} --to html
