name: render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Style/diagram lint on the .qmd sources: no em dashes, no plain ```mermaid.
      - run: sh tools/lint.sh
      # Verify the reader build still compiles both books (catches breakage in
      # PRs even though _book is vendored by the pre-commit hook).
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run build
        working-directory: app
