name: render

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # Style/diagram lint on the .qmd sources: no em dashes, no plain ```mermaid.
      - run: sh tools/lint.sh
      # Compile both books into _book/ (the artifact the Go server embeds).
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run build
        working-directory: app
      # Content and reader contracts: first-use glosses, part-summary handoffs,
      # citations, cross-references, zh copy rules, and link resolution against
      # the _book/ just built. These read the build output, so they run after it.
      - run: bun test
        working-directory: app
      # Routing-contract tests for the server (embeds the _book/ just built).
      - run: go test ./...
