<!-- Reader shell: build a persistent top bar (nav toggle + logo + breadcrumb +
     TOC toggle + language) and a reading-progress bar over Quarto's chrome,
     with foldable sidebar / on-this-page TOC. State applied early by
     reader-head.html; this builds the controls that write it. Namespaced rdr-*
     to avoid the viz-*/live-*/#lang-switch owners. Styling: theme.scss. -->
<script>
(function () {
  var DESKTOP = '(min-width: 992px)';
  function isDesktop() { return window.matchMedia(DESKTOP).matches; }

  function icon(paths) {
    return '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" ' +
      'stroke="currentColor" stroke-width="1.5" aria-hidden="true">' + paths + '</svg>';
  }
  function persist(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }

  function init() {
    var doc = document.documentElement;
    if (document.getElementById('rdr-topbar')) return;

    var offset = (document.querySelector('meta[name="quarto:offset"]') || {}).content || './';
    var isZh = (doc.getAttribute('lang') || 'en').toLowerCase().indexOf('zh') === 0;

    var bar = document.createElement('header');
    bar.id = 'rdr-topbar';

    // --- left: nav toggle + logo + breadcrumb ---------------------------
    var left = document.createElement('div');
    left.className = 'rdr-left';

    var navBtn = document.createElement('button');
    navBtn.className = 'rdr-iconbtn rdr-nav-toggle';
    navBtn.type = 'button';
    navBtn.title = isZh ? '目录侧栏' : 'Sidebar';
    navBtn.setAttribute('aria-label', navBtn.title);
    navBtn.innerHTML = icon('<rect x="2" y="3" width="12" height="10" rx="1.5"/><line x1="6.5" y1="3" x2="6.5" y2="13"/>');
    left.appendChild(navBtn);

    var logo = document.createElement('a');
    logo.className = 'rdr-logo';
    logo.href = offset;
    logo.innerHTML =
      '<svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M8 16c0-5 3.5-8 8-8s8 3 8 8-3.5 8-8 8M16 24c-5 0-8-3.5-8-8"/></svg>' +
      '<span class="rdr-wordmark">' + (isZh ? 'AI 基建' : 'AI&nbsp;Infra') + '</span>';
    left.appendChild(logo);

    var crumb = document.querySelector('#quarto-header .quarto-page-breadcrumbs');
    if (crumb) { crumb.classList.add('rdr-crumb'); left.appendChild(crumb); }
    bar.appendChild(left);

    // --- right: TOC toggle + language -----------------------------------
    var right = document.createElement('div');
    right.className = 'rdr-right';

    var hasToc = !!document.getElementById('TOC');
    var tocBtn;
    if (hasToc) {
      tocBtn = document.createElement('button');
      tocBtn.className = 'rdr-iconbtn rdr-toc-toggle';
      tocBtn.type = 'button';
      tocBtn.title = isZh ? '本页目录' : 'On this page';
      tocBtn.setAttribute('aria-label', tocBtn.title);
      tocBtn.innerHTML = icon('<rect x="2" y="3" width="12" height="10" rx="1.5"/><line x1="9.5" y1="3" x2="9.5" y2="13"/>');
      right.appendChild(tocBtn);
    }

    var langBtn = document.getElementById('lang-switch');
    if (!langBtn) {
      var p = location.pathname, to, label;
      if (p.indexOf('/zh/') !== -1) { to = p.replace('/zh/', '/en/'); label = 'EN'; }
      else { to = p.replace('/en/', '/zh/'); label = isZh ? 'EN' : '中文'; }
      langBtn = document.createElement('a');
      langBtn.id = 'lang-switch'; langBtn.href = to; langBtn.textContent = label;
      langBtn.title = 'Switch language';
    }
    langBtn.classList.add('rdr-ctl');
    right.appendChild(langBtn);

    // Settings gear (panel built after the bar is in the DOM).
    var gearBtn = document.createElement('button');
    gearBtn.className = 'rdr-iconbtn rdr-settings-toggle';
    gearBtn.type = 'button';
    gearBtn.title = isZh ? '阅读设置' : 'Reading settings';
    gearBtn.setAttribute('aria-label', gearBtn.title);
    gearBtn.innerHTML = icon('<path d="M2 4.5h7M11 4.5h3M2 11.5h3M7 11.5h7" stroke-linecap="round"/><circle cx="10" cy="4.5" r="2"/><circle cx="5.5" cy="11.5" r="2"/>');
    right.appendChild(gearBtn);
    bar.appendChild(right);

    var prog = document.createElement('div');
    prog.id = 'rdr-progress';
    prog.innerHTML = '<div id="rdr-progress-bar"></div>';
    bar.appendChild(prog);

    document.body.insertBefore(bar, document.body.firstChild);

    // Big chapter numeral for the Manuscript/Atlas openers (CSS shows it only
    // for those layouts). Read from the breadcrumb's chapter number.
    var numEl = bar.querySelector('.chapter-number');
    var titleBlock = document.getElementById('title-block-header');
    if (numEl && numEl.textContent.trim() && titleBlock && titleBlock.parentNode) {
      var chnum = document.createElement('div');
      chnum.className = 'rdr-chnum'; chnum.setAttribute('aria-hidden', 'true');
      chnum.textContent = numEl.textContent.trim();
      titleBlock.parentNode.insertBefore(chnum, titleBlock);
    }

    // --- fold behavior ---------------------------------------------------
    function reflectPressed() {
      navBtn.setAttribute('aria-pressed', String(doc.getAttribute('data-nav') !== 'collapsed'));
      if (tocBtn) tocBtn.setAttribute('aria-pressed', String(doc.getAttribute('data-toc') !== 'collapsed'));
    }
    var sidebar = document.getElementById('quarto-sidebar');
    function toggleMobileDrawer() {
      // Reuse Quarto's own off-canvas drawer (Bootstrap collapse + glass).
      if (sidebar && window.bootstrap && window.bootstrap.Collapse) {
        window.bootstrap.Collapse.getOrCreateInstance(sidebar).toggle();
      } else if (sidebar) {
        sidebar.classList.toggle('show');
      }
      if (window.quartoToggleHeadroom) window.quartoToggleHeadroom();
    }
    navBtn.addEventListener('click', function () {
      if (isDesktop()) {
        var v = doc.getAttribute('data-nav') === 'collapsed' ? 'open' : 'collapsed';
        doc.setAttribute('data-nav', v); persist('rdr-nav', v); reflectPressed();
      } else {
        toggleMobileDrawer();
      }
    });
    if (tocBtn) tocBtn.addEventListener('click', function () {
      var v = doc.getAttribute('data-toc') === 'collapsed' ? 'open' : 'collapsed';
      doc.setAttribute('data-toc', v); persist('rdr-toc', v); reflectPressed();
    });
    reflectPressed();

    // --- settings panel --------------------------------------------------
    var T = isZh
      ? { settings:'阅读设置', palette:'配色', ink:'墨色', clay:'蓝调', theme:'主题', light:'浅色', dark:'深色', body:'正文字体', sans:'黑体', kai:'楷体', size:'字号', layout:'版式', codex:'典藏', manuscript:'手稿', atlas:'图册' }
      : { settings:'Reading', palette:'Palette', ink:'Ink', clay:'Clay', theme:'Theme', light:'Light', dark:'Dark', body:'Body font', sans:'Sans', kai:'Kai', size:'Text size', layout:'Layout', codex:'Codex', manuscript:'Manuscript', atlas:'Atlas' };

    var panel = document.createElement('div');
    panel.id = 'rdr-settings';
    panel.hidden = true;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-label', T.settings);

    // A labelled row of segmented options bound to a doc attribute + storage key.
    function segRow(label, attr, key, opts, stack) {
      var row = document.createElement('div'); row.className = 'rdr-set-row' + (stack ? ' rdr-set-stack' : '');
      var lab = document.createElement('div'); lab.className = 'rdr-set-label'; lab.textContent = label;
      var seg = document.createElement('div'); seg.className = 'rdr-seg';
      function sync() {
        var cur = doc.getAttribute(attr);
        for (var i = 0; i < seg.children.length; i++)
          seg.children[i].setAttribute('aria-pressed', String(seg.children[i].dataset.val === cur));
      }
      opts.forEach(function (o) {
        var b = document.createElement('button'); b.type = 'button';
        b.textContent = o.label; b.dataset.val = o.val;
        b.addEventListener('click', function () {
          doc.setAttribute(attr, o.val); persist(key, o.val); sync();
        });
        seg.appendChild(b);
      });
      sync();
      row.appendChild(lab); row.appendChild(seg); panel.appendChild(row); return sync;
    }

    segRow(T.palette, 'data-palette', 'rdr-palette', [{ label: T.ink, val: 'ink' }, { label: T.clay, val: 'clay' }]);
    segRow(T.theme, 'data-theme', 'rdr-theme', [{ label: T.light, val: 'light' }, { label: T.dark, val: 'dark' }]);
    segRow(T.body, 'data-bodyfont', 'rdr-bodyfont', [{ label: T.sans, val: 'sans' }, { label: T.kai, val: 'kai' }]);
    segRow(T.layout, 'data-layout', 'rdr-layout', [{ label: T.codex, val: 'codex' }, { label: T.manuscript, val: 'manuscript' }, { label: T.atlas, val: 'atlas' }], true);

    // Font size stepper.
    var fsRow = document.createElement('div'); fsRow.className = 'rdr-set-row';
    var fsLab = document.createElement('div'); fsLab.className = 'rdr-set-label'; fsLab.textContent = T.size;
    var fsCtl = document.createElement('div'); fsCtl.className = 'rdr-step';
    var minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '−';
    var fsVal = document.createElement('span'); fsVal.className = 'rdr-step-val';
    var plus = document.createElement('button'); plus.type = 'button'; plus.textContent = '+';
    function curScale() { return parseFloat(getComputedStyle(doc).getPropertyValue('--reader-font-scale')) || 1; }
    function setScale(s) {
      s = Math.min(1.4, Math.max(0.8, Math.round(s * 10) / 10));
      doc.style.setProperty('--reader-font-scale', String(s));
      persist('rdr-fontscale', String(s));
      fsVal.textContent = Math.round(s * 100) + '%';
    }
    minus.addEventListener('click', function () { setScale(curScale() - 0.1); });
    plus.addEventListener('click', function () { setScale(curScale() + 0.1); });
    fsVal.textContent = Math.round(curScale() * 100) + '%';
    fsCtl.appendChild(minus); fsCtl.appendChild(fsVal); fsCtl.appendChild(plus);
    fsRow.appendChild(fsLab); fsRow.appendChild(fsCtl); panel.appendChild(fsRow);

    bar.appendChild(panel);

    function openSettings(open) {
      panel.hidden = !open;
      gearBtn.setAttribute('aria-pressed', String(open));
    }
    gearBtn.addEventListener('click', function (e) {
      e.stopPropagation(); openSettings(panel.hidden);
    });
    document.addEventListener('click', function (e) {
      if (!panel.hidden && !panel.contains(e.target) && e.target !== gearBtn) openSettings(false);
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openSettings(false); });

    // --- reading progress ------------------------------------------------
    var fill = document.getElementById('rdr-progress-bar');
    var ticking = false;
    function update() {
      ticking = false;
      var st = window.pageYOffset || doc.scrollTop || 0;
      var h = doc.scrollHeight - window.innerHeight;
      fill.style.width = ((h > 0 ? Math.min(1, Math.max(0, st / h)) : 0) * 100).toFixed(2) + '%';
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
    }, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();
  }

  if (document.readyState !== 'loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
