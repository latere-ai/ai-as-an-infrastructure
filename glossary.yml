# Glossary: single source of truth for professional terms. Reference a term in
# any chapter with @gls-<key>; the pipeline expands it on first use per chapter
# (中文（English） / english (ABBR)), shows the short form after, links every use
# to the auto-generated glossary page, and warns on an undefined key. Add a term
# here once; never hand-maintain the gloss in prose.
#
#   <key>: { en: <full English>, zh: <full Chinese>, abbr: <optional abbreviation> }
#
# Optional def: a one-line definition shown on the glossary page so a reader who
# meets the term cold has somewhere to land. Without it the page falls back to
# the sentence where the term first appears, which is often enough but sometimes
# degenerate ("This is prefill."). Write it in both languages, terms byte-verbatim:
#
#   <key>: { en: ..., zh: ..., def: { en: <one line>, zh: <one line> } }

moe:  { en: mixture-of-experts, zh: 混合专家, abbr: MoE, def: { en: "An architecture that replaces a dense feed-forward layer with many expert layers and routes each token to a few, so capacity grows without proportional compute.", zh: "用许多专家层替换稠密前馈层、并把每个词元只路由给少数几个的架构，使容量增长而算力不成比例增加。" } }
ssm:  { en: state-space model, zh: 状态空间模型, abbr: SSM, def: { en: "A sequence model that carries a recurrent hidden state instead of attending to all past tokens, giving linear-time inference and a fixed-size state.", zh: "一种携带循环隐藏状态、而非关注所有过去词元的序列模型，带来线性时间推理和固定大小的状态。" } }
ffn:  { en: feed-forward network, zh: 前馈网络, abbr: FFN, def: { en: "The position-wise sublayer applied to each token independently in a transformer block, holding most of the model's parameters and knowledge.", zh: "Transformer 块中对每个词元独立施加的逐位置子层，承载了模型大部分参数和知识。" } }
mha:  { en: multi-head attention, zh: 多头注意力, abbr: MHA, def: { en: "An attention mechanism that divides queries, keys, and values among parallel heads so each head can learn different relationships between tokens.", zh: "切成多个头、并行关注不同子空间的注意力；每个头各存一份键和值，因此 KV 缓存最大。" } }
mla:  { en: multi-head latent attention, zh: 多头潜在注意力, abbr: MLA, def: { en: "An attention design introduced with DeepSeek-V2 that compresses keys and values into a low-rank latent representation to reduce the KV cache.", zh: "DeepSeek-V2 提出的注意力变体，用低秩潜在向量替代每个头的完整键和值来缓存，宣称以小缓存达到 MHA 级质量。" } }
sft:  { en: supervised fine-tuning, zh: 监督微调, abbr: SFT, def: { en: "A post-training stage that teaches a pretrained model to follow instructions by training it on curated input-output examples.", zh: "在精选的输入-输出示例上训练预训练模型，使其按目标格式遵循指令；后训练的第一个阶段。" } }
peft: { en: parameter-efficient fine-tuning, zh: 参数高效微调, abbr: PEFT, def: { en: "A family of adaptation methods that trains a small set of added or selected parameters while leaving most pretrained weights frozen.", zh: "只训练一小部分新增或选定的参数、冻结其余部分来适配模型，相比全量微调大幅降低显存与存储。" } }
bpe:  { en: byte-pair encoding, zh: 字节对编码, abbr: BPE, def: { en: "A tokenizer training algorithm that starts from bytes and repeatedly merges the most frequent adjacent pair into a new token, building a subword vocabulary.", zh: "一种分词器训练算法，从字节出发，反复把最频繁的相邻对合并为一个新词元，从而构建子词词表。" } }
scaling-law: { en: scaling law, zh: 扩展律, def: { en: "An empirical power law relating model loss to compute, parameters, and data, used to predict quality and allocate a training budget.", zh: "把模型损失与算力、参数量和数据量联系起来的经验幂律，用于预测质量并分配训练预算。" } }
next-token-prediction: { en: next-token prediction, zh: 下一词元预测, def: { en: "A pretraining objective that asks a model to predict each token from the tokens that precede it.", zh: "根据前文预测下一个词元的预训练目标；最小化其交叉熵正是语言模型的学习方式。" } }
cross-entropy: { en: cross-entropy, zh: 交叉熵, def: { en: "A loss that measures how much probability a model assigns to the correct answer compared with its full predicted distribution.", zh: "衡量模型预测分布相对真实下一词元浪费多少比特的损失；正是预训练所最小化的量。" } }
perplexity: { en: perplexity, zh: 困惑度, def: { en: "The exponential of cross-entropy, often interpreted as the average number of plausible token choices the model considers at each step.", zh: "交叉熵的指数，可读作模型在词元上的平均分支因子；越低表示模型对文本越不感到意外。" } }
training-tokens: { en: training tokens, zh: 训练词元, def: { en: "The total number of token instances processed during pretraining, including repeated examples and additional passes through the data.", zh: "预训练中喂给模型的词元实例总数，按分词后计数，并包含重复和多轮遍历；它衡量数据量，不是词表大小。" } }
compute-optimal: { en: compute-optimal, zh: 计算最优, def: { en: "A balance between model size and training data that produces the lowest expected loss for a fixed compute budget.", zh: "在固定算力预算下、使损失最小的模型规模与数据量分配；即 Chinchilla 的结论：数据应与参数同步扩展。" } }
adamw: { en: AdamW, zh: AdamW 优化器, def: { en: "A version of the Adam optimizer that applies weight decay separately from the gradient-based parameter update.", zh: "Transformer 的默认优化器，即把权重衰减与梯度更新解耦的 Adam。" } }
warmup-stable-decay: { en: warmup-stable-decay, zh: 预热-稳定-衰减调度, abbr: WSD, def: { en: "A learning-rate schedule that warms up, stays constant for most of training, and decays near the end.", zh: "一种学习率调度：先预热爬升，再长时间保持恒定，最后衰减；恒定段让总训练长度保持开放。" } }
mid-training: { en: mid-training, zh: 中段训练, def: { en: "A pretraining-like phase between broad pretraining and post-training, usually mixing specialized or higher-quality data while continuing next-token training.", zh: "位于宽泛预训练与后训练之间、仍近似预训练的一段训练，通常在下一词元目标下混入专门化或更高质量的数据。" } }
continued-pretraining: { en: continued pretraining, zh: 继续预训练, def: { en: "A training phase that continues the next-token objective on an existing pretrained model, often using data from a specific domain.", zh: "对已经预训练的模型继续做下一词元训练，常面向目标领域；不同于中段训练，它可能完全切换到新分布。" } }
z-loss: { en: z-loss, zh: z-loss 正则, def: { en: "A small auxiliary penalty on the log of the softmax normalizer that keeps logits from drifting, stabilizing the training of large models.", zh: "对 softmax 归一化项的对数施加的小辅助惩罚，防止 logits 漂移，从而稳定大模型训练。" } }
qk-norm: { en: query-key normalization, zh: 查询-键归一化, abbr: QK-norm, def: { en: "A stabilization technique that normalizes query and key vectors before their dot product to limit the growth of attention logits.", zh: "在查询与键做点积之前对其归一化，以抑制注意力 logit 的增长，是大规模训练不稳定的一种修复。" } }
gradient-clipping: { en: gradient clipping, zh: 梯度裁剪, def: { en: "A stabilization technique that limits gradient magnitude before an update to prevent unusually large gradients from disrupting training.", zh: "在更新前限制梯度范数，使偶发的过大批次梯度无法让训练发散。" } }
minhash: { en: MinHash, zh: 最小哈希, def: { en: "A hashing scheme that cheaply estimates set similarity, used to find and remove near-duplicate documents in a training corpus.", zh: "一种廉价估计集合相似度的哈希方案，用于在训练语料中发现并去除近重复文档。" } }
decontamination: { en: decontamination, zh: 去污染, def: { en: "The removal of training examples that overlap with evaluation data, preventing memorization from inflating benchmark scores.", zh: "从训练数据中移除与评测基准重叠的文本，使报告分数不被记忆所夸大。" } }
tokenizer: { en: tokenizer, zh: 分词器, def: { en: "A component that converts raw text into the integer token identifiers a model consumes and converts model output back into text.", zh: "在原始文本与模型所消费的整数词元 id 之间相互映射的组件；其词表在训练前就已固定。" } }
sentencepiece: { en: SentencePiece, zh: SentencePiece 分词器, def: { en: "A language-agnostic tokenizer that trains directly on raw text without pre-tokenization, treating the input including whitespace as one stream.", zh: "一种与语言无关的分词器，直接在原始文本上训练、无需预分词，把含空格的输入视为一个字符流。" } }
tokenizer-free: { en: tokenizer-free, zh: 无分词器方案, def: { en: "An approach that drops a fixed vocabulary and models bytes or characters directly, trading tokenizer biases for longer sequences.", zh: "一种舍弃固定词表、直接对字节或字符建模的方案，以更长的序列换取摆脱分词器偏置。" } }
residual-stream: { en: residual stream, zh: 残差流, def: { en: "The shared vector that passes through a transformer while each block reads it and adds its own update.", zh: "在 Transformer 中从嵌入一路传到输出、保持身份不变的向量；每个块读取它、算出一个增量、再把增量加回。" } }
rmsnorm: { en: root mean square layer normalization, zh: 均方根层归一化, abbr: RMSNorm, def: { en: "A normalization method that rescales activations by their root mean square without subtracting their mean.", zh: "只用激活的均方根来重新缩放的归一化，舍弃了 LayerNorm 的去均值与偏置；更省算力，如今是默认选择。" } }
rope: { en: rotary position embedding, zh: 旋转位置嵌入, abbr: RoPE, def: { en: "A position-encoding method that rotates query and key vectors by position-dependent angles so their dot product reflects relative position.", zh: "把查询和键向量按位置决定的角度旋转的位置编码，使注意力只取决于词元之间的相对偏移。" } }
swiglu: { en: Swish-gated linear unit, zh: Swish 门控线性单元, abbr: SwiGLU, def: { en: "A gated feed-forward layer that combines a Swish-activated projection with a second projection before producing its output.", zh: "现代 Transformer 中的门控前馈层，计算 (Swish(xW1) ⊙ xV)W2；用三个矩阵，自 LLaMA 起成为默认。" } }
flashattention: { en: FlashAttention, zh: FlashAttention 注意力内核, def: { en: "An exact attention algorithm that avoids storing the full score matrix in main memory, reducing memory traffic and accelerating attention.", zh: "一种从不把完整分数矩阵写入内存的精确注意力内核，使 O(n²) 注意力变得可负担；它加速计算，但不缩减 KV 缓存。" } }
zero: { en: Zero Redundancy Optimizer, zh: 零冗余优化器, abbr: ZeRO, def: { en: "A data-parallel method that shards optimizer states, gradients, and parameters across devices instead of replicating them, cutting per-device memory.", zh: "一种数据并行方法，把优化器状态、梯度和参数分片到各设备而非各自复制，从而降低单设备显存。" } }
fsdp: { en: fully sharded data parallel, zh: 全分片数据并行, abbr: FSDP, def: { en: "A PyTorch distributed-training method that shards parameters, gradients, and optimizer state, gathering each layer's parameters only when needed.", zh: "PyTorch 对参数、梯度和优化器状态全分片的实现，只在需要时才聚合每层权重。" } }
lsh:  { en: locality-sensitive hashing, zh: 局部敏感哈希, abbr: LSH, def: { en: "A hashing method designed to place similar items in the same bucket with high probability, supporting approximate search and deduplication.", zh: "把相似项以高概率映射到同一桶的哈希，支撑大规模近似最近邻搜索与去重。" } }
mup:  { en: maximal update parametrization, zh: 最大更新参数化, abbr: muP, def: { en: "A parametrization that keeps the optimal learning rate stable across model widths, so hyperparameters tuned on a small model transfer to a large one.", zh: "一种使最优学习率在不同模型宽度间保持稳定的参数化，使在小模型上调好的超参数可迁移到大模型。" } }
tp:   { en: tensor parallelism, zh: 张量并行, abbr: TP, def: { en: "A distributed-computing method that splits each layer's tensors across devices that cooperate on the same forward and backward pass.", zh: "把单层的矩阵切分到多个设备、由它们共同完成一次前向传播的并行方式，多用于带宽高的节点内。" } }
pp:   { en: pipeline parallelism, zh: 流水线并行, abbr: PP, def: { en: "A distributed-computing method that assigns successive groups of layers to different devices and streams microbatches through them.", zh: "把不同层放在不同设备、让微批次像流水线一样依次通过的并行方式，两端会有空闲气泡。" } }
dp:   { en: data parallelism, zh: 数据并行, abbr: DP, def: { en: "A distributed training method that replicates the model across devices, processes a different batch shard on each, and then combines their gradients.", zh: "把模型复制到各设备、各自处理不同的批次分片再平均梯度；分布式训练中最简单的一个维度。" } }
mfu:  { en: model FLOPs utilization, zh: 模型 FLOPs 利用率, abbr: MFU, def: { en: "The fraction of a device's peak arithmetic throughput actually spent on useful model FLOPs, a headline training-efficiency metric.", zh: "设备峰值算力中真正花在有用模型 FLOPs 上的比例，是训练效率的一个标志性指标。" } }
reward-hacking: { en: reward hacking, zh: 奖励欺骗, def: { en: "A failure in which a model earns a high measured reward by exploiting the metric instead of achieving the intended goal.", zh: "模型通过利用奖励的缺陷、而非达成预期目标来最大化所测奖励的现象；针对代理目标做优化的核心失效。" } }

# Retrieval / serving / agents
rag:  { en: retrieval-augmented generation, zh: 检索增强生成, abbr: RAG, def: { en: "A method that retrieves relevant documents at query time and adds them to the prompt so the model can answer from that evidence.", zh: "在查询时取回相关文档并放入提示词，使模型依据检索到的证据作答，而不仅靠参数化记忆。" } }
ttft: { en: time to first token, zh: 首词元时间, abbr: TTFT, def: { en: "The elapsed time between submitting a request and receiving the first generated token.", zh: "用户在第一个输出词元出现前的等待时间；由预填充决定，是交互式对话的主导延迟。" } }
tpot: { en: time per output token, zh: 每词元延迟, abbr: TPOT, def: { en: "The average time required to generate each token after a response begins streaming.", zh: "流开始后每个词元所需的时间，即每步解码延迟；决定长文本生成是流畅还是卡顿。" } }
slo:  { en: service-level objective, zh: 服务等级目标, abbr: SLO, def: { en: "A target threshold for a service metric, such as p99 latency under a bound, that a serving system commits to meeting.", zh: "对某项服务指标设定的目标阈值，例如 p99 延迟不超过某界限，是服务系统承诺达到的标准。" } }
prefill: { en: prefill, zh: 预填充, def: { en: "The initial inference pass that processes the full prompt and computes the keys and values needed for later token generation.", zh: "推理的第一遍，一次读完整个提示词，算出每个词元的键和值；受算力约束，决定首词元时间。" } }
decode: { en: decode, zh: 解码, def: { en: "The inference phase after prefill that generates one token at a time while reusing cached keys and values.", zh: "预填充之后的自回归阶段，每步针对已缓存的键和值发出一个词元；受显存带宽约束，决定每词元延迟。" } }
goodput: { en: goodput, zh: 有效吞吐量, def: { en: "The rate of completed requests that satisfy a service's latency or other acceptance targets.", zh: "只计入满足延迟目标的请求的吞吐量，是服务系统真正优化的目标，区别于原始吞吐量。" } }
continuous-batching: { en: continuous batching, zh: 连续批处理, def: { en: "A serving scheduler that adds and removes requests between decode steps so completed requests release capacity immediately.", zh: "在每个解码步而非每个固定批次准入和退出请求的调度方式，使完成的请求立即释放其槽位。" } }
pagedattention: { en: PagedAttention, zh: PagedAttention 分页注意力, def: { en: "A KV-cache allocator that stores the cache in fixed-size pages like virtual memory, ending the fragmentation of reserving one contiguous block per sequence.", zh: "把 KV 缓存按固定大小分页存储（类似虚拟内存）的分配方式，消除了为每个序列预留连续大块所带来的碎片化。" } }
prefix-caching: { en: prefix caching, zh: 前缀缓存, def: { en: "A serving optimization that reuses the KV cache for a prompt prefix shared by multiple requests, avoiding repeated prefill work.", zh: "在请求间复用共享提示词前缀的 KV 缓存，使其预填充只算一次，而非每个请求各算一遍。" } }
speculative-decoding: { en: speculative decoding, zh: 推测解码, def: { en: "A decoding method in which a faster model drafts several tokens and the target model verifies them together.", zh: "用一个小而快的模型起草若干词元，再由大模型一次性校验，以额外算力换取更少的慢速解码步。" } }
constrained-decoding: { en: constrained decoding, zh: 约束解码, def: { en: "A decoding method that permits only tokens allowed by a grammar or schema at each step, ensuring structurally valid output.", zh: "在每一步把模型可发出的词元限制为某个语法或模式所允许的范围，使输出天然合法。" } }
fsm: { en: finite-state machine, zh: 有限状态机, abbr: FSM, def: { en: "A computational model with a finite set of states and rules for moving between them in response to input.", zh: "一种状态与转移均为有限的计算模型；在约束解码中用于追踪语法接下来允许哪些词元。" } }
attention-sink: { en: attention sink, zh: 注意力汇, def: { en: "An initial token that receives substantial attention even when its content is unimportant, helping some models preserve behavior over long contexts.", zh: "注意力头把多余权重倾倒到的少数起始词元；把它们留在缓存中可稳定流式与长上下文生成。" } }
bm25: { en: BM25, zh: BM25 稀疏检索, def: { en: "A lexical ranking function that scores documents from query-term frequency, document length, and how rare each term is across the collection.", zh: "一种经典的稀疏词法排序函数，按词频与稀有度给文档打分；混合检索背后强力的关键词搜索基线。" } }
hnsw: { en: hierarchical navigable small-world, zh: 分层可导航小世界图, abbr: HNSW, def: { en: "A graph index for approximate nearest-neighbor search over vectors, navigating layered links to find close embeddings fast.", zh: "一种用于向量近似最近邻搜索的图索引，通过分层链接快速找到相近的嵌入。" } }
hybrid-search: { en: hybrid search, zh: 混合搜索, def: { en: "A retrieval method that combines lexical scores with vector similarity so results can reflect both exact terms and semantic meaning.", zh: "把稀疏词法分数（BM25）与稠密向量相似度融合为一个排序，兼顾精确关键词与语义匹配。" } }
dual-encoder: { en: dual-encoder, zh: 双编码器, def: { en: "A retrieval model that embeds queries and documents separately, allowing document vectors to be computed before a search begins.", zh: "分别编码查询和文档的检索模型，文档向量可预先计算并检索，速度快但不如联合打分精确。" } }
cross-encoder: { en: cross-encoder, zh: 交叉编码器, def: { en: "A model that scores a query and document jointly in one pass, more accurate than a dual-encoder but too costly to run over a whole corpus, so used to rerank.", zh: "在一次前向中联合给查询和文档打分的模型，比双编码器更准但无法跑遍整个语料，因此用于重排。" } }
ocr: { en: optical character recognition, zh: 光学字符识别, abbr: OCR, def: { en: "A process that converts text in scanned documents, photographs, or other images into machine-readable characters.", zh: "把文本图像转换为机器可读字符，是摄取扫描件或照片文档的前置步骤。" } }
virtual-key: { en: virtual key, zh: 虚拟密钥, def: { en: "A gateway-issued credential mapped to an upstream provider key, letting an operator set per-team budgets, limits, and revocation without sharing the real key.", zh: "网关签发、映射到上游提供商密钥的凭证，使运营方无需共享真实密钥即可设定各团队预算、限额与吊销。" } }
# Attention / architecture
mqa:  { en: multi-query attention, zh: 多查询注意力, abbr: MQA, def: { en: "An attention variant where all query heads share a single key/value head, cutting the KV cache by a factor of the head count at some quality risk.", zh: "所有查询头共享单个键/值头的注意力变体，把 KV 缓存削减为头数分之一，但有一定质量风险。" } }
gqa:  { en: grouped-query attention, zh: 分组查询注意力, abbr: GQA, def: { en: "An attention design in which each group of query heads shares one set of keys and values, reducing KV-cache memory relative to MHA.", zh: "查询头在组内共享键和值的注意力，介于 MHA 与 MQA 之间；是 LLaMA 与 Qwen 的默认。" } }
# Reasoning / RL
prm:  { en: process reward model, zh: 过程奖励模型, abbr: PRM, def: { en: "A reward model that scores each step of a reasoning trace, not just the final answer, giving denser signal for training and search.", zh: "对推理过程每一步而非仅对最终答案打分的奖励模型，为训练与搜索提供更密集的信号。" } }
mcts: { en: Monte Carlo tree search, zh: 蒙特卡洛树搜索, abbr: MCTS, def: { en: "A search method that grows a decision tree by sampling outcomes, updating value estimates, and balancing exploration with promising choices.", zh: "通过采样推演并回传其价值来构建搜索树的方法，在探索与利用间权衡；用于推理与规划。" } }
rlvr: { en: reinforcement learning with verifiable rewards, zh: 可验证奖励的强化学习, abbr: RLVR, def: { en: "A reinforcement-learning method in which an automatic checker, such as a unit test or exact-answer rule, supplies the reward.", zh: "奖励来自自动校验器（单元测试、精确答案）而非学习模型的强化学习；奖励模型不再是可被钻空子的对象，但不完善的校验器仍可能被骗过。" } }
mdl:  { en: minimum description length, zh: 最小描述长度, abbr: MDL, def: { en: "A model-selection principle that prefers the model producing the shortest combined description of itself and the data.", zh: "奥卡姆剃刀的形式化：最好的模型是把数据加自身压缩得最短的那个；把学习看作压缩的一种视角。" } }
# Interpretability
sae:  { en: sparse autoencoder, zh: 稀疏自编码器, abbr: SAE, def: { en: "An interpretability tool that decomposes a model's activations into many sparse, more monosemantic features, used to read what a network represents.", zh: "一种可解释性工具，把模型激活分解为许多稀疏、更单义的特征，用于读出网络所表示的内容。" } }
# Hardware / reliability
hbm:  { en: high-bandwidth memory, zh: 高带宽显存, abbr: HBM, def: { en: "A stack of DRAM dies placed close to an accelerator to provide more data-transfer bandwidth than conventional off-chip memory.", zh: "紧邻加速器堆叠的 DRAM，提供极高带宽；其容量与带宽决定能服务多大的模型与 KV 缓存。" } }
ici:  { en: inter-chip interconnect, zh: 芯片间互连, abbr: ICI, def: { en: "The high-speed links connecting accelerators directly (such as NVLink or a TPU's ICI), carrying the collective traffic of tensor and pipeline parallelism.", zh: "直接连接加速器的高速链路（如 NVLink 或 TPU 的 ICI），承载张量并行与流水线并行的集合通信。" } }
mtbf: { en: mean time between failures, zh: 平均无故障时间, abbr: MTBF, def: { en: "The average operating time expected between one hardware failure and the next.", zh: "硬件两次故障之间的平均运行时间；在集群规模下它低到长训练必须预期故障并从中恢复。" } }
lru:  { en: least recently used, zh: 最近最少使用, abbr: LRU, def: { en: "A cache eviction policy that removes the entry that has gone unused for the longest time.", zh: "丢弃最久未使用项的逐出策略；缓存的默认选择，包括 KV 缓存与前缀复用。" } }
# Defined for @gls use (not auto-migrated: the book uses the abbr directly)
llm:  { en: large language model, zh: 大语言模型, abbr: LLM, def: { en: "A neural network trained on large text collections to model language and generate text in response to a prompt.", zh: "在广泛文本上训练以预测词元、再适配为遵循指令的 Transformer；本书所围绕的核心产物。" } }
rlhf: { en: reinforcement learning from human feedback, zh: 基于人类反馈的强化学习, abbr: RLHF, def: { en: "A post-training method that learns a reward model from human preferences and then optimizes a policy against that reward.", zh: "在人类偏好比较上训练奖励模型、再据此优化策略来对齐模型；最初的对齐配方。" } }
dpo:  { en: direct preference optimization, zh: 直接偏好优化, abbr: DPO, def: { en: "A post-training method that learns directly from preferred and rejected response pairs without a separate reward model or reinforcement-learning loop.", zh: "用分类式损失直接从偏好对中对齐模型，省去 RLHF 中独立的奖励模型与 RL 循环。" } }

# --- comprehensive pass: per-part subagent definitions ---
cot: { en: chain of thought, zh: 思维链, abbr: CoT, def: { en: "A sequence of intermediate reasoning steps produced before a model gives its final answer.", zh: "提示或训练模型在给出答案前产出中间推理步骤，从而提升多步问题的准确率。" } }
mcp: { en: Model Context Protocol, zh: 模型上下文协议, abbr: MCP, def: { en: "An open protocol standardizing how an agent connects to external tools and data sources, so a host can talk to many servers uniformly.", zh: "一种开放协议，标准化智能体连接外部工具与数据源的方式，使宿主能以统一方式对接众多服务器。" } }
capex: { en: capital expense, zh: 资本性支出, abbr: CapEx, def: { en: "Capital expenses pay for long-lived assets such as accelerators, networking equipment, and datacenters that are depreciated over time.", zh: "对 GPU、数据中心等长寿命资产的前期支出，按年折旧；自有算力成本的主要部分。" } }
opex: { en: operating expense, zh: 运营性支出, abbr: OpEx, def: { en: "Operating expenses are the recurring costs of running a service, including power, bandwidth, maintenance, and rented cloud capacity.", zh: "电力、带宽、租用云容量等经常性运行成本；服务中按量付费的一面。" } }
lora: { en: low-rank adaptation, zh: 低秩适配, abbr: LoRA, def: { en: "A PEFT method that freezes the base weights and learns a small low-rank update per layer, so many task adapters share one base model.", zh: "一种 PEFT 方法，冻结基座权重、为每层学习一个低秩小更新，使众多任务适配器共享同一基座模型。" } }
qlora: { en: quantized low-rank adaptation, zh: 量化低秩适配, abbr: QLoRA, def: { en: "A fine-tuning method that applies LoRA adapters to a quantized base model to reduce the memory required for training.", zh: "在 4 比特量化的基座模型之上应用 LoRA，使大模型能在单张 GPU 上微调。" } }
ppo: { en: proximal policy optimization, zh: 近端策略优化, abbr: PPO, def: { en: "A policy-gradient reinforcement-learning algorithm that limits each update so the new policy does not move too far from the previous one.", zh: "一种稳定的策略梯度强化学习算法，裁剪每次更新使其贴近上一策略；RLHF 的主力优化器。" } }
kl: { en: Kullback-Leibler divergence, zh: Kullback-Leibler 散度, abbr: KL, def: { en: "An asymmetric measure of how one probability distribution differs from another, often used to limit policy drift during alignment.", zh: "衡量一个分布偏离另一个分布多远的非对称度量；在对齐中用于惩罚策略偏离参考模型。" } }
rlaif: { en: reinforcement learning from AI feedback, zh: 从 AI 反馈中做强化学习, abbr: RLAIF, def: { en: "A post-training method that uses model-generated preferences or critiques as reinforcement-learning feedback instead of relying only on human labels.", zh: "偏好标签来自模型而非人类的 RLHF，以一定质量换取更廉价、可扩展的反馈。" } }
ipo: { en: identity preference optimization, zh: 恒等偏好优化, abbr: IPO, def: { en: "A DPO variant that replaces the log-sigmoid loss with a squared objective to curb overfitting to preference pairs.", zh: "一种 DPO 变体，用平方目标替换 log-sigmoid 损失，以抑制对偏好对的过拟合。" } }
kto: { en: Kahneman-Tversky optimization, zh: Kahneman-Tversky 优化, abbr: KTO, def: { en: "A preference method that learns from unpaired good/bad labels with a prospect-theory-inspired loss, needing no preference pairs.", zh: "一种偏好方法，借鉴前景理论的损失从未配对的好/坏标签中学习，无需偏好对。" } }
orpo: { en: odds-ratio preference optimization, zh: 优势比偏好优化, abbr: ORPO, def: { en: "A method that folds preference alignment into SFT with an odds-ratio penalty, removing the need for a separate reference model.", zh: "一种把偏好对齐用优势比惩罚并入 SFT 的方法，省去独立的参考模型。" } }
simpo: { en: simple preference optimization, zh: 简单偏好优化, abbr: SimPO, def: { en: "A reference-free DPO variant using the average log-probability as an implicit reward with a target margin, simpler and memory-light.", zh: "一种无参考模型的 DPO 变体，用平均对数概率作隐式奖励并设目标间隔，更简单且省显存。" } }
raft: { en: reward ranked fine-tuning, zh: 奖励排序微调, abbr: RAFT, def: { en: "An iterative training method that samples candidate responses, selects those with the highest rewards, and fine-tunes the model on them.", zh: "一种迭代方法：采样候选、保留奖励最高者、再在其上微调；把拒绝采样化作训练。" } }
tot: { en: tree of thoughts, zh: 思维树, abbr: ToT, def: { en: "A reasoning method that explores a branching tree of intermediate thoughts with lookahead and backtracking, beyond a single chain.", zh: "一种推理方法，带前瞻与回溯地探索中间想法的分叉树，超越单一思维链。" } }
self-consistency: { en: self-consistency, zh: 自一致性, def: { en: "A decoding method that samples several reasoning paths and returns the answer that appears most often.", zh: "采样多条推理链并取多数答案，以额外算力换取更高准确率。" } }
least-to-most: { en: least-to-most, zh: 由最少到最多, def: { en: "A prompting strategy that decomposes a hard problem into easier subproblems solved in order, each building on the last.", zh: "一种提示策略，把难题分解为由易到难、依次求解的子问题，每步在前一步之上构建。" } }
grpo: { en: group relative policy optimization, zh: 组相对策略优化, abbr: GRPO, def: { en: "A reinforcement-learning method that estimates relative advantages from a group of sampled answers without training a separate value model.", zh: "一种强化学习方法，去掉价值评论网络、在一组采样答案内对奖励做归一化；DeepSeek-R1 背后的优化器。" } }
rloo: { en: REINFORCE leave-one-out, zh: REINFORCE 留一法, abbr: RLOO, def: { en: "A lightweight policy-gradient method that uses the mean reward of the other samples as each sample's baseline, avoiding a learned value network.", zh: "一种轻量策略梯度方法，用其余样本的平均奖励作为每个样本的基线，无需学习价值网络。" } }
genrm: { en: generative reward model, zh: 生成式奖励模型, abbr: GenRM, def: { en: "A reward model that judges by generating a critique or verdict in text rather than emitting a scalar, often using chain-of-thought.", zh: "一种通过生成文字评判或裁决、而非输出标量来打分的奖励模型，常配合思维链。" } }
budget-forcing: { en: budget forcing, zh: 预算强制, def: { en: "A test-time control that caps or extends how many reasoning tokens a model spends, trading latency for accuracy.", zh: "一种测试时控制，限制或延长模型花在推理上的词元数，以延迟换准确率。" } }
held-out: { en: held-out set, zh: 留出集, def: { en: "A held-out set contains examples excluded from training and reserved for measuring generalization to unseen data.", zh: "刻意排除在训练之外、用于衡量泛化能力的数据；诚实评测的基础。" } }
swiss-cheese: { en: Swiss-cheese model, zh: 瑞士奶酪, def: { en: "A safety framing where several imperfect layers each have holes, but stacking them so the holes do not line up blocks most failures.", zh: "一种安全框架：多个不完美的防护层各有漏洞，但层层叠放使漏洞不对齐，便能拦下大多数失效。" } }
canary: { en: canary strings, zh: 金丝雀字符串, def: { en: "A set of unique markers inserted into data so their later appearance can reveal leakage or training-set contamination.", zh: "植入数据中的唯一标记，当它们在模型输出里重现时，用于检测泄漏或训练集污染。" } }
membership-inference: { en: membership inference, zh: 成员推断, def: { en: "An attack that tests whether a specific example was in a model's training set, a basic privacy threat.", zh: "一种攻击，测试某个具体样本是否在模型的训练集中，是基本的隐私威胁。" } }
helm: { en: Holistic Evaluation of Language Models, zh: HELM, def: { en: "A benchmark suite that scores models across many scenarios and metrics together, rather than reducing them to one leaderboard number.", zh: "一套基准，在众多场景与指标上整体评估模型，而非压缩为单一排行榜数字。" } }
llm-as-judge: { en: model-as-judge, zh: 模型作为评判者, def: { en: "An evaluation method that asks a model to score or compare outputs in place of, or before, human review.", zh: "用一个强模型代替人工评分者来打分或比较输出，廉价可扩展但自带偏置。" } }
holistic-eval: { en: holistic evaluation, zh: 整体评测, def: { en: "An evaluation that examines several dimensions, such as accuracy, robustness, bias, and efficiency, instead of reporting one score.", zh: "在准确性、鲁棒性、偏见、效率等多个维度上同时评估模型，而非只优化单一指标。" } }
goodhart: { en: Goodhart's law, zh: 古德哈特定律, def: { en: "The observation that a measure often stops reflecting the intended outcome once people or systems optimize directly for it.", zh: "一旦某个度量被当作目标，它就不再是好的度量；基准会失效、奖励会被钻空子的原因。" } }
rubric: { en: rubric, zh: 评分准则, def: { en: "An explicit scoring guide listing the criteria and levels a judge applies, making subjective evaluation more consistent.", zh: "列出评判者所用标准与等级的明确评分指南，使主观评测更一致。" } }
byzantine-fault-tolerance: { en: Byzantine fault tolerance, zh: 拜占庭容错, def: { en: "A system's ability to reach correct consensus even when some components fail arbitrarily or maliciously, not just by crashing.", zh: "系统即使在部分组件任意或恶意失效（而非仅崩溃）时仍能达成正确共识的能力。" } }
arithmetic-coding: { en: arithmetic coding, zh: 算术编码, def: { en: "An entropy-coding method that represents an entire message as an interval within the unit interval, approaching the source's ideal bit rate.", zh: "一种熵编码，把整条消息编码为 [0,1) 内的单个小数，逼近最优码率；从预测通往压缩的桥梁。" } }
two-part-code: { en: two-part code, zh: 两部分编码, def: { en: "A minimum-description-length encoding that records a model first and then records the data using that model.", zh: "一种 MDL 编码，先发送模型、再发送给定模型下的数据；其总长度形式化了拟合与复杂度的权衡。" } }
temporal-difference: { en: temporal-difference, zh: 时序差分, def: { en: "A reinforcement-learning update that bootstraps a value estimate from the next step's estimate rather than waiting for the final return.", zh: "一种强化学习更新，用下一步的估计来自举当前价值估计，而非等到最终回报。" } }
evolution-strategies: { en: evolution strategies, zh: 进化策略, def: { en: "A black-box optimizer that perturbs parameters with noise and moves toward the higher-reward perturbations, needing no gradients.", zh: "一种黑盒优化器，用噪声扰动参数并朝奖励更高的扰动方向移动，无需梯度。" } }
kv-cache: { en: key-value cache, zh: KV 缓存, def: { en: "A store of attention keys and values from earlier tokens that lets each decode step reuse prior computation.", zh: "保存过去词元的键和值、使解码无需重算即可关注它们的缓存；主导服务的内存成本。" } }
diffusion: { en: diffusion, zh: 扩散, def: { en: "A generative process that learns to reverse a gradual noising of data, turning pure noise into a sample step by step.", zh: "一种生成过程，学习逆转对数据逐步加噪的过程，把纯噪声一步步变成样本。" } }
flow-matching: { en: flow matching, zh: 流匹配, def: { en: "A generative-model training method that learns a velocity field for transporting samples from a noise distribution to the data distribution.", zh: "通过回归一个把噪声沿近乎直线路径输运到数据的速度场来训练生成模型；扩散训练的更简单替代。" } }
score: { en: score, zh: 分数, def: { en: "The gradient of a probability distribution's log density with respect to its input, indicating the direction of increasing density.", zh: "对数概率密度关于数据的梯度；扩散模型学习它以判断该往哪个方向去噪。" } }
sde: { en: stochastic differential equation, zh: 随机微分方程, abbr: SDE, def: { en: "A differential equation that includes a random process and therefore describes both deterministic change and noise over continuous time.", zh: "由随机噪声驱动的微分方程；扩散前向与逆向过程的连续时间视角。" } }
ode: { en: ordinary differential equation, zh: 常微分方程, abbr: ODE, def: { en: "An equation that relates a function of one independent variable to one or more of its derivatives.", zh: "一种确定性的微分方程；扩散或流模型的采样可化作求解它，从而支持快速的少步求解器。" } }
autoregression: { en: autoregression, zh: 自回归, def: { en: "A generation method that produces one sequence element at a time, conditioning each new element on those already produced.", zh: "一次生成序列中的一个元素、每个都以其前文为条件；语言模型的主导范式。" } }
non-autoregressive: { en: non-autoregressive generation, zh: 非自回归生成, abbr: NAR, def: { en: "A generation method that predicts multiple output elements in parallel instead of conditioning each one on the preceding outputs.", zh: "并行产出多个输出词元、而非逐个生成，以一定质量换取大幅降低的延迟。" } }
cfg: { en: classifier-free guidance, zh: 无分类器引导, abbr: CFG, def: { en: "A sampling trick that pushes a conditional generator away from its unconditional output to sharpen prompt adherence, trading diversity for fidelity.", zh: "一种采样技巧，把条件生成器推离其无条件输出以增强对提示的贴合，以多样性换保真度。" } }
dit: { en: diffusion transformer, zh: 扩散 Transformer, abbr: DiT, def: { en: "A diffusion model whose denoiser is a transformer over patches rather than a U-Net, the scalable backbone of modern image and video generators.", zh: "去噪器为作用于图块的 Transformer（而非 U-Net）的扩散模型，是现代图像与视频生成器可扩展的骨干。" } }
rectified-flow: { en: rectified flow, zh: 修正流, def: { en: "A flow-matching variant that straightens the transport paths between noise and data so fewer solver steps suffice for high quality.", zh: "一种流匹配变体，把噪声与数据之间的输运路径拉直，使更少的求解步即可达到高质量。" } }
ddpm: { en: denoising diffusion probabilistic models, zh: 去噪扩散概率模型, abbr: DDPM, def: { en: "A discrete-time diffusion formulation that trains a network to reverse a fixed process that gradually adds noise to data.", zh: "奠基性的离散时间扩散表述，训练网络预测每一步所加的噪声。" } }
fertility: { en: fertility, zh: 繁殖度, def: { en: "The average number of tokens a tokenizer produces for each word in a language or dataset.", zh: "分词器平均每个词产生的词元数；繁殖度越低，对某种语言的词表越高效。" } }
asr: { en: automatic speech recognition, zh: 自动语音识别, abbr: ASR, def: { en: "A system that converts spoken audio into written text.", zh: "把语音音频转写为文本；语音界面的输入侧。" } }
ctc: { en: connectionist temporal classification, zh: 连接主义时序分类, abbr: CTC, def: { en: "A loss that trains sequence models without requiring each input position to be aligned with a target label.", zh: "一种无需对齐目标的序列标注损失，对所有可能对齐求和；语音识别的常用方法。" } }
tts: { en: text-to-speech, zh: 文本到语音, abbr: TTS, def: { en: "A system that converts written text into spoken audio.", zh: "从文本合成自然的语音音频；语音界面的输出侧。" } }
clip: { en: contrastive language-image pretraining, zh: 对比语言-图像预训练, abbr: CLIP, def: { en: "A training method that places matching images and text near each other in a shared embedding space and separates mismatched pairs.", zh: "训练图像与文本编码器，使匹配对在共享嵌入空间中相邻，支撑零样本分类与检索。" } }
vit: { en: vision transformer, zh: 视觉 Transformer, abbr: ViT, def: { en: "A transformer that treats an image as a sequence of patches, bringing the architecture and its scaling to vision.", zh: "把图像视为图块序列的 Transformer，将该架构及其扩展能力带入视觉。" } }
vlm: { en: vision-language model, zh: 视觉语言模型, abbr: VLM, def: { en: "A model that processes images and text together to answer questions, describe visual content, or perform other multimodal tasks.", zh: "同时接收图像与文本并对其联合推理的模型，是多模态助手的基础。" } }
world-model: { en: world model, zh: 世界模型, def: { en: "A learned model of an environment's dynamics that an agent can roll forward to predict and plan, instead of acting only reactively.", zh: "对环境动力学习得的模型，智能体可向前推演以预测和规划，而非只做被动反应。" } }
vla: { en: vision-language-action model, zh: 视觉-语言-动作模型, abbr: VLA, def: { en: "A model that maps visual and language input directly to robot or agent actions, extending VLMs to control.", zh: "把视觉与语言输入直接映射为机器人或智能体动作的模型，把 VLM 扩展到控制。" } }
mechanistic-interpretability: { en: mechanistic interpretability, zh: 机械可解释性, def: { en: "The study of how a neural network implements behavior by identifying understandable features, circuits, and computations inside it.", zh: "把网络的内部计算逆向工程为人类可理解的电路与特征，而非将其当作黑箱。" } }
polysemanticity: { en: polysemanticity, zh: 多义性, def: { en: "A property in which one neuron or feature responds to several unrelated concepts, making its activation difficult to interpret.", zh: "单个神经元对多个不相关概念都有反应、使激活难以解读的现象；稀疏自编码器试图消解的问题。" } }
superposition: { en: superposition, zh: 叠加, def: { en: "A representation strategy in which a network stores more features than it has dimensions by using overlapping directions in activation space.", zh: "网络把多于神经元数量的特征表示为激活空间中重叠的方向，从而塞下更多特征；多义性的成因。" } }
scalable-oversight: { en: scalable oversight, zh: 可扩展监督, def: { en: "A family of methods for supervising work that is too difficult or abundant for people to check directly, often with assistance from other models.", zh: "在任务难到或多到人类无法直接检查时仍能监督模型的方法，常借助 AI 来辅助监督。" } }
human-in-the-loop: { en: human-in-the-loop, zh: 人在回路中, abbr: HITL, def: { en: "A system design that inserts human judgment at defined points to approve, correct, label, escalate, or stop model behavior.", zh: "一种系统设计，在明确位置插入人的判断，用来批准、纠正、标注、升级或停止模型行为。" } }
calibrated-reliance: { en: calibrated reliance, zh: 校准后的依赖, def: { en: "A pattern of relying on automation when evidence supports it and checking or overriding it when uncertainty or risk is high.", zh: "在自动化很可能有用时依赖它，在不确定性、风险或证据要求时保留、检查或覆盖它。" } }
automation-bias: { en: automation bias, zh: 自动化偏差, def: { en: "The tendency to over-rely on automated recommendations, especially when the system appears authoritative or the user is under time pressure.", zh: "过度依赖自动化建议的倾向，在系统显得权威或用户有时间压力时尤其明显。" } }
weak-to-strong: { en: weak-to-strong, zh: 弱到强, def: { en: "A research setting that tests whether supervision from a weaker model can elicit useful behavior from a stronger model.", zh: "研究较弱的监督者能否引出更强模型的全部能力，是人类监督超人系统的一种代理。" } }
deceptive-alignment: { en: deceptive alignment, zh: 欺骗性对齐, def: { en: "A hypothesized failure in which a model appears to follow its training objective while monitored but pursues a different objective when unobserved.", zh: "一种失效：模型在被观察时表现得对齐，一旦判断时机成熟便追求另一目标，是最难检测的安全情形。" } }
sleeper-agents: { en: sleeper agents, zh: 沉睡特工, def: { en: "Sleeper agents are models trained to behave normally until a trigger causes them to produce a hidden behavior.", zh: "被训练成平时正常、直到触发条件激活隐藏行为的模型，且能在安全训练后幸存；欺骗性对齐的一个实证。" } }
red-teaming: { en: red-teaming, zh: 红队, def: { en: "A structured effort to test a system adversarially and uncover failures, abuse paths, and potential harms before deployment.", zh: "对抗性地探测系统，在部署前暴露失效、越狱与危害。" } }
prompt-injection: { en: prompt injection, zh: 提示注入, def: { en: "An attack where untrusted content in the model's input overrides its instructions, hijacking an agent through the data it reads.", zh: "一种攻击：模型输入中不可信的内容覆盖其指令，通过其读取的数据劫持智能体。" } }
obo: { en: on-behalf-of, zh: 代表用户, abbr: OBO, def: { en: "A delegation pattern in which a service acts using a particular user's identity and authorized permissions.", zh: "一种委派模式：服务以用户的身份与权限行事，是限定智能体可为谁做什么的基础。" } }
jailbreak: { en: jailbreak, zh: 越狱, def: { en: "A prompt crafted to bypass a model's safety training and elicit content it was tuned to refuse.", zh: "精心构造、用于绕过模型安全训练、诱出其本应拒绝的内容的提示。" } }
lethal-trifecta: { en: lethal trifecta, zh: 致命三元组, def: { en: "The dangerous combination of access to private data, exposure to untrusted content, and the ability to communicate externally, which together enable exfiltration.", zh: "访问私有数据、接触不可信内容、能对外通信三者的危险组合，合在一起即可造成数据外泄。" } }
instruction-hierarchy: { en: instruction hierarchy, zh: 指令层级, def: { en: "An ordering of trust over instruction sources (system over developer over user over tool output) so a model knows which to obey on conflict.", zh: "对指令来源按信任度排序（系统高于开发者、高于用户、高于工具输出），使模型在冲突时知道该听谁。" } }
gcg: { en: Greedy Coordinate Gradient, zh: 贪婪坐标梯度, abbr: GCG, def: { en: "A white-box attack that optimizes an adversarial suffix token by token to force a target output, producing transferable jailbreaks.", zh: "一种白盒攻击，逐词元优化对抗性后缀以迫使目标输出，可产生可迁移的越狱。" } }
adversarial-robustness: { en: adversarial robustness, zh: 对抗鲁棒性, def: { en: "A model's ability to preserve its intended behavior when an attacker deliberately crafts inputs to cause failure.", zh: "模型对专门构造、意在使其失效的输入的抵抗力；是一场军备竞赛，而非已解决的属性。" } }
over-refusal: { en: over-refusal, zh: 过度拒绝, def: { en: "A safety failure in which a model incorrectly declines a benign request because it resembles a harmful one.", zh: "安全调优使模型拒绝无害请求的现象，是为拒绝有害请求所付的假阳性代价。" } }
differential-privacy: { en: differential privacy, zh: 差分隐私, abbr: DP, def: { en: "A formal guarantee that a computation's output barely changes whether or not any single record is included, bounding what can be learned about an individual.", zh: "一种形式化保证：无论是否包含任一条记录，计算输出几乎不变，从而限定能推断出个体的信息。" } }
machine-unlearning: { en: machine unlearning, zh: 机器遗忘, def: { en: "A process that removes the influence of selected training data from a trained model without repeating the full original training run.", zh: "在不从头重训的前提下，从已训练模型中移除特定训练数据的影响。" } }
knowledge-editing: { en: knowledge editing, zh: 知识编辑, def: { en: "A method for changing a specific fact represented in a model while trying to preserve unrelated behavior.", zh: "外科手术式地更新模型所存的某个具体事实，理想情况下不扰动无关知识。" } }
watermarking: { en: watermarking, zh: 水印, def: { en: "A method for adding a detectable statistical signal to generated content so its source can later be assessed.", zh: "在生成内容中嵌入难以去除的统计信号，使其日后可被识别为机器所产。" } }
brussels-effect: { en: Brussels effect, zh: 布鲁塞尔效应, def: { en: "The tendency of EU regulation to become a de facto global standard because firms apply it everywhere rather than maintain two product lines.", zh: "欧盟监管成为事实上全球标准的倾向，因为企业宁愿处处适用、也不愿维护两条产品线。" } }
model-card: { en: model card, zh: 模型卡, def: { en: "A short standardized document reporting a model's intended use, training data, evaluations, and limitations.", zh: "一份简短的标准化文档，说明模型的预期用途、训练数据、评测与局限。" } }
datasheet: { en: datasheet, zh: 数据表, def: { en: "A standardized document recording how a dataset was collected, composed, and intended to be used, the data analog of a model card.", zh: "记录数据集如何采集、构成与预期用途的标准化文档，是模型卡在数据侧的对应物。" } }
system-card: { en: system card, zh: 系统卡, def: { en: "A document describing a deployed system as a whole, including its model, safeguards, and evaluated risks, broader than a model card.", zh: "描述整个已部署系统（含其模型、防护与已评估风险）的文档，范围比模型卡更广。" } }
gateway: { en: gateway, zh: 网关, def: { en: "A proxy in front of model providers that centralizes routing, auth, rate limits, cost tracking, and fallbacks across many backends.", zh: "置于模型提供商之前的代理，统一处理多后端的路由、鉴权、限流、成本追踪与回退。" } }
observability: { en: observability, zh: 可观测性, def: { en: "The ability to infer a system's internal state from signals such as logs, metrics, traces, prompts, token usage, and quality measurements.", zh: "从系统输出（日志、指标、追踪）理解其内部状态的能力；对 LLM 应用还延伸到提示、词元与质量。" } }
sandbox: { en: sandbox, zh: 沙箱, def: { en: "An isolated environment that confines untrusted code or agent actions so they cannot affect the host system.", zh: "一个隔离环境，约束不可信代码或智能体动作，使其无法影响宿主系统。" } }
sli: { en: service level indicator, zh: 服务水平指标, abbr: SLI, def: { en: "A measured metric of service behavior, such as latency or error rate, against which an SLO target is set.", zh: "对服务行为的一项测量指标（如延迟或错误率），SLO 目标即据其设定。" } }
private-test-set: { en: private test set, zh: 私有测试集, def: { en: "An evaluation set hidden from model developers to reduce the risk of optimizing or training directly against its examples.", zh: "对模型开发者保密的评测数据，使分数无法通过在测试集上训练而作弊。" } }
pairwise-comparison: { en: pairwise comparison, zh: 成对比较, def: { en: "An evaluation that presents two outputs and asks a judge to choose the better one according to stated criteria.", zh: "通过问两个输出哪个更好来评判质量，比绝对打分更可靠，是偏好数据与竞技场的基础。" } }
pass-at-k: { en: pass@k, zh: 至少一次成功率, def: { en: "The probability that at least one of k sampled attempts passes, the standard metric for code and other verifiable tasks.", zh: "k 次采样尝试中至少一次通过的概率，是代码等可验证任务的标准指标。" } }
contamination: { en: contamination, zh: 污染, def: { en: "A data problem in which evaluation examples or close variants appear in training data and can inflate measured performance.", zh: "评测数据泄漏进训练的情况，会在没有真实能力提升的情况下抬高基准分数。" } }
liveness: { en: liveness, zh: 活性, def: { en: "A formal system property stating that a desired event, such as progress or completion, will eventually occur.", zh: "保证好事终将发生（即有进展）的性质；在系统推理中与安全性成对出现。" } }
safety: { en: safety, zh: 安全性, def: { en: "A formal system property stating that prohibited states or events never occur.", zh: "作为形式化性质，保证坏事永不发生；在更广的 AI 语义下，指使系统不致造成危害。" } }
asic: { en: application-specific integrated circuit, zh: 专用集成电路, abbr: ASIC, def: { en: "A chip designed for one task, trading the generality of a CPU or GPU for far higher efficiency on that task.", zh: "为单一任务设计的芯片，以 CPU 或 GPU 的通用性换取在该任务上远更高的效率。" } }
cowos: { en: chip-on-wafer-on-substrate, zh: CoWoS, def: { en: "A TSMC packaging technology that connects compute dies and stacks of high-bandwidth memory through a shared silicon interposer.", zh: "台积电的先进封装，把计算裸片与 HBM 堆叠置于同一中介层上；AI 加速器的供应瓶颈。" } }
gpu: { en: graphics processing unit, zh: 图形处理器, abbr: GPU, def: { en: "A highly parallel processor developed for graphics and widely used to train and serve neural networks.", zh: "一种大规模并行处理器，最初用于图形，如今是训练与服务神经网络的主导加速器。" } }
tpu: { en: tensor processing unit, zh: 张量处理器, abbr: TPU, def: { en: "An accelerator designed by Google around matrix-multiplication hardware for machine-learning training and inference.", zh: "谷歌围绕大型矩阵乘单元打造的定制加速器，是深度学习中 GPU 的一种 ASIC 替代。" } }
sram: { en: static random-access memory, zh: 静态随机存取存储器, abbr: SRAM, def: { en: "SRAM stores each bit in a stable circuit without periodic refresh and is commonly used for fast on-chip caches.", zh: "无需刷新的快速片上存储；容量小且昂贵，用作贴近计算的缓存与寄存器堆。" } }
dram: { en: dynamic random-access memory, zh: 动态随机存取存储器, abbr: DRAM, def: { en: "DRAM stores bits in capacitors that require periodic refresh and provides most off-chip working memory.", zh: "更密集、更便宜但需周期性刷新的存储；片外容量的主体，包括加速器旁的 HBM。" } }
rdma: { en: remote direct memory access, zh: 远程直接内存访问, abbr: RDMA, def: { en: "A network capability letting one machine read or write another's memory without involving its CPU, key to fast collective communication.", zh: "一种网络能力，允许一台机器在不经对方 CPU 的情况下读写其内存，是快速集合通信的关键。" } }
ettr: { en: effective training time ratio, zh: 有效训练时间比, abbr: ETTR, def: { en: "The fraction of wall-clock time a training run spends making real progress, after subtracting failures, restarts, and stalls.", zh: "训练运行的墙钟时间中真正取得进展的比例，已扣除故障、重启与停顿。" } }
hfu: { en: hardware FLOPs utilization, zh: 硬件 FLOPs 利用率, abbr: HFU, def: { en: "The fraction of peak hardware throughput actually achieved, counting all FLOPs including recomputation, unlike MFU.", zh: "实际达到的硬件峰值算力比例，与 MFU 不同，它计入包括重算在内的所有 FLOPs。" } }
pue: { en: power usage effectiveness, zh: 电源使用效率, abbr: PUE, def: { en: "The ratio of a datacenter's total power consumption to the power used by its computing equipment, where values nearer 1 indicate less facility overhead.", zh: "数据中心总功耗除以送达 IT 设备的功耗；越接近 1，表示冷却等开销越小。" } }
sdc: { en: silent data corruption, zh: 静默数据损坏, abbr: SDC, def: { en: "Silent data corruption occurs when hardware produces an incorrect result without reporting a fault.", zh: "产生错误结果却不报任何故障的硬件错误，在大规模机群与长训练中是日益严重的隐患。" } }
smr: { en: small modular reactor, zh: 小型模块化反应堆, abbr: SMR, def: { en: "A factory-built nuclear reactor of modest output, proposed as a dedicated, steady power source for AI datacenters.", zh: "工厂化建造、出力适中的核反应堆，被提议作为 AI 数据中心专用的稳定电源。" } }
autodiff: { en: automatic differentiation, zh: 自动微分, def: { en: "A method that computes derivatives by applying the chain rule to the elementary operations executed by a program.", zh: "在程序执行时对每个基本运算应用求导法则来计算精确导数，而不是做数值差分或符号公式推导。" } }
