# Glossary: single source of truth for professional terms. Reference a term in
# any chapter with @gls-<key>; the pipeline expands it on first use per chapter
# (中文（English） / english (ABBR)), shows the short form after, links every use
# to the auto-generated glossary page, and warns on an undefined key. Add a term
# here once; never hand-maintain the gloss in prose.
#
#   <key>: { en: <full English>, zh: <full Chinese>, abbr: <optional abbreviation> }
#
# Optional def: a one-line definition shown on the glossary page so a reader who
# meets the term cold has somewhere to land. Without it the page falls back to
# the sentence where the term first appears, which is often enough but sometimes
# degenerate ("This is prefill."). Write it in both languages, terms byte-verbatim:
#
#   <key>: { en: ..., zh: ..., def: { en: <one line>, zh: <one line> } }

moe:  { en: mixture-of-experts, zh: 混合专家, abbr: MoE, def: { en: "An architecture that replaces a dense feed-forward layer with many expert layers and routes each token to a few, so capacity grows without proportional compute.", zh: "一种架构，用多个专家层替代稠密前馈层，并只把每个词元路由到少数专家，使模型容量增加时所需计算量不必同比增长。" } }
ssm:  { en: state-space model, zh: 状态空间模型, abbr: SSM, def: { en: "A sequence model that carries a recurrent hidden state instead of attending to all past tokens, giving linear-time inference and a fixed-size state.", zh: "一种序列模型，以循环隐藏状态而不是对全部历史词元做注意力来传递信息，因此推理时间随序列长度线性增长，且状态大小固定。" } }
ffn:  { en: feed-forward network, zh: 前馈网络, abbr: FFN, def: { en: "The position-wise sublayer applied to each token independently in a transformer block, holding most of the model's parameters and knowledge.", zh: "Transformer 块中的逐位置子层，分别处理每个词元，并承载模型的大部分参数和知识。" } }
mha:  { en: multi-head attention, zh: 多头注意力, abbr: MHA, def: { en: "An attention mechanism that divides queries, keys, and values among parallel heads so each head can learn different relationships between tokens.", zh: "一种注意力机制，将查询、键和值分配到多个并行注意力头，使不同注意力头能够学习词元之间的不同关系。" } }
mla:  { en: multi-head latent attention, zh: 多头潜在注意力, abbr: MLA, def: { en: "An attention design introduced with DeepSeek-V2 that compresses keys and values into a low-rank latent representation to reduce the KV cache.", zh: "DeepSeek-V2 提出的一种注意力设计，将键和值压缩为低秩潜在表示，以减小 KV 缓存。" } }
sft:  { en: supervised fine-tuning, zh: 监督微调, abbr: SFT, def: { en: "A post-training stage that teaches a pretrained model to follow instructions by training it on curated input-output examples.", zh: "后训练的一个阶段，通过精选的输入输出示例，让预训练模型学会遵循指令。" } }
peft: { en: parameter-efficient fine-tuning, zh: 参数高效微调, abbr: PEFT, def: { en: "A family of adaptation methods that trains a small set of added or selected parameters while leaving most pretrained weights frozen.", zh: "一类模型适配方法，只训练少量新增或选定参数，并冻结大部分预训练权重。" } }
bpe:  { en: byte-pair encoding, zh: 字节对编码, abbr: BPE, def: { en: "A tokenizer training algorithm that starts from bytes and repeatedly merges the most frequent adjacent pair into a new token, building a subword vocabulary.", zh: "一种分词器训练算法，从字节开始，反复将最常见的相邻项合并为新词元，逐步构建子词词表。" } }
scaling-law: { en: scaling law, zh: 扩展律, def: { en: "An empirical power law relating model loss to compute, parameters, and data, used to predict quality and allocate a training budget.", zh: "一种经验幂律，描述模型损失与算力、参数量和数据量之间的关系，用于预测质量并分配训练预算。" } }
next-token-prediction: { en: next-token prediction, zh: 下一词元预测, def: { en: "A pretraining objective that asks a model to predict each token from the tokens that precede it.", zh: "一种预训练目标，要求模型根据此前的词元预测当前词元。" } }
cross-entropy: { en: cross-entropy, zh: 交叉熵, def: { en: "A loss that measures how much probability a model assigns to the correct answer compared with its full predicted distribution.", zh: "一种损失函数，根据模型完整预测分布中分配给正确答案的概率来衡量预测误差。" } }
perplexity: { en: perplexity, zh: 困惑度, def: { en: "The exponential of cross-entropy, often interpreted as the average number of plausible token choices the model considers at each step.", zh: "交叉熵的指数，常解释为模型在每一步平均考虑的合理词元选项数量。" } }
training-tokens: { en: training tokens, zh: 训练词元, def: { en: "The total number of token instances processed during pretraining, including repeated examples and additional passes through the data.", zh: "预训练期间处理的词元实例总数，包括重复样本和对数据的额外遍历。" } }
compute-optimal: { en: compute-optimal, zh: 计算最优, def: { en: "A balance between model size and training data that produces the lowest expected loss for a fixed compute budget.", zh: "在固定算力预算下，能够取得最低预期损失的模型规模与训练数据之间的平衡。" } }
adamw: { en: AdamW, zh: AdamW 优化器, def: { en: "A version of the Adam optimizer that applies weight decay separately from the gradient-based parameter update.", zh: "Adam 优化器的一种变体，将权重衰减与基于梯度的参数更新分开处理。" } }
warmup-stable-decay: { en: warmup-stable-decay, zh: 预热-稳定-衰减调度, abbr: WSD, def: { en: "A learning-rate schedule that warms up, stays constant for most of training, and decays near the end.", zh: "一种学习率调度，先逐步升高学习率，在大部分训练期间保持不变，并在接近结束时降低。" } }
mid-training: { en: mid-training, zh: 中段训练, def: { en: "A pretraining-like phase between broad pretraining and post-training, usually mixing specialized or higher-quality data while continuing next-token training.", zh: "一个类似预训练的阶段，位于通用预训练和后训练之间，通常会在继续进行下一词元训练时混入专业领域或更高质量的数据。" } }
continued-pretraining: { en: continued pretraining, zh: 继续预训练, def: { en: "A training phase that continues the next-token objective on an existing pretrained model, often using data from a specific domain.", zh: "一个训练阶段，在已有预训练模型上继续优化下一词元目标，通常使用特定领域的数据。" } }
z-loss: { en: z-loss, zh: z-loss 正则, def: { en: "A small auxiliary penalty on the log of the softmax normalizer that keeps logits from drifting, stabilizing the training of large models.", zh: "一个较小的辅助惩罚项，作用于 softmax 归一化因子的对数，可抑制 logit 漂移并稳定大模型训练。" } }
qk-norm: { en: query-key normalization, zh: 查询-键归一化, abbr: QK-norm, def: { en: "A stabilization technique that normalizes query and key vectors before their dot product to limit the growth of attention logits.", zh: "一种稳定训练的技术，在查询向量与键向量做点积前将二者归一化，以限制注意力 logit 的增长。" } }
gradient-clipping: { en: gradient clipping, zh: 梯度裁剪, def: { en: "A stabilization technique that limits gradient magnitude before an update to prevent unusually large gradients from disrupting training.", zh: "一种稳定训练的技术，在更新前限制梯度大小，避免异常大的梯度扰乱训练。" } }
minhash: { en: MinHash, zh: 最小哈希, def: { en: "A hashing scheme that cheaply estimates set similarity, used to find and remove near-duplicate documents in a training corpus.", zh: "一种能够低成本估算集合相似度的哈希方案，用于在训练语料中发现并删除近重复文档。" } }
decontamination: { en: decontamination, zh: 去污染, def: { en: "The removal of training examples that overlap with evaluation data, preventing memorization from inflating benchmark scores.", zh: "从训练数据中移除与评测数据重叠的样本，避免模型因记忆样本而抬高基准分数。" } }
tokenizer: { en: tokenizer, zh: 分词器, def: { en: "A component that converts raw text into the integer token identifiers a model consumes and converts model output back into text.", zh: "一种组件，将原始文本转换为模型使用的整数词元标识符，并把模型输出还原为文本。" } }
sentencepiece: { en: SentencePiece, zh: SentencePiece 分词器, def: { en: "A language-agnostic tokenizer that trains directly on raw text without pre-tokenization, treating the input including whitespace as one stream.", zh: "一种不依赖特定语言的分词器，无需预分词即可直接在原始文本上训练，并将包括空格在内的输入视为连续字符流。" } }
tokenizer-free: { en: tokenizer-free, zh: 无分词器方案, def: { en: "An approach that drops a fixed vocabulary and models bytes or characters directly, trading tokenizer biases for longer sequences.", zh: "一种不使用固定词表、直接对字节或字符建模的方法，以更长的序列为代价减少分词器带来的偏差。" } }
residual-stream: { en: residual stream, zh: 残差流, def: { en: "The shared vector that passes through a transformer while each block reads it and adds its own update.", zh: "贯穿 Transformer 的共享向量，每个块都会读取它，并把自己的更新加回其中。" } }
rmsnorm: { en: root mean square layer normalization, zh: 均方根层归一化, abbr: RMSNorm, def: { en: "A normalization method that rescales activations by their root mean square without subtracting their mean.", zh: "一种归一化方法，按激活值的均方根重新缩放激活值，但不减去均值。" } }
rope: { en: rotary position embedding, zh: 旋转位置嵌入, abbr: RoPE, def: { en: "A position-encoding method that rotates query and key vectors by position-dependent angles so their dot product reflects relative position.", zh: "一种位置编码方法，按位置相关的角度旋转查询向量和键向量，使二者的点积能够反映相对位置。" } }
swiglu: { en: Swish-gated linear unit, zh: Swish 门控线性单元, abbr: SwiGLU, def: { en: "A gated feed-forward layer that combines a Swish-activated projection with a second projection before producing its output.", zh: "一种门控前馈层，将经过 Swish 激活的投影与另一个投影结合后生成输出。" } }
flashattention: { en: FlashAttention, zh: FlashAttention 注意力内核, def: { en: "An exact attention algorithm that avoids storing the full score matrix in main memory, reducing memory traffic and accelerating attention.", zh: "一种精确注意力算法，无需在主存中保存完整的分数矩阵，因此可减少内存数据传输并加快注意力计算。" } }
zero: { en: Zero Redundancy Optimizer, zh: 零冗余优化器, abbr: ZeRO, def: { en: "A data-parallel method that shards optimizer states, gradients, and parameters across devices instead of replicating them, cutting per-device memory.", zh: "一种数据并行方法，把优化器状态、梯度和参数分片到各设备而非各自复制，从而降低单设备显存。" } }
fsdp: { en: fully sharded data parallel, zh: 全分片数据并行, abbr: FSDP, def: { en: "A PyTorch distributed-training method that shards parameters, gradients, and optimizer state, gathering each layer's parameters only when needed.", zh: "PyTorch 提供的一种分布式训练方法，将参数、梯度和优化器状态分片，并只在需要时收集当前层的参数。" } }
lsh:  { en: locality-sensitive hashing, zh: 局部敏感哈希, abbr: LSH, def: { en: "A hashing method designed to place similar items in the same bucket with high probability, supporting approximate search and deduplication.", zh: "一种哈希方法，使相似项以较高概率进入同一个桶，可用于近似搜索和去重。" } }
mup:  { en: maximal update parametrization, zh: 最大更新参数化, abbr: muP, def: { en: "A parametrization that keeps the optimal learning rate stable across model widths, so hyperparameters tuned on a small model transfer to a large one.", zh: "一种使最优学习率在不同模型宽度间保持稳定的参数化，使在小模型上调好的超参数可迁移到大模型。" } }
tp:   { en: tensor parallelism, zh: 张量并行, abbr: TP, def: { en: "A distributed-computing method that splits each layer's tensors across devices that cooperate on the same forward and backward pass.", zh: "一种分布式计算方法，将每层的张量拆分到多个设备，由这些设备共同完成同一次前向传播和反向传播。" } }
pp:   { en: pipeline parallelism, zh: 流水线并行, abbr: PP, def: { en: "A distributed-computing method that assigns successive groups of layers to different devices and streams microbatches through them.", zh: "一种分布式计算方法，将连续的若干层分配到不同设备，并让微批次依次流经这些设备。" } }
dp:   { en: data parallelism, zh: 数据并行, abbr: DP, def: { en: "A distributed training method that replicates the model across devices, processes a different batch shard on each, and then combines their gradients.", zh: "一种分布式训练方法，在多个设备上复制模型，让各设备处理不同的批次分片，再合并所得梯度。" } }
mfu:  { en: model FLOPs utilization, zh: 模型 FLOPs 利用率, abbr: MFU, def: { en: "The fraction of a device's peak arithmetic throughput actually spent on useful model FLOPs, a headline training-efficiency metric.", zh: "设备峰值运算吞吐量中实际用于有效模型浮点运算的比例，是常用的训练效率指标。" } }
reward-hacking: { en: reward hacking, zh: 奖励欺骗, def: { en: "A failure in which a model earns a high measured reward by exploiting the metric instead of achieving the intended goal.", zh: "一种失效，模型利用度量中的漏洞获得较高奖励，却没有实现预期目标。" } }

# Retrieval / serving / agents
rag:  { en: retrieval-augmented generation, zh: 检索增强生成, abbr: RAG, def: { en: "A method that retrieves relevant documents at query time and adds them to the prompt so the model can answer from that evidence.", zh: "一种方法，在查询时检索相关文档并将其加入提示，使模型能够依据这些证据作答。" } }
ttft: { en: time to first token, zh: 首词元时间, abbr: TTFT, def: { en: "The elapsed time between submitting a request and receiving the first generated token.", zh: "从提交请求到收到第一个生成词元之间经过的时间。" } }
tpot: { en: time per output token, zh: 每词元延迟, abbr: TPOT, def: { en: "The average time required to generate each token after a response begins streaming.", zh: "响应开始流式返回后，生成每个词元平均需要的时间。" } }
slo:  { en: service-level objective, zh: 服务等级目标, abbr: SLO, def: { en: "A target threshold for a service metric, such as p99 latency under a bound, that a serving system commits to meeting.", zh: "服务系统承诺达到的指标阈值，例如要求 p99 延迟不超过某个上限。" } }
prefill: { en: prefill, zh: 预填充, def: { en: "The initial inference pass that processes the full prompt and computes the keys and values needed for later token generation.", zh: "初始推理阶段，处理完整提示，并计算后续生成词元所需的键和值。" } }
decode: { en: decode, zh: 解码, def: { en: "The inference phase after prefill that generates one token at a time while reusing cached keys and values.", zh: "预填充之后的推理阶段，复用已缓存的键和值，每次生成一个词元。" } }
goodput: { en: goodput, zh: 有效吞吐量, def: { en: "The rate of completed requests that satisfy a service's latency or other acceptance targets.", zh: "满足服务延迟或其他验收目标的已完成请求速率。" } }
continuous-batching: { en: continuous batching, zh: 连续批处理, def: { en: "A serving scheduler that adds and removes requests between decode steps so completed requests release capacity immediately.", zh: "一种服务调度方式，在解码步骤之间加入和移除请求，使已完成请求能够立即释放容量。" } }
pagedattention: { en: PagedAttention, zh: PagedAttention 分页注意力, def: { en: "A KV-cache allocator that stores the cache in fixed-size pages like virtual memory, ending the fragmentation of reserving one contiguous block per sequence.", zh: "一种 KV 缓存分配器，像虚拟内存一样以固定大小的页存储缓存，避免为每个序列预留连续空间造成的碎片。" } }
prefix-caching: { en: prefix caching, zh: 前缀缓存, def: { en: "A serving optimization that reuses the KV cache for a prompt prefix shared by multiple requests, avoiding repeated prefill work.", zh: "一种服务优化方法，复用多个请求共享提示前缀的 KV 缓存，避免重复执行预填充。" } }
speculative-decoding: { en: speculative decoding, zh: 推测解码, def: { en: "A decoding method in which a faster model drafts several tokens and the target model verifies them together.", zh: "一种解码方法，由较快的模型起草多个词元，再由目标模型一次完成验证。" } }
constrained-decoding: { en: constrained decoding, zh: 约束解码, def: { en: "A decoding method that permits only tokens allowed by a grammar or schema at each step, ensuring structurally valid output.", zh: "一种解码方法，每一步只允许生成符合语法或模式的词元，从而保证输出结构有效。" } }
fsm: { en: finite-state machine, zh: 有限状态机, abbr: FSM, def: { en: "A computational model with a finite set of states and rules for moving between them in response to input.", zh: "一种计算模型，包含有限个状态，以及根据输入在这些状态之间转换的规则。" } }
attention-sink: { en: attention sink, zh: 注意力汇, def: { en: "An initial token that receives substantial attention even when its content is unimportant, helping some models preserve behavior over long contexts.", zh: "一个位于序列开头的词元，即使内容并不重要也会获得大量注意力，可帮助部分模型在长上下文中维持原有行为。" } }
bm25: { en: BM25, zh: BM25 稀疏检索, def: { en: "A lexical ranking function that scores documents from query-term frequency, document length, and how rare each term is across the collection.", zh: "一种词法排序函数，根据查询词频、文档长度以及各词在文档集合中的稀有程度为文档评分。" } }
hnsw: { en: hierarchical navigable small-world, zh: 分层可导航小世界图, abbr: HNSW, def: { en: "A graph index for approximate nearest-neighbor search over vectors, navigating layered links to find close embeddings fast.", zh: "一种用于向量近似最近邻搜索的图索引，通过分层链接快速找到相近的嵌入。" } }
hybrid-search: { en: hybrid search, zh: 混合搜索, def: { en: "A retrieval method that combines lexical scores with vector similarity so results can reflect both exact terms and semantic meaning.", zh: "一种检索方法，将词法分数与向量相似度结合，使结果同时反映精确词项和语义含义。" } }
dual-encoder: { en: dual-encoder, zh: 双编码器, def: { en: "A retrieval model that embeds queries and documents separately, allowing document vectors to be computed before a search begins.", zh: "一种检索模型，分别对查询和文档生成嵌入，因此可以在搜索开始前预先计算文档向量。" } }
cross-encoder: { en: cross-encoder, zh: 交叉编码器, def: { en: "A model that scores a query and document jointly in one pass, more accurate than a dual-encoder but too costly to run over a whole corpus, so used to rerank.", zh: "一种模型，在一次前向传播中联合为查询和文档评分，通常比双编码器更准确，但计算成本过高，无法遍历整个语料库，因此用于重排。" } }
ocr: { en: optical character recognition, zh: 光学字符识别, abbr: OCR, def: { en: "A process that converts text in scanned documents, photographs, or other images into machine-readable characters.", zh: "一种处理过程，将扫描文档、照片或其他图像中的文字转换为机器可读的字符。" } }
virtual-key: { en: virtual key, zh: 虚拟密钥, def: { en: "A gateway-issued credential mapped to an upstream provider key, letting an operator set per-team budgets, limits, and revocation without sharing the real key.", zh: "网关签发并映射到上游提供商密钥的凭证，使运营方无需共享真实密钥，即可按团队设置预算和限额，或单独吊销凭证。" } }
# Attention / architecture
mqa:  { en: multi-query attention, zh: 多查询注意力, abbr: MQA, def: { en: "An attention variant where all query heads share a single key/value head, cutting the KV cache by a factor of the head count at some quality risk.", zh: "一种注意力变体，让所有查询头共享同一个键值头，可将 KV 缓存缩小到原来的注意力头数分之一，但可能影响质量。" } }
gqa:  { en: grouped-query attention, zh: 分组查询注意力, abbr: GQA, def: { en: "An attention design in which each group of query heads shares one set of keys and values, reducing KV-cache memory relative to MHA.", zh: "一种注意力设计，让每组查询头共享一组键和值，因此所需 KV 缓存小于多头注意力。" } }
# Reasoning / RL
prm:  { en: process reward model, zh: 过程奖励模型, abbr: PRM, def: { en: "A reward model that scores each step of a reasoning trace, not just the final answer, giving denser signal for training and search.", zh: "一种奖励模型，为推理轨迹中的每个步骤而不只是最终答案评分，从而为训练和搜索提供更密集的信号。" } }
mcts: { en: Monte Carlo tree search, zh: 蒙特卡洛树搜索, abbr: MCTS, def: { en: "A search method that grows a decision tree by sampling outcomes, updating value estimates, and balancing exploration with promising choices.", zh: "一种搜索方法，通过采样结果、更新价值估计，并在探索与较有希望的选择之间取得平衡，逐步扩展决策树。" } }
rlvr: { en: reinforcement learning with verifiable rewards, zh: 可验证奖励的强化学习, abbr: RLVR, def: { en: "A reinforcement-learning method in which an automatic checker, such as a unit test or exact-answer rule, supplies the reward.", zh: "一种强化学习方法，由单元测试或精确答案规则等自动校验器提供奖励。" } }
mdl:  { en: minimum description length, zh: 最小描述长度, abbr: MDL, def: { en: "A model-selection principle that prefers the model producing the shortest combined description of itself and the data.", zh: "一种模型选择原则，倾向于选择能让模型自身与数据的合计描述最短的模型。" } }
# Interpretability
sae:  { en: sparse autoencoder, zh: 稀疏自编码器, abbr: SAE, def: { en: "An interpretability tool that decomposes a model's activations into many sparse, more monosemantic features, used to read what a network represents.", zh: "一种可解释性工具，将模型激活分解为大量稀疏且语义更单一的特征，用于分析网络表示的内容。" } }
# Hardware / reliability
hbm:  { en: high-bandwidth memory, zh: 高带宽内存, abbr: HBM, def: { en: "A stack of DRAM dies placed close to an accelerator to provide more data-transfer bandwidth than conventional off-chip memory.", zh: "靠近加速器放置的多层 DRAM 裸片，可提供高于传统片外存储器的数据传输带宽。" } }
ici:  { en: inter-chip interconnect, zh: 芯片间互连, abbr: ICI, def: { en: "The high-speed links connecting accelerators directly (such as NVLink or a TPU's ICI), carrying the collective traffic of tensor and pipeline parallelism.", zh: "直接连接加速器的高速链路（如 NVLink 或 TPU 的 ICI），承载张量并行与流水线并行的集合通信。" } }
mtbf: { en: mean time between failures, zh: 平均无故障时间, abbr: MTBF, def: { en: "The average operating time expected between one hardware failure and the next.", zh: "一次硬件故障与下一次硬件故障之间的预期平均运行时间。" } }
lru:  { en: least recently used, zh: 最近最少使用, abbr: LRU, def: { en: "A cache eviction policy that removes the entry that has gone unused for the longest time.", zh: "一种缓存淘汰策略，移除最长时间未被使用的条目。" } }
# Defined for @gls use (not auto-migrated: the book uses the abbr directly)
llm:  { en: large language model, zh: 大语言模型, abbr: LLM, def: { en: "A neural network trained on large text collections to model language and generate text in response to a prompt.", zh: "一种神经网络，在大规模文本集合上训练以建模语言，并根据提示生成文本。" } }
rlhf: { en: reinforcement learning from human feedback, zh: 基于人类反馈的强化学习, abbr: RLHF, def: { en: "A post-training method that learns a reward model from human preferences and then optimizes a policy against that reward.", zh: "一种后训练方法，先从人类偏好中学习奖励模型，再根据该奖励优化策略。" } }
dpo:  { en: direct preference optimization, zh: 直接偏好优化, abbr: DPO, def: { en: "A post-training method that learns directly from preferred and rejected response pairs without a separate reward model or reinforcement-learning loop.", zh: "一种后训练方法，直接从入选和落选的响应对中学习，无需单独训练奖励模型或运行强化学习循环。" } }

# --- comprehensive pass: per-part subagent definitions ---
cot: { en: chain of thought, zh: 思维链, abbr: CoT, def: { en: "A sequence of intermediate reasoning steps produced before a model gives its final answer.", zh: "模型在给出最终答案之前生成的一系列中间推理步骤。" } }
mcp: { en: Model Context Protocol, zh: 模型上下文协议, abbr: MCP, def: { en: "An open protocol standardizing how an agent connects to external tools and data sources, so a host can talk to many servers uniformly.", zh: "一种开放协议，标准化智能体连接外部工具与数据源的方式，使宿主能以统一方式对接众多服务器。" } }
capex: { en: capital expense, zh: 资本性支出, abbr: CapEx, def: { en: "Capital expenses pay for long-lived assets such as accelerators, networking equipment, and datacenters that are depreciated over time.", zh: "资本性支出用于购买加速器、网络设备和数据中心等长期资产，这些资产会随时间计提折旧。" } }
opex: { en: operating expense, zh: 运营性支出, abbr: OpEx, def: { en: "Operating expenses are the recurring costs of running a service, including power, bandwidth, maintenance, and rented cloud capacity.", zh: "运营性支出是运行服务时反复发生的成本，包括电力、带宽、维护和租用的云容量。" } }
lora: { en: low-rank adaptation, zh: 低秩适配, abbr: LoRA, def: { en: "A PEFT method that freezes the base weights and learns a small low-rank update per layer, so many task adapters share one base model.", zh: "一种参数高效微调方法，冻结基座权重，并为每层学习一个小型低秩更新，使多个任务适配器能够共享同一个基座模型。" } }
qlora: { en: quantized low-rank adaptation, zh: 量化低秩适配, abbr: QLoRA, def: { en: "A fine-tuning method that applies LoRA adapters to a quantized base model to reduce the memory required for training.", zh: "一种微调方法，在量化后的基座模型上应用 LoRA 适配器，以降低训练所需的内存。" } }
ppo: { en: proximal policy optimization, zh: 近端策略优化, abbr: PPO, def: { en: "A policy-gradient reinforcement-learning algorithm that limits each update so the new policy does not move too far from the previous one.", zh: "一种策略梯度强化学习算法，限制每次更新的幅度，避免新策略偏离上一策略过远。" } }
kl: { en: Kullback-Leibler divergence, zh: Kullback-Leibler 散度, abbr: KL, def: { en: "An asymmetric measure of how one probability distribution differs from another, often used to limit policy drift during alignment.", zh: "一种非对称度量，用于表示一个概率分布与另一个概率分布之间的差异，在对齐中常用于限制策略漂移。" } }
rlaif: { en: reinforcement learning from AI feedback, zh: 基于 AI 反馈的强化学习, abbr: RLAIF, def: { en: "A post-training method that uses model-generated preferences or critiques as reinforcement-learning feedback instead of relying only on human labels.", zh: "一种后训练方法，将模型生成的偏好或批评作为强化学习反馈，而不只依赖人工标注。" } }
ipo: { en: identity preference optimization, zh: 恒等偏好优化, abbr: IPO, def: { en: "A DPO variant that replaces the log-sigmoid loss with a squared objective to curb overfitting to preference pairs.", zh: "一种 DPO 变体，用平方目标替换 log-sigmoid 损失，以抑制对偏好对的过拟合。" } }
kto: { en: Kahneman-Tversky optimization, zh: Kahneman-Tversky 优化, abbr: KTO, def: { en: "A preference method that learns from unpaired good/bad labels with a prospect-theory-inspired loss, needing no preference pairs.", zh: "一种偏好学习方法，使用受前景理论启发的损失从未配对的正面或负面标签中学习，无需偏好对。" } }
orpo: { en: odds-ratio preference optimization, zh: 优势比偏好优化, abbr: ORPO, def: { en: "A method that folds preference alignment into SFT with an odds-ratio penalty, removing the need for a separate reference model.", zh: "一种使用优势比惩罚将偏好对齐并入监督微调的方法，无需单独的参考模型。" } }
simpo: { en: simple preference optimization, zh: 简单偏好优化, abbr: SimPO, def: { en: "A reference-free DPO variant using the average log-probability as an implicit reward with a target margin, simpler and memory-light.", zh: "一种无参考模型的 DPO 变体，用平均对数概率作隐式奖励并设目标间隔，更简单且省显存。" } }
raft: { en: reward ranked fine-tuning, zh: 奖励排序微调, abbr: RAFT, def: { en: "An iterative training method that samples candidate responses, selects those with the highest rewards, and fine-tunes the model on them.", zh: "一种迭代训练方法，先采样候选响应，选出奖励最高的响应，再用这些响应微调模型。" } }
tot: { en: tree of thoughts, zh: 思维树, abbr: ToT, def: { en: "A reasoning method that explores a branching tree of intermediate thoughts with lookahead and backtracking, beyond a single chain.", zh: "一种推理方法，通过前瞻和回溯探索由中间思路构成的分支树，而不是只沿单一路径推理。" } }
self-consistency: { en: self-consistency, zh: 自一致性, def: { en: "A decoding method that samples several reasoning paths and returns the answer that appears most often.", zh: "一种解码方法，采样多条推理路径，并返回其中出现次数最多的答案。" } }
least-to-most: { en: least-to-most, zh: 由简入繁, def: { en: "A prompting strategy that decomposes a hard problem into easier subproblems solved in order, each building on the last.", zh: "一种提示策略，将难题分解为依次求解的较简单子问题，并让每一步建立在上一步的结果之上。" } }
grpo: { en: group relative policy optimization, zh: 组相对策略优化, abbr: GRPO, def: { en: "A reinforcement-learning method that estimates relative advantages from a group of sampled answers without training a separate value model.", zh: "一种强化学习方法，从一组采样答案中估计相对优势，无需另外训练价值模型。" } }
rloo: { en: REINFORCE leave-one-out, zh: REINFORCE 留一法, abbr: RLOO, def: { en: "A lightweight policy-gradient method that uses the mean reward of the other samples as each sample's baseline, avoiding a learned value network.", zh: "一种轻量策略梯度方法，用其余样本的平均奖励作为每个样本的基线，无需学习价值网络。" } }
genrm: { en: generative reward model, zh: 生成式奖励模型, abbr: GenRM, def: { en: "A reward model that judges by generating a critique or verdict in text rather than emitting a scalar, often using chain-of-thought.", zh: "一种通过生成文字评判或裁决、而非输出标量来打分的奖励模型，常配合思维链。" } }
budget-forcing: { en: budget forcing, zh: 预算强制, def: { en: "A test-time control that caps or extends how many reasoning tokens a model spends, trading latency for accuracy.", zh: "一种测试时控制，限制或延长模型花在推理上的词元数，以延迟换准确率。" } }
held-out: { en: held-out set, zh: 留出集, def: { en: "A held-out set contains examples excluded from training and reserved for measuring generalization to unseen data.", zh: "留出集包含未参与训练的样本，专门用于衡量模型对未见数据的泛化能力。" } }
swiss-cheese: { en: Swiss-cheese model, zh: 瑞士奶酪模型, def: { en: "A safety framing where several imperfect layers each have holes, but stacking them so the holes do not line up blocks most failures.", zh: "一种安全框架，将多层各有缺口的不完善防护叠加起来，使缺口不相互对齐，从而阻止大部分失效。" } }
canary: { en: canary strings, zh: 金丝雀字符串, def: { en: "A set of unique markers inserted into data so their later appearance can reveal leakage or training-set contamination.", zh: "一组插入数据的唯一标记，如果这些标记后来再次出现，就可能表明发生了数据泄漏或训练集污染。" } }
membership-inference: { en: membership inference, zh: 成员推断, def: { en: "An attack that tests whether a specific example was in a model's training set, a basic privacy threat.", zh: "一种攻击，测试某个具体样本是否在模型的训练集中，是基本的隐私威胁。" } }
helm: { en: Holistic Evaluation of Language Models, zh: HELM, def: { en: "A benchmark suite that scores models across many scenarios and metrics together, rather than reducing them to one leaderboard number.", zh: "一套基准，在众多场景与指标上整体评估模型，而非压缩为单一排行榜数字。" } }
llm-as-judge: { en: model-as-judge, zh: 模型评判, def: { en: "An evaluation method that asks a model to score or compare outputs in place of, or before, human review.", zh: "一种评测方法，让模型在人工审查之前或代替人工审查，对输出评分或进行比较。" } }
holistic-eval: { en: holistic evaluation, zh: 整体评测, def: { en: "An evaluation that examines several dimensions, such as accuracy, robustness, bias, and efficiency, instead of reporting one score.", zh: "一种评测方式，同时考察准确性、鲁棒性、偏差和效率等多个维度，而不是只报告一个分数。" } }
goodhart: { en: Goodhart's law, zh: 古德哈特定律, def: { en: "The observation that a measure often stops reflecting the intended outcome once people or systems optimize directly for it.", zh: "一种观察，当人或系统直接优化某项度量时，该度量往往不再能反映原本希望实现的结果。" } }
rubric: { en: rubric, zh: 评分准则, def: { en: "An explicit scoring guide listing the criteria and levels a judge applies, making subjective evaluation more consistent.", zh: "一份明确的评分指南，列出评判者使用的标准和等级，使主观评测更加一致。" } }
byzantine-fault-tolerance: { en: Byzantine fault tolerance, zh: 拜占庭容错, def: { en: "A system's ability to reach correct consensus even when some components fail arbitrarily or maliciously, not just by crashing.", zh: "系统即使在部分组件任意或恶意失效（而非仅崩溃）时仍能达成正确共识的能力。" } }
arithmetic-coding: { en: arithmetic coding, zh: 算术编码, def: { en: "An entropy-coding method that represents an entire message as an interval within the unit interval, approaching the source's ideal bit rate.", zh: "一种熵编码方法，将整条消息表示为单位区间内的一个子区间，使码率接近信息源的理论最优值。" } }
two-part-code: { en: two-part code, zh: 两部分编码, def: { en: "A minimum-description-length encoding that records a model first and then records the data using that model.", zh: "一种最小描述长度编码，先记录模型，再使用该模型记录数据。" } }
temporal-difference: { en: temporal-difference, zh: 时序差分, def: { en: "A reinforcement-learning update that bootstraps a value estimate from the next step's estimate rather than waiting for the final return.", zh: "一种强化学习更新，不等待最终回报，而是利用下一步的估计自举当前的价值估计。" } }
evolution-strategies: { en: evolution strategies, zh: 进化策略, def: { en: "A black-box optimizer that perturbs parameters with noise and moves toward the higher-reward perturbations, needing no gradients.", zh: "一种黑盒优化器，用噪声扰动参数并朝奖励更高的扰动方向移动，无需梯度。" } }
kv-cache: { en: key-value cache, zh: KV 缓存, def: { en: "A store of attention keys and values from earlier tokens that lets each decode step reuse prior computation.", zh: "一种存储结构，保存此前词元的注意力键和值，使每个解码步骤都能复用先前的计算结果。" } }
diffusion: { en: diffusion, zh: 扩散, def: { en: "A generative process that learns to reverse a gradual noising of data, turning pure noise into a sample step by step.", zh: "一种生成过程，学习逆转对数据逐步加噪的过程，把纯噪声一步步变成样本。" } }
flow-matching: { en: flow matching, zh: 流匹配, def: { en: "A generative-model training method that learns a velocity field for transporting samples from a noise distribution to the data distribution.", zh: "一种生成模型训练方法，学习把样本从噪声分布输运到数据分布的速度场。" } }
score: { en: score, zh: 分数, def: { en: "The gradient of a probability distribution's log density with respect to its input, indicating the direction of increasing density.", zh: "概率分布的对数密度对输入的梯度，用于指出密度增大的方向。" } }
sde: { en: stochastic differential equation, zh: 随机微分方程, abbr: SDE, def: { en: "A differential equation that includes a random process and therefore describes both deterministic change and noise over continuous time.", zh: "一种包含随机过程的微分方程，可描述连续时间中的确定性变化和噪声。" } }
ode: { en: ordinary differential equation, zh: 常微分方程, abbr: ODE, def: { en: "An equation that relates a function of one independent variable to one or more of its derivatives.", zh: "一种方程，描述单个自变量的函数与该函数一个或多个导数之间的关系。" } }
autoregression: { en: autoregression, zh: 自回归, def: { en: "A generation method that produces one sequence element at a time, conditioning each new element on those already produced.", zh: "一种生成方法，每次生成一个序列元素，并让新元素以此前已生成的元素为条件。" } }
non-autoregressive: { en: non-autoregressive generation, zh: 非自回归生成, abbr: NAR, def: { en: "A generation method that predicts multiple output elements in parallel instead of conditioning each one on the preceding outputs.", zh: "一种生成方法，并行预测多个输出元素，而不是让每个元素都以前面的输出为条件。" } }
cfg: { en: classifier-free guidance, zh: 无分类器引导, abbr: CFG, def: { en: "A sampling trick that pushes a conditional generator away from its unconditional output to sharpen prompt adherence, trading diversity for fidelity.", zh: "一种采样技巧，让条件生成器的结果远离无条件输出，以降低多样性为代价提高对提示的贴合度。" } }
dit: { en: diffusion transformer, zh: 扩散 Transformer, abbr: DiT, def: { en: "A diffusion model whose denoiser is a transformer over patches rather than a U-Net, the scalable backbone of modern image and video generators.", zh: "一种扩散模型，使用处理图块的 Transformer 而不是 U-Net 作为去噪器，是现代图像和视频生成器中可扩展的主干架构。" } }
rectified-flow: { en: rectified flow, zh: 修正流, def: { en: "A flow-matching variant that straightens the transport paths between noise and data so fewer solver steps suffice for high quality.", zh: "一种流匹配变体，把噪声与数据之间的输运路径拉直，使更少的求解步即可达到高质量。" } }
ddpm: { en: denoising diffusion probabilistic models, zh: 去噪扩散概率模型, abbr: DDPM, def: { en: "A discrete-time diffusion formulation that trains a network to reverse a fixed process that gradually adds noise to data.", zh: "一种离散时间扩散表述，训练网络逆转一个逐步向数据添加噪声的固定过程。" } }
fertility: { en: fertility, zh: 分词膨胀率, def: { en: "The average number of tokens a tokenizer produces for each word in a language or dataset.", zh: "分词器处理某种语言或数据集时，每个词平均产生的词元数量。" } }
asr: { en: automatic speech recognition, zh: 自动语音识别, abbr: ASR, def: { en: "A system that converts spoken audio into written text.", zh: "一种将语音音频转换为书面文本的系统。" } }
ctc: { en: connectionist temporal classification, zh: 连接主义时序分类, abbr: CTC, def: { en: "A loss that trains sequence models without requiring each input position to be aligned with a target label.", zh: "一种损失函数，无需将每个输入位置与目标标签对齐即可训练序列模型。" } }
tts: { en: text-to-speech, zh: 文本到语音, abbr: TTS, def: { en: "A system that converts written text into spoken audio.", zh: "一种将书面文本转换为语音音频的系统。" } }
clip: { en: contrastive language-image pretraining, zh: 对比语言-图像预训练, abbr: CLIP, def: { en: "A training method that places matching images and text near each other in a shared embedding space and separates mismatched pairs.", zh: "一种训练方法，让匹配的图像和文本在共享嵌入空间中彼此接近，并将不匹配的图文对分开。" } }
vit: { en: vision transformer, zh: 视觉 Transformer, abbr: ViT, def: { en: "A transformer that treats an image as a sequence of patches, bringing the architecture and its scaling to vision.", zh: "一种将图像视为图块序列的 Transformer，把该架构及其扩展方式应用到视觉任务。" } }
vlm: { en: vision-language model, zh: 视觉语言模型, abbr: VLM, def: { en: "A model that processes images and text together to answer questions, describe visual content, or perform other multimodal tasks.", zh: "一种同时处理图像和文本的模型，可用于回答问题、描述视觉内容或执行其他多模态任务。" } }
world-model: { en: world model, zh: 世界模型, def: { en: "A learned model of an environment's dynamics that an agent can roll forward to predict and plan, instead of acting only reactively.", zh: "一种通过学习得到的环境动力学模型，智能体可以向前推演它来预测和规划，而不必只对当前情况作出反应。" } }
vla: { en: vision-language-action model, zh: 视觉-语言-动作模型, abbr: VLA, def: { en: "A model that maps visual and language input directly to robot or agent actions, extending VLMs to control.", zh: "一种模型，将视觉和语言输入直接映射为机器人或智能体动作，把视觉语言模型的能力扩展到控制。" } }
mechanistic-interpretability: { en: mechanistic interpretability, zh: 机械可解释性, def: { en: "The study of how a neural network implements behavior by identifying understandable features, circuits, and computations inside it.", zh: "一个研究领域，通过识别神经网络内部可理解的特征、电路和计算，分析网络如何实现特定行为。" } }
polysemanticity: { en: polysemanticity, zh: 多义性, def: { en: "A property in which one neuron or feature responds to several unrelated concepts, making its activation difficult to interpret.", zh: "一种性质，单个神经元或特征会响应多个互不相关的概念，因而难以解释其激活。" } }
superposition: { en: superposition, zh: 叠加, def: { en: "A representation strategy in which a network stores more features than it has dimensions by using overlapping directions in activation space.", zh: "一种表示策略，网络利用激活空间中相互重叠的方向，存储数量多于空间维度的特征。" } }
scalable-oversight: { en: scalable oversight, zh: 可扩展监督, def: { en: "A family of methods for supervising work that is too difficult or abundant for people to check directly, often with assistance from other models.", zh: "一类监督方法，面向人类难以直接检查或数量过多的工作，通常会借助其他模型提供协助。" } }
human-in-the-loop: { en: human-in-the-loop, zh: 人在回路中, abbr: HITL, def: { en: "A system design that inserts human judgment at defined points to approve, correct, label, escalate, or stop model behavior.", zh: "一种系统设计，在预先确定的环节引入人工判断，用于批准、纠正、标注、升级或停止模型行为。" } }
calibrated-reliance: { en: calibrated reliance, zh: 校准后的依赖, def: { en: "A pattern of relying on automation when evidence supports it and checking or overriding it when uncertainty or risk is high.", zh: "一种使用自动化的方式，在证据支持时依赖自动化，在不确定性或风险较高时复核结果或改由人工决定。" } }
automation-bias: { en: automation bias, zh: 自动化偏差, def: { en: "The tendency to over-rely on automated recommendations, especially when the system appears authoritative or the user is under time pressure.", zh: "过度依赖自动化建议的倾向，在系统显得权威或用户有时间压力时尤其明显。" } }
weak-to-strong: { en: weak-to-strong, zh: 弱到强, def: { en: "A research setting that tests whether supervision from a weaker model can elicit useful behavior from a stronger model.", zh: "一种研究设置，用于检验较弱模型提供的监督能否引出较强模型的有用行为。" } }
deceptive-alignment: { en: deceptive alignment, zh: 欺骗性对齐, def: { en: "A hypothesized failure in which a model appears to follow its training objective while monitored but pursues a different objective when unobserved.", zh: "一种假设中的失效，模型在受到监控时看似遵循训练目标，却在不受观察时追求另一个目标。" } }
sleeper-agents: { en: sleeper agents, zh: 沉睡特工, def: { en: "Sleeper agents are models trained to behave normally until a trigger causes them to produce a hidden behavior.", zh: "沉睡特工是经过训练的模型，平时表现正常，直到某个触发条件使其表现出隐藏行为。" } }
red-teaming: { en: red-teaming, zh: 红队, def: { en: "A structured effort to test a system adversarially and uncover failures, abuse paths, and potential harms before deployment.", zh: "一种有组织的对抗性测试活动，用于在部署前发现系统失效、滥用途径和潜在危害。" } }
prompt-injection: { en: prompt injection, zh: 提示注入, def: { en: "An attack where untrusted content in the model's input overrides its instructions, hijacking an agent through the data it reads.", zh: "一种攻击，模型输入中的不可信内容覆盖原有指令，并借智能体读取的数据将其劫持。" } }
obo: { en: on-behalf-of, zh: 代表用户, abbr: OBO, def: { en: "A delegation pattern in which a service acts using a particular user's identity and authorized permissions.", zh: "一种委派模式，服务使用特定用户的身份和已获授权的权限代表该用户执行操作。" } }
jailbreak: { en: jailbreak, zh: 越狱, def: { en: "A prompt crafted to bypass a model's safety training and elicit content it was tuned to refuse.", zh: "一种经过刻意构造的提示，用于绕过模型的安全训练，诱导模型生成原本经过调优应当拒绝的内容。" } }
lethal-trifecta: { en: lethal trifecta, zh: 致命三元组, def: { en: "The dangerous combination of access to private data, exposure to untrusted content, and the ability to communicate externally, which together enable exfiltration.", zh: "一种危险组合，同时具备访问私有数据、接触不可信内容和对外通信的能力，使数据外传成为可能。" } }
instruction-hierarchy: { en: instruction hierarchy, zh: 指令层级, def: { en: "An ordering of trust over instruction sources (system over developer over user over tool output) so a model knows which to obey on conflict.", zh: "一种按信任度排列指令来源的规则，通常依次为系统、开发者、用户和工具输出，使模型在指令冲突时知道应当遵循哪一项。" } }
gcg: { en: Greedy Coordinate Gradient, zh: 贪婪坐标梯度, abbr: GCG, def: { en: "A white-box attack that optimizes an adversarial suffix token by token to force a target output, producing transferable jailbreaks.", zh: "一种白盒攻击，逐词元优化对抗性后缀以迫使目标输出，可产生可迁移的越狱。" } }
adversarial-robustness: { en: adversarial robustness, zh: 对抗鲁棒性, def: { en: "A model's ability to preserve its intended behavior when an attacker deliberately crafts inputs to cause failure.", zh: "模型面对攻击者为诱发失效而刻意构造的输入时，仍能保持预期行为的能力。" } }
over-refusal: { en: over-refusal, zh: 过度拒绝, def: { en: "A safety failure in which a model incorrectly declines a benign request because it resembles a harmful one.", zh: "一种安全失效，模型因为无害请求与有害请求相似而错误地拒绝前者。" } }
differential-privacy: { en: differential privacy, zh: 差分隐私, abbr: DP, def: { en: "A formal guarantee that a computation's output barely changes whether or not any single record is included, bounding what can be learned about an individual.", zh: "一种形式化保证，使计算结果在加入或移除任意一条记录时只发生有限变化，从而限制由结果推断个人信息的能力。" } }
machine-unlearning: { en: machine unlearning, zh: 机器遗忘, def: { en: "A process that removes the influence of selected training data from a trained model without repeating the full original training run.", zh: "一种处理过程，无需重复完整的原始训练，即可从已训练模型中移除指定训练数据的影响。" } }
knowledge-editing: { en: knowledge editing, zh: 知识编辑, def: { en: "A method for changing a specific fact represented in a model while trying to preserve unrelated behavior.", zh: "一种方法，在尝试保留无关行为的同时，修改模型中表示的某项具体事实。" } }
watermarking: { en: watermarking, zh: 水印, def: { en: "A method for adding a detectable statistical signal to generated content so its source can later be assessed.", zh: "一种方法，在生成内容中加入可检测的统计信号，以便日后判断内容来源。" } }
brussels-effect: { en: Brussels effect, zh: 布鲁塞尔效应, def: { en: "The tendency of EU regulation to become a de facto global standard because firms apply it everywhere rather than maintain two product lines.", zh: "欧盟监管成为事实上全球标准的倾向，因为企业宁愿处处适用、也不愿维护两条产品线。" } }
model-card: { en: model card, zh: 模型卡, def: { en: "A short standardized document reporting a model's intended use, training data, evaluations, and limitations.", zh: "一份简短的标准化文档，说明模型的预期用途、训练数据、评测与局限。" } }
datasheet: { en: datasheet, zh: 数据表, def: { en: "A standardized document recording how a dataset was collected, composed, and intended to be used, the data analog of a model card.", zh: "一份标准化文档，记录数据集的采集方式、组成和预期用途，相当于数据集的模型卡。" } }
system-card: { en: system card, zh: 系统卡, def: { en: "A document describing a deployed system as a whole, including its model, safeguards, and evaluated risks, broader than a model card.", zh: "一份描述完整部署系统的文档，涵盖系统使用的模型、防护措施和已经评估的风险，范围比模型卡更广。" } }
gateway: { en: gateway, zh: 网关, def: { en: "A proxy in front of model providers that centralizes routing, auth, rate limits, cost tracking, and fallbacks across many backends.", zh: "一种位于模型提供商之前的代理，集中处理多个后端的路由、身份验证、速率限制、成本跟踪和回退。" } }
observability: { en: observability, zh: 可观测性, def: { en: "The ability to infer a system's internal state from signals such as logs, metrics, traces, prompts, token usage, and quality measurements.", zh: "根据日志、指标、追踪、提示、词元用量和质量测量等信号推断系统内部状态的能力。" } }
sandbox: { en: sandbox, zh: 沙箱, def: { en: "An isolated environment that confines untrusted code or agent actions so they cannot affect the host system.", zh: "一个隔离环境，约束不可信代码或智能体动作，使其无法影响宿主系统。" } }
sli: { en: service level indicator, zh: 服务水平指标, abbr: SLI, def: { en: "A measured metric of service behavior, such as latency or error rate, against which an SLO target is set.", zh: "一项对服务行为的测量指标，例如延迟或错误率，服务等级目标会以此为依据设定。" } }
private-test-set: { en: private test set, zh: 私有测试集, def: { en: "An evaluation set hidden from model developers to reduce the risk of optimizing or training directly against its examples.", zh: "一种不向模型开发者公开的评测集，用于降低直接针对其中样本优化或训练的风险。" } }
pairwise-comparison: { en: pairwise comparison, zh: 成对比较, def: { en: "An evaluation that presents two outputs and asks a judge to choose the better one according to stated criteria.", zh: "一种评测方式，同时呈现两个输出，并要求评判者根据既定标准选出较好的一个。" } }
pass-at-k: { en: pass@k, zh: 至少一次成功率, def: { en: "The probability that at least one of k sampled attempts passes, the standard metric for code and other verifiable tasks.", zh: "k 次采样尝试中至少一次通过的概率，是代码等可验证任务的标准指标。" } }
contamination: { en: contamination, zh: 污染, def: { en: "A data problem in which evaluation examples or close variants appear in training data and can inflate measured performance.", zh: "一种数据问题，评测样本或其近似变体出现在训练数据中，可能使测得的性能虚高。" } }
liveness: { en: liveness, zh: 活性, def: { en: "A formal system property stating that a desired event, such as progress or completion, will eventually occur.", zh: "一种形式系统性质，要求进展或完成等期望事件最终一定会发生。" } }
safety: { en: safety, zh: 安全性, def: { en: "A formal system property stating that prohibited states or events never occur.", zh: "一种形式系统性质，要求被禁止的状态或事件永远不会发生。" } }
asic: { en: application-specific integrated circuit, zh: 专用集成电路, abbr: ASIC, def: { en: "A chip designed for one task, trading the generality of a CPU or GPU for far higher efficiency on that task.", zh: "一种为特定任务设计的芯片，以牺牲 CPU 或 GPU 的通用性为代价，在该任务上获得高得多的效率。" } }
cowos: { en: chip-on-wafer-on-substrate, zh: CoWoS, def: { en: "A TSMC packaging technology that connects compute dies and stacks of high-bandwidth memory through a shared silicon interposer.", zh: "台积电的一种封装技术，通过共享的硅中介层连接计算裸片和高带宽内存堆叠。" } }
gpu: { en: graphics processing unit, zh: 图形处理器, abbr: GPU, def: { en: "A highly parallel processor developed for graphics and widely used to train and serve neural networks.", zh: "一种最初为图形处理开发的高度并行处理器，现广泛用于训练和服务神经网络。" } }
tpu: { en: tensor processing unit, zh: 张量处理器, abbr: TPU, def: { en: "An accelerator designed by Google around matrix-multiplication hardware for machine-learning training and inference.", zh: "谷歌设计的一种加速器，以矩阵乘法硬件为核心，用于机器学习训练和推理。" } }
sram: { en: static random-access memory, zh: 静态随机存取存储器, abbr: SRAM, def: { en: "SRAM stores each bit in a stable circuit without periodic refresh and is commonly used for fast on-chip caches.", zh: "SRAM 使用稳定电路存储每个比特，无需定期刷新，常用于高速片上缓存。" } }
dram: { en: dynamic random-access memory, zh: 动态随机存取存储器, abbr: DRAM, def: { en: "DRAM stores bits in capacitors that require periodic refresh and provides most off-chip working memory.", zh: "DRAM 使用需要定期刷新的电容存储比特，并提供大部分片外工作内存。" } }
rdma: { en: remote direct memory access, zh: 远程直接内存访问, abbr: RDMA, def: { en: "A network capability letting one machine read or write another's memory without involving its CPU, key to fast collective communication.", zh: "一种网络能力，允许一台机器在不经对方 CPU 的情况下读写其内存，是快速集合通信的关键。" } }
ettr: { en: effective training time ratio, zh: 有效训练时间比, abbr: ETTR, def: { en: "The fraction of wall-clock time a training run spends making real progress, after subtracting failures, restarts, and stalls.", zh: "训练运行的墙钟时间中真正取得进展的比例，已扣除故障、重启与停顿。" } }
hfu: { en: hardware FLOPs utilization, zh: 硬件 FLOPs 利用率, abbr: HFU, def: { en: "The fraction of peak hardware throughput actually achieved, counting all FLOPs including recomputation, unlike MFU.", zh: "实际达到的硬件峰值算力比例，与 MFU 不同，它计入包括重算在内的所有 FLOPs。" } }
pue: { en: power usage effectiveness, zh: 电源使用效率, abbr: PUE, def: { en: "The ratio of a datacenter's total power consumption to the power used by its computing equipment, where values nearer 1 indicate less facility overhead.", zh: "数据中心总功耗与计算设备功耗之比，数值越接近 1，说明设施自身的额外能耗越少。" } }
sdc: { en: silent data corruption, zh: 静默数据损坏, abbr: SDC, def: { en: "Silent data corruption occurs when hardware produces an incorrect result without reporting a fault.", zh: "静默数据损坏是指硬件产生错误结果，却没有报告故障。" } }
smr: { en: small modular reactor, zh: 小型模块化反应堆, abbr: SMR, def: { en: "A factory-built nuclear reactor of modest output, proposed as a dedicated, steady power source for AI datacenters.", zh: "工厂化建造、出力适中的核反应堆，被提议作为 AI 数据中心专用的稳定电源。" } }
autodiff: { en: automatic differentiation, zh: 自动微分, def: { en: "A method that computes derivatives by applying the chain rule to the elementary operations executed by a program.", zh: "一种计算导数的方法，对程序执行的基本运算逐项应用链式法则。" } }
