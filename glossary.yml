# Glossary: single source of truth for professional terms. Reference a term in
# any chapter with @gls-<key>; the pipeline expands it on first use per chapter
# (中文（English） / english (ABBR)), shows the short form after, links every use
# to the auto-generated glossary page, and warns on an undefined key. Add a term
# here once; never hand-maintain the gloss in prose.
#
#   <key>: { en: <full English>, zh: <full Chinese>, abbr: <optional abbreviation> }
#
# Optional def: a one-line definition shown on the glossary page so a reader who
# meets the term cold has somewhere to land. Without it the page falls back to
# the sentence where the term first appears, which is often enough but sometimes
# degenerate ("This is prefill."). Write it in both languages, terms byte-verbatim:
#
#   <key>: { en: ..., zh: ..., def: { en: <one line>, zh: <one line> } }

moe:  { en: mixture-of-experts, zh: 混合专家, abbr: MoE, def: { en: "An architecture that replaces a dense feed-forward layer with many expert layers and routes each token to a few, so capacity grows without proportional compute.", zh: "用许多专家层替换稠密前馈层、并把每个词元只路由给少数几个的架构，使容量增长而算力不成比例增加。" } }
ssm:  { en: state-space model, zh: 状态空间模型, abbr: SSM, def: { en: "A sequence model that carries a recurrent hidden state instead of attending to all past tokens, giving linear-time inference and a fixed-size state.", zh: "一种携带循环隐藏状态、而非关注所有过去词元的序列模型，带来线性时间推理和固定大小的状态。" } }
ffn:  { en: feed-forward network, zh: 前馈网络, abbr: FFN, def: { en: "The position-wise sublayer applied to each token independently in a transformer block, holding most of the model's parameters and knowledge.", zh: "Transformer 块中对每个词元独立施加的逐位置子层，承载了模型大部分参数和知识。" } }
mha:  { en: multi-head attention, zh: 多头注意力, abbr: MHA, def: { en: "Attention split into several heads that attend to different subspaces in parallel; each head keeps its own keys and values, so its KV cache is the largest.", zh: "切成多个头、并行关注不同子空间的注意力；每个头各存一份键和值，因此 KV 缓存最大。" } }
mla:  { en: multi-head latent attention, zh: 多头潜在注意力, abbr: MLA, def: { en: "An attention variant from DeepSeek-V2 that caches a low-rank latent in place of full per-head keys and values, claiming MHA-class quality at a small cache.", zh: "DeepSeek-V2 提出的注意力变体，用低秩潜在向量替代每个头的完整键和值来缓存，宣称以小缓存达到 MHA 级质量。" } }
sft:  { en: supervised fine-tuning, zh: 监督微调, abbr: SFT, def: { en: "Training a pretrained model on curated input-output examples so it follows instructions in a target format; the first post-training stage.", zh: "在精选的输入-输出示例上训练预训练模型，使其按目标格式遵循指令；后训练的第一个阶段。" } }
peft: { en: parameter-efficient fine-tuning, zh: 参数高效微调, abbr: PEFT, def: { en: "Adapting a model by training a small set of added or selected parameters while freezing the rest, cutting memory and storage versus full fine-tuning.", zh: "只训练一小部分新增或选定的参数、冻结其余部分来适配模型，相比全量微调大幅降低显存与存储。" } }
bpe:  { en: byte-pair encoding, zh: 字节对编码, abbr: BPE, def: { en: "A tokenizer training algorithm that starts from bytes and repeatedly merges the most frequent adjacent pair into a new token, building a subword vocabulary.", zh: "一种分词器训练算法，从字节出发，反复把最频繁的相邻对合并为一个新词元，从而构建子词词表。" } }
scaling-law: { en: scaling law, zh: 扩展律, def: { en: "An empirical power law relating model loss to compute, parameters, and data, used to predict quality and allocate a training budget.", zh: "把模型损失与算力、参数量和数据量联系起来的经验幂律，用于预测质量并分配训练预算。" } }
next-token-prediction: { en: next-token prediction, zh: 下一词元预测, def: { en: "The pretraining objective of predicting the next token from the preceding ones; minimizing its cross-entropy is how a language model learns.", zh: "根据前文预测下一个词元的预训练目标；最小化其交叉熵正是语言模型的学习方式。" } }
cross-entropy: { en: cross-entropy, zh: 交叉熵, def: { en: "The loss measuring how many bits the model's predicted distribution wastes against the true next token; the quantity pretraining minimizes.", zh: "衡量模型预测分布相对真实下一词元浪费多少比特的损失；正是预训练所最小化的量。" } }
perplexity: { en: perplexity, zh: 困惑度, def: { en: "The exponentiated cross-entropy, read as the model's average branching factor over tokens; lower means the model is less surprised by the text.", zh: "交叉熵的指数，可读作模型在词元上的平均分支因子；越低表示模型对文本越不感到意外。" } }
compute-optimal: { en: compute-optimal, zh: 计算最优, def: { en: "The split of a fixed compute budget between model size and data that minimizes loss; the Chinchilla result that data should scale with parameters.", zh: "在固定算力预算下、使损失最小的模型规模与数据量分配；即 Chinchilla 的结论：数据应与参数同步扩展。" } }
adamw: { en: AdamW, zh: AdamW 优化器, def: { en: "The default optimizer for transformers: Adam with weight decay decoupled from the gradient update.", zh: "Transformer 的默认优化器，即把权重衰减与梯度更新解耦的 Adam。" } }
warmup-stable-decay: { en: warmup-stable-decay, zh: 预热-稳定-衰减调度, abbr: WSD, def: { en: "A learning-rate schedule with a warmup ramp, a long constant plateau, then a final decay; the plateau lets total training length stay open.", zh: "一种学习率调度：先预热爬升，再长时间保持恒定，最后衰减；恒定段让总训练长度保持开放。" } }
z-loss: { en: z-loss, zh: z-loss 正则, def: { en: "A small auxiliary penalty on the log of the softmax normalizer that keeps logits from drifting, stabilizing the training of large models.", zh: "对 softmax 归一化项的对数施加的小辅助惩罚，防止 logits 漂移，从而稳定大模型训练。" } }
qk-norm: { en: query-key normalization, zh: 查询-键归一化, abbr: QK-norm, def: { en: "Normalizing queries and keys before their dot product to cap attention-logit growth, a fix for training instability at scale.", zh: "在查询与键做点积之前对其归一化，以抑制注意力 logit 的增长，是大规模训练不稳定的一种修复。" } }
gradient-clipping: { en: gradient clipping, zh: 梯度裁剪, def: { en: "Capping the gradient norm before an update so a rare oversized batch gradient cannot blow up training.", zh: "在更新前限制梯度范数，使偶发的过大批次梯度无法让训练发散。" } }
minhash: { en: MinHash, zh: 最小哈希, def: { en: "A hashing scheme that cheaply estimates set similarity, used to find and remove near-duplicate documents in a training corpus.", zh: "一种廉价估计集合相似度的哈希方案，用于在训练语料中发现并去除近重复文档。" } }
decontamination: { en: decontamination, zh: 去污染, def: { en: "Removing from the training data any text that overlaps with evaluation benchmarks, so reported scores are not inflated by memorization.", zh: "从训练数据中移除与评测基准重叠的文本，使报告分数不被记忆所夸大。" } }
tokenizer: { en: tokenizer, zh: 分词器, def: { en: "The component that maps raw text to and from the integer token ids a model consumes; its vocabulary is fixed before training.", zh: "在原始文本与模型所消费的整数词元 id 之间相互映射的组件；其词表在训练前就已固定。" } }
sentencepiece: { en: SentencePiece, zh: SentencePiece 分词器, def: { en: "A language-agnostic tokenizer that trains directly on raw text without pre-tokenization, treating the input including whitespace as one stream.", zh: "一种与语言无关的分词器，直接在原始文本上训练、无需预分词，把含空格的输入视为一个字符流。" } }
tokenizer-free: { en: tokenizer-free, zh: 无分词器方案, def: { en: "An approach that drops a fixed vocabulary and models bytes or characters directly, trading tokenizer biases for longer sequences.", zh: "一种舍弃固定词表、直接对字节或字符建模的方案，以更长的序列换取摆脱分词器偏置。" } }
residual-stream: { en: residual stream, zh: 残差流, def: { en: "The vector carried unchanged down a transformer from embedding to output; each block reads it, computes a delta, and adds the delta back.", zh: "在 Transformer 中从嵌入一路传到输出、保持身份不变的向量；每个块读取它、算出一个增量、再把增量加回。" } }
rmsnorm: { en: root mean square layer normalization, zh: 均方根层归一化, abbr: RMSNorm, def: { en: "A normalization that rescales activations by their root mean square only, dropping LayerNorm's mean subtraction and bias; cheaper and now the default.", zh: "只用激活的均方根来重新缩放的归一化，舍弃了 LayerNorm 的去均值与偏置；更省算力，如今是默认选择。" } }
rope: { en: rotary position embedding, zh: 旋转位置嵌入, abbr: RoPE, def: { en: "Position encoding that rotates query and key vectors by an angle set by position, so attention depends only on the relative offset between tokens.", zh: "把查询和键向量按位置决定的角度旋转的位置编码，使注意力只取决于词元之间的相对偏移。" } }
swiglu: { en: Swish-gated linear unit, zh: Swish 门控线性单元, abbr: SwiGLU, def: { en: "The gated feed-forward layer in modern transformers, computing (Swish(xW1) ⊙ xV)W2; three matrices, the default since LLaMA.", zh: "现代 Transformer 中的门控前馈层，计算 (Swish(xW1) ⊙ xV)W2；用三个矩阵，自 LLaMA 起成为默认。" } }
flashattention: { en: FlashAttention, zh: FlashAttention 注意力内核, def: { en: "An exact attention kernel that never writes the full score matrix to memory, making O(n²) attention affordable; it speeds compute but does not shrink the KV cache.", zh: "一种从不把完整分数矩阵写入内存的精确注意力内核，使 O(n²) 注意力变得可负担；它加速计算，但不缩减 KV 缓存。" } }
zero: { en: Zero Redundancy Optimizer, zh: 零冗余优化器, abbr: ZeRO, def: { en: "A data-parallel method that shards optimizer states, gradients, and parameters across devices instead of replicating them, cutting per-device memory.", zh: "一种数据并行方法，把优化器状态、梯度和参数分片到各设备而非各自复制，从而降低单设备显存。" } }
fsdp: { en: fully sharded data parallel, zh: 全分片数据并行, abbr: FSDP, def: { en: "PyTorch's implementation of full parameter, gradient, and optimizer-state sharding, gathering each layer's weights only when needed.", zh: "PyTorch 对参数、梯度和优化器状态全分片的实现，只在需要时才聚合每层权重。" } }
lsh:  { en: locality-sensitive hashing, zh: 局部敏感哈希, abbr: LSH, def: { en: "Hashing that maps similar items to the same bucket with high probability, enabling approximate nearest-neighbor search and dedup at scale.", zh: "把相似项以高概率映射到同一桶的哈希，支撑大规模近似最近邻搜索与去重。" } }
mup:  { en: maximal update parametrization, zh: 最大更新参数化, abbr: muP, def: { en: "A parametrization that keeps the optimal learning rate stable across model widths, so hyperparameters tuned on a small model transfer to a large one.", zh: "一种使最优学习率在不同模型宽度间保持稳定的参数化，使在小模型上调好的超参数可迁移到大模型。" } }
tp:   { en: tensor parallelism, zh: 张量并行, abbr: TP, def: { en: "Splitting a single layer's matrices across devices that jointly compute one forward pass, used within a node where bandwidth is high.", zh: "把单层的矩阵切分到多个设备、由它们共同完成一次前向传播的并行方式，多用于带宽高的节点内。" } }
pp:   { en: pipeline parallelism, zh: 流水线并行, abbr: PP, def: { en: "Placing different layers on different devices and streaming microbatches through them like an assembly line, with idle bubbles at the ends.", zh: "把不同层放在不同设备、让微批次像流水线一样依次通过的并行方式，两端会有空闲气泡。" } }
dp:   { en: data parallelism, zh: 数据并行, abbr: DP, def: { en: "Replicating the model across devices, each processing a different batch shard, then averaging gradients; the simplest axis of distributed training.", zh: "把模型复制到各设备、各自处理不同的批次分片再平均梯度；分布式训练中最简单的一个维度。" } }
mfu:  { en: model FLOPs utilization, zh: 模型 FLOPs 利用率, abbr: MFU, def: { en: "The fraction of a device's peak arithmetic throughput actually spent on useful model FLOPs, a headline training-efficiency metric.", zh: "设备峰值算力中真正花在有用模型 FLOPs 上的比例，是训练效率的一个标志性指标。" } }
reward-hacking: { en: reward hacking, zh: 奖励欺骗, def: { en: "When a model maximizes the measured reward by exploiting its flaws rather than achieving the intended goal; the central failure of optimizing a proxy.", zh: "模型通过利用奖励的缺陷、而非达成预期目标来最大化所测奖励的现象；针对代理目标做优化的核心失效。" } }

# Retrieval / serving / agents
rag:  { en: retrieval-augmented generation, zh: 检索增强生成, abbr: RAG, def: { en: "Fetching relevant documents at query time and placing them in the prompt, so the model answers from retrieved evidence rather than parametric memory alone.", zh: "在查询时取回相关文档并放入提示词，使模型依据检索到的证据作答，而不仅靠参数化记忆。" } }
ttft: { en: time to first token, zh: 首词元时间, abbr: TTFT, def: { en: "How long a user waits before the first output token appears; governed by prefill and the dominant latency for interactive chat.", zh: "用户在第一个输出词元出现前的等待时间；由预填充决定，是交互式对话的主导延迟。" } }
tpot: { en: time per output token, zh: 每词元延迟, abbr: TPOT, def: { en: "How long each token takes once the stream has started, the per-step decode latency; what makes a long generation feel smooth or stutter.", zh: "流开始后每个词元所需的时间，即每步解码延迟；决定长文本生成是流畅还是卡顿。" } }
slo:  { en: service-level objective, zh: 服务等级目标, abbr: SLO, def: { en: "A target threshold for a service metric, such as p99 latency under a bound, that a serving system commits to meeting.", zh: "对某项服务指标设定的目标阈值，例如 p99 延迟不超过某界限，是服务系统承诺达到的标准。" } }
prefill: { en: prefill, zh: 预填充, def: { en: "The first inference pass, reading the whole prompt at once to compute every token's keys and values; compute-bound and sets time to first token.", zh: "推理的第一遍，一次读完整个提示词，算出每个词元的键和值；受算力约束，决定首词元时间。" } }
decode: { en: decode, zh: 解码, def: { en: "The autoregressive pass after prefill, emitting one token per step against the cached keys and values; memory-bandwidth-bound and sets per-token latency.", zh: "预填充之后的自回归阶段，每步针对已缓存的键和值发出一个词元；受显存带宽约束，决定每词元延迟。" } }
goodput: { en: goodput, zh: 有效吞吐量, def: { en: "Throughput counted only over requests that meet their latency targets, the objective a serving system actually optimizes, unlike raw throughput.", zh: "只计入满足延迟目标的请求的吞吐量，是服务系统真正优化的目标，区别于原始吞吐量。" } }
continuous-batching: { en: continuous batching, zh: 连续批处理, def: { en: "Scheduling that admits and retires requests at each decode step instead of per fixed batch, so a finished request frees its slot immediately.", zh: "在每个解码步而非每个固定批次准入和退出请求的调度方式，使完成的请求立即释放其槽位。" } }
pagedattention: { en: PagedAttention, zh: PagedAttention 分页注意力, def: { en: "A KV-cache allocator that stores the cache in fixed-size pages like virtual memory, ending the fragmentation of reserving one contiguous block per sequence.", zh: "把 KV 缓存按固定大小分页存储（类似虚拟内存）的分配方式，消除了为每个序列预留连续大块所带来的碎片化。" } }
prefix-caching: { en: prefix caching, zh: 前缀缓存, def: { en: "Reusing the KV cache of a shared prompt prefix across requests so its prefill is computed once, not per request.", zh: "在请求间复用共享提示词前缀的 KV 缓存，使其预填充只算一次，而非每个请求各算一遍。" } }
speculative-decoding: { en: speculative decoding, zh: 推测解码, def: { en: "Drafting several tokens with a small fast model and verifying them in one pass of the large model, trading extra compute for fewer slow decode steps.", zh: "用一个小而快的模型起草若干词元，再由大模型一次性校验，以额外算力换取更少的慢速解码步。" } }
constrained-decoding: { en: constrained decoding, zh: 约束解码, def: { en: "Restricting the tokens the model may emit at each step to those allowed by a grammar or schema, so the output is valid by construction.", zh: "在每一步把模型可发出的词元限制为某个语法或模式所允许的范围，使输出天然合法。" } }
fsm: { en: finite-state machine, zh: 有限状态机, abbr: FSM, def: { en: "A model of computation with a finite set of states and transitions; used in constrained decoding to track which tokens a grammar allows next.", zh: "一种状态与转移均为有限的计算模型；在约束解码中用于追踪语法接下来允许哪些词元。" } }
attention-sink: { en: attention sink, zh: 注意力汇, def: { en: "A few initial tokens that attention heads dump excess weight onto; keeping them in the cache stabilizes streaming and long-context generation.", zh: "注意力头把多余权重倾倒到的少数起始词元；把它们留在缓存中可稳定流式与长上下文生成。" } }
bm25: { en: BM25, zh: BM25 稀疏检索, def: { en: "A classic sparse lexical ranking function scoring documents by term frequency and rarity; the strong keyword-search baseline behind hybrid retrieval.", zh: "一种经典的稀疏词法排序函数，按词频与稀有度给文档打分；混合检索背后强力的关键词搜索基线。" } }
hnsw: { en: hierarchical navigable small-world, zh: 分层可导航小世界图, abbr: HNSW, def: { en: "A graph index for approximate nearest-neighbor search over vectors, navigating layered links to find close embeddings fast.", zh: "一种用于向量近似最近邻搜索的图索引，通过分层链接快速找到相近的嵌入。" } }
hybrid-search: { en: hybrid search, zh: 混合搜索, def: { en: "Combining sparse lexical scores (BM25) and dense vector similarity into one ranking, catching both exact-keyword and semantic matches.", zh: "把稀疏词法分数（BM25）与稠密向量相似度融合为一个排序，兼顾精确关键词与语义匹配。" } }
dual-encoder: { en: dual-encoder, zh: 双编码器, def: { en: "A retrieval model that embeds query and document separately so document vectors can be precomputed and searched; fast but less precise than joint scoring.", zh: "分别编码查询和文档的检索模型，文档向量可预先计算并检索，速度快但不如联合打分精确。" } }
cross-encoder: { en: cross-encoder, zh: 交叉编码器, def: { en: "A model that scores a query and document jointly in one pass, more accurate than a dual-encoder but too costly to run over a whole corpus, so used to rerank.", zh: "在一次前向中联合给查询和文档打分的模型，比双编码器更准但无法跑遍整个语料，因此用于重排。" } }
ocr: { en: optical character recognition, zh: 光学字符识别, abbr: OCR, def: { en: "Converting images of text into machine-readable characters, a front-end step for ingesting scanned or photographed documents.", zh: "把文本图像转换为机器可读字符，是摄取扫描件或照片文档的前置步骤。" } }
virtual-key: { en: virtual key, zh: 虚拟密钥, def: { en: "A gateway-issued credential mapped to an upstream provider key, letting an operator set per-team budgets, limits, and revocation without sharing the real key.", zh: "网关签发、映射到上游提供商密钥的凭证，使运营方无需共享真实密钥即可设定各团队预算、限额与吊销。" } }
# Attention / architecture
mqa:  { en: multi-query attention, zh: 多查询注意力, abbr: MQA, def: { en: "An attention variant where all query heads share a single key/value head, cutting the KV cache by a factor of the head count at some quality risk.", zh: "所有查询头共享单个键/值头的注意力变体，把 KV 缓存削减为头数分之一，但有一定质量风险。" } }
gqa:  { en: grouped-query attention, zh: 分组查询注意力, abbr: GQA, def: { en: "Attention where query heads share keys and values within groups, interpolating between MHA and MQA; the default in LLaMA and Qwen.", zh: "查询头在组内共享键和值的注意力，介于 MHA 与 MQA 之间；是 LLaMA 与 Qwen 的默认。" } }
# Reasoning / RL
prm:  { en: process reward model, zh: 过程奖励模型, abbr: PRM, def: { en: "A reward model that scores each step of a reasoning trace, not just the final answer, giving denser signal for training and search.", zh: "对推理过程每一步而非仅对最终答案打分的奖励模型，为训练与搜索提供更密集的信号。" } }
mcts: { en: Monte Carlo tree search, zh: 蒙特卡洛树搜索, abbr: MCTS, def: { en: "A search that builds a tree by sampling rollouts and backing up their values, balancing exploration and exploitation; used for reasoning and planning.", zh: "通过采样推演并回传其价值来构建搜索树的方法，在探索与利用间权衡；用于推理与规划。" } }
rlvr: { en: reinforcement learning with verifiable rewards, zh: 可验证奖励的强化学习, abbr: RLVR, def: { en: "RL where the reward comes from an automatic checker (a unit test, an exact answer) rather than a learned model, sidestepping reward hacking.", zh: "奖励来自自动校验器（单元测试、精确答案）而非学习模型的强化学习，规避奖励欺骗。" } }
mdl:  { en: minimum description length, zh: 最小描述长度, abbr: MDL, def: { en: "A formalization of Occam's razor: the best model is the one that most compresses the data plus itself; a lens on learning as compression.", zh: "奥卡姆剃刀的形式化：最好的模型是把数据加自身压缩得最短的那个；把学习看作压缩的一种视角。" } }
# Interpretability
sae:  { en: sparse autoencoder, zh: 稀疏自编码器, abbr: SAE, def: { en: "An interpretability tool that decomposes a model's activations into many sparse, more monosemantic features, used to read what a network represents.", zh: "一种可解释性工具，把模型激活分解为许多稀疏、更单义的特征，用于读出网络所表示的内容。" } }
# Hardware / reliability
hbm:  { en: high-bandwidth memory, zh: 高带宽显存, abbr: HBM, def: { en: "Stacked DRAM placed next to an accelerator for very high bandwidth; its capacity and bandwidth bound how large a model and KV cache can be served.", zh: "紧邻加速器堆叠的 DRAM，提供极高带宽；其容量与带宽决定能服务多大的模型与 KV 缓存。" } }
ici:  { en: inter-chip interconnect, zh: 芯片间互连, abbr: ICI, def: { en: "The high-speed links connecting accelerators directly (such as NVLink or a TPU's ICI), carrying the collective traffic of tensor and pipeline parallelism.", zh: "直接连接加速器的高速链路（如 NVLink 或 TPU 的 ICI），承载张量并行与流水线并行的集合通信。" } }
mtbf: { en: mean time between failures, zh: 平均无故障时间, abbr: MTBF, def: { en: "The average operating time between hardware failures; at cluster scale it falls low enough that long training runs must expect and recover from them.", zh: "硬件两次故障之间的平均运行时间；在集群规模下它低到长训练必须预期故障并从中恢复。" } }
lru:  { en: least recently used, zh: 最近最少使用, abbr: LRU, def: { en: "An eviction policy that discards the entry unused for the longest time; the default for caches, including KV-cache and prefix reuse.", zh: "丢弃最久未使用项的逐出策略；缓存的默认选择，包括 KV 缓存与前缀复用。" } }
# Defined for @gls use (not auto-migrated: the book uses the abbr directly)
llm:  { en: large language model, zh: 大语言模型, abbr: LLM, def: { en: "A transformer trained on broad text to predict tokens, then adapted to follow instructions; the central artifact this book is about.", zh: "在广泛文本上训练以预测词元、再适配为遵循指令的 Transformer；本书所围绕的核心产物。" } }
rlhf: { en: reinforcement learning from human feedback, zh: 基于人类反馈的强化学习, abbr: RLHF, def: { en: "Aligning a model by training a reward model on human preference comparisons and optimizing the policy against it; the original alignment recipe.", zh: "在人类偏好比较上训练奖励模型、再据此优化策略来对齐模型；最初的对齐配方。" } }
dpo:  { en: direct preference optimization, zh: 直接偏好优化, abbr: DPO, def: { en: "Aligning a model directly from preference pairs with a classification-style loss, skipping the separate reward model and RL loop of RLHF.", zh: "用分类式损失直接从偏好对中对齐模型，省去 RLHF 中独立的奖励模型与 RL 循环。" } }

# --- comprehensive pass: per-part subagent definitions ---
cot: { en: chain of thought, zh: 思维链, abbr: CoT, def: { en: "Prompting or training a model to produce intermediate reasoning steps before its answer, which raises accuracy on multi-step problems.", zh: "提示或训练模型在给出答案前产出中间推理步骤，从而提升多步问题的准确率。" } }
mcp: { en: Model Context Protocol, zh: 模型上下文协议, abbr: MCP, def: { en: "An open protocol standardizing how an agent connects to external tools and data sources, so a host can talk to many servers uniformly.", zh: "一种开放协议，标准化智能体连接外部工具与数据源的方式，使宿主能以统一方式对接众多服务器。" } }
capex: { en: capital expense, zh: 资本性支出, abbr: CapEx, def: { en: "Up-front spending on long-lived assets such as GPUs and datacenters, depreciated over years; the bulk of the cost of owning compute.", zh: "对 GPU、数据中心等长寿命资产的前期支出，按年折旧；自有算力成本的主要部分。" } }
opex: { en: operating expense, zh: 运营性支出, abbr: OpEx, def: { en: "Recurring running costs such as power, bandwidth, and rented cloud capacity; the pay-as-you-go side of serving.", zh: "电力、带宽、租用云容量等经常性运行成本；服务中按量付费的一面。" } }
lora: { en: low-rank adaptation, zh: 低秩适配, abbr: LoRA, def: { en: "A PEFT method that freezes the base weights and learns a small low-rank update per layer, so many task adapters share one base model.", zh: "一种 PEFT 方法，冻结基座权重、为每层学习一个低秩小更新，使众多任务适配器共享同一基座模型。" } }
qlora: { en: quantized low-rank adaptation, zh: 量化低秩适配, abbr: QLoRA, def: { en: "LoRA applied on top of a 4-bit quantized base model, letting a large model be fine-tuned on a single GPU.", zh: "在 4 比特量化的基座模型之上应用 LoRA，使大模型能在单张 GPU 上微调。" } }
ppo: { en: proximal policy optimization, zh: 近端策略优化, abbr: PPO, def: { en: "A stable policy-gradient RL algorithm that clips each update to stay close to the previous policy; the workhorse optimizer of RLHF.", zh: "一种稳定的策略梯度强化学习算法，裁剪每次更新使其贴近上一策略；RLHF 的主力优化器。" } }
kl: { en: Kullback-Leibler divergence, zh: Kullback-Leibler 散度, abbr: KL, def: { en: "An asymmetric measure of how far one distribution is from another; in alignment it penalizes the policy for drifting from the reference model.", zh: "衡量一个分布偏离另一个分布多远的非对称度量；在对齐中用于惩罚策略偏离参考模型。" } }
rlaif: { en: reinforcement learning from AI feedback, zh: 从 AI 反馈中做强化学习, abbr: RLAIF, def: { en: "RLHF where the preference labels come from a model rather than humans, trading some quality for cheaper, scalable feedback.", zh: "偏好标签来自模型而非人类的 RLHF，以一定质量换取更廉价、可扩展的反馈。" } }
ipo: { en: identity preference optimization, zh: 恒等偏好优化, abbr: IPO, def: { en: "A DPO variant that replaces the log-sigmoid loss with a squared objective to curb overfitting to preference pairs.", zh: "一种 DPO 变体，用平方目标替换 log-sigmoid 损失，以抑制对偏好对的过拟合。" } }
kto: { en: Kahneman-Tversky optimization, zh: Kahneman-Tversky 优化, abbr: KTO, def: { en: "A preference method that learns from unpaired good/bad labels with a prospect-theory-inspired loss, needing no preference pairs.", zh: "一种偏好方法，借鉴前景理论的损失从未配对的好/坏标签中学习，无需偏好对。" } }
orpo: { en: odds-ratio preference optimization, zh: 优势比偏好优化, abbr: ORPO, def: { en: "A method that folds preference alignment into SFT with an odds-ratio penalty, removing the need for a separate reference model.", zh: "一种把偏好对齐用优势比惩罚并入 SFT 的方法，省去独立的参考模型。" } }
simpo: { en: simple preference optimization, zh: 简单偏好优化, abbr: SimPO, def: { en: "A reference-free DPO variant using the average log-probability as an implicit reward with a target margin, simpler and memory-light.", zh: "一种无参考模型的 DPO 变体，用平均对数概率作隐式奖励并设目标间隔，更简单且省显存。" } }
raft: { en: reward ranked fine-tuning, zh: 奖励排序微调, abbr: RAFT, def: { en: "An iterative method that samples candidates, keeps the highest-reward ones, and fine-tunes on them; rejection sampling cast as training.", zh: "一种迭代方法：采样候选、保留奖励最高者、再在其上微调；把拒绝采样化作训练。" } }
tot: { en: tree of thoughts, zh: 思维树, abbr: ToT, def: { en: "A reasoning method that explores a branching tree of intermediate thoughts with lookahead and backtracking, beyond a single chain.", zh: "一种推理方法，带前瞻与回溯地探索中间想法的分叉树，超越单一思维链。" } }
self-consistency: { en: self-consistency, zh: 自一致性, def: { en: "Sampling several reasoning chains and taking the majority answer, trading extra compute for higher accuracy.", zh: "采样多条推理链并取多数答案，以额外算力换取更高准确率。" } }
least-to-most: { en: least-to-most, zh: 由最少到最多, def: { en: "A prompting strategy that decomposes a hard problem into easier subproblems solved in order, each building on the last.", zh: "一种提示策略，把难题分解为由易到难、依次求解的子问题，每步在前一步之上构建。" } }
grpo: { en: group relative policy optimization, zh: 组相对策略优化, abbr: GRPO, def: { en: "An RL method that drops the value critic and normalizes rewards within a group of sampled answers; the optimizer behind DeepSeek-R1.", zh: "一种强化学习方法，去掉价值评论网络、在一组采样答案内对奖励做归一化；DeepSeek-R1 背后的优化器。" } }
rloo: { en: REINFORCE leave-one-out, zh: REINFORCE 留一法, abbr: RLOO, def: { en: "A lightweight policy-gradient method that uses the mean reward of the other samples as each sample's baseline, avoiding a learned value network.", zh: "一种轻量策略梯度方法，用其余样本的平均奖励作为每个样本的基线，无需学习价值网络。" } }
genrm: { en: generative reward model, zh: 生成式奖励模型, abbr: GenRM, def: { en: "A reward model that judges by generating a critique or verdict in text rather than emitting a scalar, often using chain-of-thought.", zh: "一种通过生成文字评判或裁决、而非输出标量来打分的奖励模型，常配合思维链。" } }
budget-forcing: { en: budget forcing, zh: 预算强制, def: { en: "A test-time control that caps or extends how many reasoning tokens a model spends, trading latency for accuracy.", zh: "一种测试时控制，限制或延长模型花在推理上的词元数，以延迟换准确率。" } }
held-out: { en: held-out set, zh: 留出集, def: { en: "Data deliberately kept out of training so it can measure generalization; the basis of honest evaluation.", zh: "刻意排除在训练之外、用于衡量泛化能力的数据；诚实评测的基础。" } }
swiss-cheese: { en: Swiss-cheese model, zh: 瑞士奶酪, def: { en: "A safety framing where several imperfect layers each have holes, but stacking them so the holes do not line up blocks most failures.", zh: "一种安全框架：多个不完美的防护层各有漏洞，但层层叠放使漏洞不对齐，便能拦下大多数失效。" } }
canary: { en: canary strings, zh: 金丝雀字符串, def: { en: "Unique markers planted in data to detect later leakage or training-set contamination when they reappear in a model's output.", zh: "植入数据中的唯一标记，当它们在模型输出里重现时，用于检测泄漏或训练集污染。" } }
membership-inference: { en: membership inference, zh: 成员推断, def: { en: "An attack that tests whether a specific example was in a model's training set, a basic privacy threat.", zh: "一种攻击，测试某个具体样本是否在模型的训练集中，是基本的隐私威胁。" } }
helm: { en: Holistic Evaluation of Language Models, zh: HELM, def: { en: "A benchmark suite that scores models across many scenarios and metrics together, rather than reducing them to one leaderboard number.", zh: "一套基准，在众多场景与指标上整体评估模型，而非压缩为单一排行榜数字。" } }
llm-as-judge: { en: model-as-judge, zh: 模型作为评判者, def: { en: "Using a strong model to score or compare outputs in place of human raters: cheap and scalable, but with its own biases.", zh: "用一个强模型代替人工评分者来打分或比较输出，廉价可扩展但自带偏置。" } }
holistic-eval: { en: holistic evaluation, zh: 整体评测, def: { en: "Assessing a model across many dimensions (accuracy, robustness, bias, efficiency) at once, rather than optimizing one metric.", zh: "在准确性、鲁棒性、偏见、效率等多个维度上同时评估模型，而非只优化单一指标。" } }
goodhart: { en: Goodhart's law, zh: 古德哈特定律, def: { en: "Once a measure becomes a target it stops being a good measure; the reason benchmarks decay and rewards get hacked.", zh: "一旦某个度量被当作目标，它就不再是好的度量；基准会失效、奖励会被钻空子的原因。" } }
rubric: { en: rubric, zh: 评分准则, def: { en: "An explicit scoring guide listing the criteria and levels a judge applies, making subjective evaluation more consistent.", zh: "列出评判者所用标准与等级的明确评分指南，使主观评测更一致。" } }
byzantine-fault-tolerance: { en: Byzantine fault tolerance, zh: 拜占庭容错, def: { en: "A system's ability to reach correct consensus even when some components fail arbitrarily or maliciously, not just by crashing.", zh: "系统即使在部分组件任意或恶意失效（而非仅崩溃）时仍能达成正确共识的能力。" } }
arithmetic-coding: { en: arithmetic coding, zh: 算术编码, def: { en: "An entropy coder that encodes a whole message as a single fraction in [0,1), approaching the optimal bit rate; the bridge from prediction to compression.", zh: "一种熵编码，把整条消息编码为 [0,1) 内的单个小数，逼近最优码率；从预测通往压缩的桥梁。" } }
two-part-code: { en: two-part code, zh: 两部分编码, def: { en: "An MDL encoding that sends the model first and then the data given the model; its total length formalizes the fit-versus-complexity trade.", zh: "一种 MDL 编码，先发送模型、再发送给定模型下的数据；其总长度形式化了拟合与复杂度的权衡。" } }
temporal-difference: { en: temporal-difference, zh: 时序差分, def: { en: "A reinforcement-learning update that bootstraps a value estimate from the next step's estimate rather than waiting for the final return.", zh: "一种强化学习更新，用下一步的估计来自举当前价值估计，而非等到最终回报。" } }
evolution-strategies: { en: evolution strategies, zh: 进化策略, def: { en: "A black-box optimizer that perturbs parameters with noise and moves toward the higher-reward perturbations, needing no gradients.", zh: "一种黑盒优化器，用噪声扰动参数并朝奖励更高的扰动方向移动，无需梯度。" } }
kv-cache: { en: key-value cache, zh: KV 缓存, def: { en: "The stored keys and values of past tokens that let decode attend without recomputation; the memory cost that dominates serving.", zh: "保存过去词元的键和值、使解码无需重算即可关注它们的缓存；主导服务的内存成本。" } }
diffusion: { en: diffusion, zh: 扩散, def: { en: "A generative process that learns to reverse a gradual noising of data, turning pure noise into a sample step by step.", zh: "一种生成过程，学习逆转对数据逐步加噪的过程，把纯噪声一步步变成样本。" } }
flow-matching: { en: flow matching, zh: 流匹配, def: { en: "Training a generative model by regressing a velocity field that transports noise to data along straight-ish paths; a simpler alternative to diffusion training.", zh: "通过回归一个把噪声沿近乎直线路径输运到数据的速度场来训练生成模型；扩散训练的更简单替代。" } }
score: { en: score, zh: 分数, def: { en: "The gradient of the log-probability density with respect to the data; diffusion models learn it to know which way to denoise.", zh: "对数概率密度关于数据的梯度；扩散模型学习它以判断该往哪个方向去噪。" } }
sde: { en: stochastic differential equation, zh: 随机微分方程, abbr: SDE, def: { en: "A differential equation driven by random noise; the continuous-time view of the forward and reverse diffusion processes.", zh: "由随机噪声驱动的微分方程；扩散前向与逆向过程的连续时间视角。" } }
ode: { en: ordinary differential equation, zh: 常微分方程, abbr: ODE, def: { en: "A deterministic differential equation; sampling a diffusion or flow model can be cast as solving one, enabling fast few-step solvers.", zh: "一种确定性的微分方程；扩散或流模型的采样可化作求解它，从而支持快速的少步求解器。" } }
autoregression: { en: autoregression, zh: 自回归, def: { en: "Generating a sequence one element at a time, each conditioned on those before it; the dominant paradigm for language models.", zh: "一次生成序列中的一个元素、每个都以其前文为条件；语言模型的主导范式。" } }
non-autoregressive: { en: non-autoregressive generation, zh: 非自回归生成, abbr: NAR, def: { en: "Producing many output tokens in parallel rather than one at a time, trading some quality for far lower latency.", zh: "并行产出多个输出词元、而非逐个生成，以一定质量换取大幅降低的延迟。" } }
cfg: { en: classifier-free guidance, zh: 无分类器引导, abbr: CFG, def: { en: "A sampling trick that pushes a conditional generator away from its unconditional output to sharpen prompt adherence, trading diversity for fidelity.", zh: "一种采样技巧，把条件生成器推离其无条件输出以增强对提示的贴合，以多样性换保真度。" } }
dit: { en: diffusion transformer, zh: 扩散 Transformer, abbr: DiT, def: { en: "A diffusion model whose denoiser is a transformer over patches rather than a U-Net, the scalable backbone of modern image and video generators.", zh: "去噪器为作用于图块的 Transformer（而非 U-Net）的扩散模型，是现代图像与视频生成器可扩展的骨干。" } }
rectified-flow: { en: rectified flow, zh: 修正流, def: { en: "A flow-matching variant that straightens the transport paths between noise and data so fewer solver steps suffice for high quality.", zh: "一种流匹配变体，把噪声与数据之间的输运路径拉直，使更少的求解步即可达到高质量。" } }
ddpm: { en: denoising diffusion probabilistic models, zh: 去噪扩散概率模型, abbr: DDPM, def: { en: "The foundational discrete-time diffusion formulation that trains a network to predict the noise added at each step.", zh: "奠基性的离散时间扩散表述，训练网络预测每一步所加的噪声。" } }
fertility: { en: fertility, zh: 繁殖度, def: { en: "The average number of tokens a tokenizer produces per word; lower fertility means a more efficient vocabulary for a given language.", zh: "分词器平均每个词产生的词元数；繁殖度越低，对某种语言的词表越高效。" } }
asr: { en: automatic speech recognition, zh: 自动语音识别, abbr: ASR, def: { en: "Transcribing spoken audio into text; the input side of voice interfaces.", zh: "把语音音频转写为文本；语音界面的输入侧。" } }
ctc: { en: connectionist temporal classification, zh: 连接主义时序分类, abbr: CTC, def: { en: "A loss for sequence labeling without aligned targets, summing over all alignments; a staple of speech recognition.", zh: "一种无需对齐目标的序列标注损失，对所有可能对齐求和；语音识别的常用方法。" } }
tts: { en: text-to-speech, zh: 文本到语音, abbr: TTS, def: { en: "Synthesizing natural-sounding speech audio from text; the output side of voice interfaces.", zh: "从文本合成自然的语音音频；语音界面的输出侧。" } }
clip: { en: contrastive language-image pretraining, zh: 对比语言-图像预训练, abbr: CLIP, def: { en: "Training image and text encoders so matching pairs land close in a shared embedding space, enabling zero-shot classification and retrieval.", zh: "训练图像与文本编码器，使匹配对在共享嵌入空间中相邻，支撑零样本分类与检索。" } }
vit: { en: vision transformer, zh: 视觉 Transformer, abbr: ViT, def: { en: "A transformer that treats an image as a sequence of patches, bringing the architecture and its scaling to vision.", zh: "把图像视为图块序列的 Transformer，将该架构及其扩展能力带入视觉。" } }
vlm: { en: vision-language model, zh: 视觉语言模型, abbr: VLM, def: { en: "A model that takes both images and text and reasons over them jointly, the basis of multimodal assistants.", zh: "同时接收图像与文本并对其联合推理的模型，是多模态助手的基础。" } }
world-model: { en: world model, zh: 世界模型, def: { en: "A learned model of an environment's dynamics that an agent can roll forward to predict and plan, instead of acting only reactively.", zh: "对环境动力学习得的模型，智能体可向前推演以预测和规划，而非只做被动反应。" } }
vla: { en: vision-language-action model, zh: 视觉-语言-动作模型, abbr: VLA, def: { en: "A model that maps visual and language input directly to robot or agent actions, extending VLMs to control.", zh: "把视觉与语言输入直接映射为机器人或智能体动作的模型，把 VLM 扩展到控制。" } }
mechanistic-interpretability: { en: mechanistic interpretability, zh: 机械可解释性 }
polysemanticity: { en: polysemanticity, zh: 多义性 }
superposition: { en: superposition, zh: 叠加 }
