# Glossary: single source of truth for professional terms. Reference a term in
# any chapter with @gls-<key>; the pipeline expands it on first use per chapter
# (中文（English） / english (ABBR)), shows the short form after, links every use
# to the auto-generated glossary page, and warns on an undefined key. Add a term
# here once; never hand-maintain the gloss in prose.
#
#   <key>: { en: <full English>, zh: <full Chinese>, abbr: <optional abbreviation> }

moe:  { en: mixture-of-experts, zh: 混合专家, abbr: MoE }
ssm:  { en: state-space model, zh: 状态空间模型, abbr: SSM }
ffn:  { en: feed-forward network, zh: 前馈网络, abbr: FFN }
mha:  { en: multi-head attention, zh: 多头注意力, abbr: MHA }
mla:  { en: multi-head latent attention, zh: 多头潜在注意力, abbr: MLA }
sft:  { en: supervised fine-tuning, zh: 监督微调, abbr: SFT }
peft: { en: parameter-efficient fine-tuning, zh: 参数高效微调, abbr: PEFT }
bpe:  { en: byte-pair encoding, zh: 字节对编码, abbr: BPE }
lsh:  { en: locality-sensitive hashing, zh: 局部敏感哈希, abbr: LSH }
mup:  { en: maximal update parametrization, zh: 最大更新参数化, abbr: muP }
tp:   { en: tensor parallelism, zh: 张量并行, abbr: TP }
pp:   { en: pipeline parallelism, zh: 流水线并行, abbr: PP }
dp:   { en: data parallelism, zh: 数据并行, abbr: DP }
mfu:  { en: model FLOPs utilization, zh: 模型 FLOPs 利用率, abbr: MFU }
reward-hacking: { en: reward hacking, zh: 奖励欺骗 }

# Retrieval / serving / agents
rag:  { en: retrieval-augmented generation, zh: 检索增强生成, abbr: RAG }
ttft: { en: time to first token, zh: 首词元时间, abbr: TTFT }
tpot: { en: time per output token, zh: 每词元延迟, abbr: TPOT }
slo:  { en: service-level objective, zh: 服务等级目标, abbr: SLO }
# Attention / architecture
mqa:  { en: multi-query attention, zh: 多查询注意力, abbr: MQA }
gqa:  { en: grouped-query attention, zh: 分组查询注意力, abbr: GQA }
# Reasoning / RL
prm:  { en: process reward model, zh: 过程奖励模型, abbr: PRM }
mcts: { en: Monte Carlo tree search, zh: 蒙特卡洛树搜索, abbr: MCTS }
rlvr: { en: reinforcement learning with verifiable rewards, zh: 可验证奖励的强化学习, abbr: RLVR }
mdl:  { en: minimum description length, zh: 最小描述长度, abbr: MDL }
# Interpretability
sae:  { en: sparse autoencoder, zh: 稀疏自编码器, abbr: SAE }
# Hardware / reliability
hbm:  { en: high-bandwidth memory, zh: 高带宽显存, abbr: HBM }
ici:  { en: inter-chip interconnect, zh: 芯片间互连, abbr: ICI }
mtbf: { en: mean time between failures, zh: 平均无故障时间, abbr: MTBF }
lru:  { en: least recently used, zh: 最近最少使用, abbr: LRU }
# Defined for @gls use (not auto-migrated: the book uses the abbr directly)
llm:  { en: large language model, zh: 大语言模型, abbr: LLM }
rlhf: { en: reinforcement learning from human feedback, zh: 基于人类反馈的强化学习, abbr: RLHF }
