<!-- Reader shell: apply persisted reading settings to <html> before first
     paint, so there is no flash of the wrong palette/theme. The settings panel
     in reader-shell.html writes the same localStorage keys. Defaults: ink
     palette, theme from the OS preference, codex layout, sans body, 100% size. -->
<script>
(function () {
  try {
    var d = document.documentElement, ls = window.localStorage;
    function get(k, fb) { try { var v = ls.getItem(k); return v === null ? fb : v; } catch (e) { return fb; } }
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    d.setAttribute('data-palette',  get('rdr-palette', 'ink'));
    d.setAttribute('data-theme',    get('rdr-theme', prefersDark ? 'dark' : 'light'));
    d.setAttribute('data-layout',   get('rdr-layout', 'codex'));
    d.setAttribute('data-bodyfont', get('rdr-bodyfont', 'sans'));
    d.setAttribute('data-nav',      get('rdr-nav', 'open'));   // desktop sidebar
    d.setAttribute('data-toc',      get('rdr-toc', 'open'));   // desktop on-this-page
    var fs = parseFloat(get('rdr-fontscale', '1'));
    if (!(fs >= 0.8 && fs <= 1.4)) fs = 1;
    d.style.setProperty('--reader-font-scale', String(fs));
  } catch (e) {}
})();
</script>
