# Apex language: the reader's saved preference (a `lang` cookie set on every
# page load), else English. http-context map (this file is included in http).
map $cookie_lang $apex_lang {
    default /en/;
    zh      /zh/;
    en      /en/;
}

server {
    listen 8080;
    server_name _;

    # Behind the TLS-terminating ingress, nginx sees http on :8080. Without
    # this, a relative redirect becomes http://host:8080/... (a dead port).
    # Emit relative Location headers so the browser keeps https://host/...
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. The full-text search index (search.json) is ~1.2MB
    # raw but ~450KB gzipped; this also covers the HTML pages and reader.js.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Health endpoints for the Kubernetes probes.
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz  { access_log off; return 200 "ok\n"; }

    # Apex → reader's saved language, else English. 302 (not 301) + Vary: Cookie
    # so the per-language choice is never frozen in a cache.
    location = / {
        add_header Vary Cookie;
        return 302 $apex_lang;
    }

    # Content-addressed assets cache hard: reader.js is busted with ?v=<hash>,
    # figures/fonts/icons are content-stable.
    location ~* \.(?:js|svg|png|jpe?g|webp|woff2?|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Chapters relocated 2026-06: the generative/multimodal chapters split out of
    # Part XI into Part XII (p12-generative), and Operations became Part XIII
    # (p13-operations). 301 the old paths (clean, .html, and trailing-slash forms,
    # both languages) to the new locations so external links do not 404.
    location ~ ^/(en|zh)/p11-frontiers/(50-beyond-text|52-diffusion-flow-matching|55-speech-and-voice|57-nar-diffusion-lms|58-multimodal-models)(?:\.html)?/?$ {
        return 301 /$1/p12-generative/$2;
    }
    location ~ ^/(en|zh)/p12-operations/(52-deployment-lifecycle|53-reliability-nondeterministic|54-production-data-engine)(?:\.html)?/?$ {
        return 301 /$1/p13-operations/$2;
    }

    # Serve the extensionless URL from the on-disk .html file. HTML (and the
    # un-hashed search.json) must revalidate so a deploy is picked up at once:
    # the inlined CSS/JS ships inside the HTML, so a stale page = stale styles.
    # ETag makes the revalidation a cheap 304.
    location / {
        # Canonicalize the legacy .html and redundant /index.html forms to the
        # clean URL. Gate on $request_uri (the ORIGINAL client request): the
        # `index` module rewrites "/en/" -> "/en/index.html" internally, and
        # matching that rewrite would 301 back to "/en/" forever. $request_uri
        # stays "/en/" through internal redirects, so the loop can't form.
        # `if { return ...; }` is one of the two constructs safe inside location.
        if ($request_uri ~ "^(/.*)/index\.html(\?|$)") { return 301 $1/; }
        if ($request_uri ~ "^([^?]+)\.html(\?|$)")     { return 301 $1; }
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
