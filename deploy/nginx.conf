server {
    listen 8080;
    server_name _;

    # Behind the TLS-terminating ingress, nginx sees http on :8080. Without
    # this, a relative redirect becomes http://host:8080/... (a dead port).
    # Emit relative Location headers so the browser keeps https://host/...
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoints for the Kubernetes probes.
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz  { access_log off; return 200 "ok\n"; }

    # The book renders to _book/en and _book/zh; send the apex to English.
    location = / { return 302 /en/; }

    # Clean URLs: the canonical form is extensionless (/en/references). Redirect
    # the legacy .html and the redundant /index forms to it (301, permanent).
    # Regex locations are checked before the prefix location below, and the
    # index rule is listed first so index.html maps to the directory, not /index.
    location ~ ^(.*)/index\.html$ { return 301 $1/; }
    location ~ ^(.+)\.html$       { return 301 $1; }

    # Serve the extensionless URL from the on-disk .html file.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
