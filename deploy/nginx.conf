# Apex language: the reader's saved preference (a `lang` cookie set on every
# page load), else English. http-context map (this file is included in http).
map $cookie_lang $apex_lang {
    default /en/;
    zh      /zh/;
    en      /en/;
}

server {
    listen 8080;
    server_name _;

    # Behind the TLS-terminating ingress, nginx sees http on :8080. Without
    # this, a relative redirect becomes http://host:8080/... (a dead port).
    # Emit relative Location headers so the browser keeps https://host/...
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. The full-text search index (search.json) is ~1.2MB
    # raw but ~450KB gzipped; this also covers the HTML pages and reader.js.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Health endpoints for the Kubernetes probes.
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz  { access_log off; return 200 "ok\n"; }

    # Apex → reader's saved language, else English. 302 (not 301) + Vary: Cookie
    # so the per-language choice is never frozen in a cache.
    location = / {
        add_header Vary Cookie;
        return 302 $apex_lang;
    }

    location @site_root {
        return 302 /;
    }

    # Content-addressed assets cache hard: reader.js is busted with ?v=<hash>,
    # figures/fonts/icons are content-stable.
    location ~* \.(?:js|svg|png|jpe?g|webp|woff2?|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
    }

    # ---- Reorg 2026-06: number-free URLs + 11-part restructure ----
    # Every chapter URL is now /{lang}/{part}/{slug} with no numeric prefixes.
    # 301 every prior form (original "pN-part/NN-slug", the brief de-numbered
    # "pN-part/slug", and pre-2026 historical dirs) to the final location. The
    # optional "(?:\d+-)?" absorbs the old chapter number. Order is first-match-
    # wins: the two cross-part exceptions sit above their old part's bulk rule.

    # Exception: "Training Agents to Act" moved Reasoning -> Orchestration.
    location ~ ^/(en|zh)/p3-reasoning/(?:\d+-)?training-agents-to-act(?:\.html)?/?$ {
        return 301 /$1/orchestration/training-agents-to-act;
    }
    # Exception: the generative/multimodal chapters (once in p11-frontiers) -> generative.
    location ~ ^/(en|zh)/p11-frontiers/(?:\d+-)?(beyond-text|diffusion-flow-matching|speech-and-voice|nar-diffusion-lms|multimodal-models)(?:\.html)?/?$ {
        return 301 /$1/generative/$2;
    }

    # Bulk per-old-part-dir renames (strip optional NN-, remap the part slug).
    location ~ ^/(en|zh)/p0-orientation/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$  { return 301 /$1/orientation/$2; }
    location ~ ^/(en|zh)/p1-foundations/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$  { return 301 /$1/foundations/$2; }
    location ~ ^/(en|zh)/p2-adaptation/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$   { return 301 /$1/adaptation/$2; }
    location ~ ^/(en|zh)/p3-reasoning/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$    { return 301 /$1/reasoning/$2; }
    location ~ ^/(en|zh)/p4-inference/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$    { return 301 /$1/inference/$2; }
    location ~ ^/(en|zh)/p5-orchestration/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$ { return 301 /$1/orchestration/$2; }
    location ~ ^/(en|zh)/p6-evaluation/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$   { return 301 /$1/evaluation/$2; }
    location ~ ^/(en|zh)/p7-infrastructure/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$ { return 301 /$1/infrastructure/$2; }
    location ~ ^/(en|zh)/p8-safety/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$       { return 301 /$1/safety/$2; }
    location ~ ^/(en|zh)/p9-ecosystem/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$    { return 301 /$1/ecosystem/$2; }
    location ~ ^/(en|zh)/p10-practical/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$   { return 301 /$1/practice/$2; }
    location ~ ^/(en|zh)/p11-frontiers/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$   { return 301 /$1/infrastructure/$2; }
    location ~ ^/(en|zh)/p12-generative/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$  { return 301 /$1/generative/$2; }
    location ~ ^/(en|zh)/p12-operations/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$  { return 301 /$1/practice/$2; }
    location ~ ^/(en|zh)/p13-operations/(?:\d+-)?([a-z0-9-]+?)(?:\.html)?/?$  { return 301 /$1/practice/$2; }
    # Serve the extensionless URL from the on-disk .html file. HTML (and the
    # un-hashed search.json) must revalidate so a deploy is picked up at once:
    # the inlined CSS/JS ships inside the HTML, so a stale page = stale styles.
    # ETag makes the revalidation a cheap 304.
    location / {
        # Unknown content URLs should land back on the website entrypoint instead
        # of exposing nginx's default 404 page. The named fallback avoids
        # internally re-entering `location = /`, so the first Location is `/`.
        # Keep this scoped to the content router so missing immutable assets
        # still fail as assets.
        error_page 404 = @site_root;

        # Canonicalize the legacy .html and redundant /index.html forms to the
        # clean URL. Gate on $request_uri (the ORIGINAL client request): the
        # `index` module rewrites "/en/" -> "/en/index.html" internally, and
        # matching that rewrite would 301 back to "/en/" forever. $request_uri
        # stays "/en/" through internal redirects, so the loop can't form.
        # `if { return ...; }` is one of the two constructs safe inside location.
        if ($request_uri ~ "^(/.*)/index\.html(\?|$)") { return 301 $1/; }
        if ($request_uri ~ "^([^?]+)\.html(\?|$)")     { return 301 $1; }
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
