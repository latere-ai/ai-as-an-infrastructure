# Apex language: the reader's saved preference (a `lang` cookie set on every
# page load), else English. http-context map (this file is included in http).
map $cookie_lang $apex_lang {
    default /en/;
    zh      /zh/;
    en      /en/;
}

server {
    listen 8080;
    server_name _;

    # Behind the TLS-terminating ingress, nginx sees http on :8080. Without
    # this, a relative redirect becomes http://host:8080/... (a dead port).
    # Emit relative Location headers so the browser keeps https://host/...
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. The full-text search index (search.json) is ~1.2MB
    # raw but ~450KB gzipped; this also covers the HTML pages and reader.js.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Health endpoints for the Kubernetes probes.
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz  { access_log off; return 200 "ok\n"; }

    # Apex → reader's saved language, else English. 302 (not 301) + Vary: Cookie
    # so the per-language choice is never frozen in a cache.
    location = / {
        add_header Vary Cookie;
        return 302 $apex_lang;
    }

    # Clean URLs: the canonical form is extensionless (/en/references). Redirect
    # the legacy .html and the redundant /index forms to it (301, permanent).
    # Regex locations are checked before the prefix location below, and the
    # index rule is listed first so index.html maps to the directory, not /index.
    location ~ ^(.*)/index\.html$ { return 301 $1/; }
    location ~ ^(.+)\.html$       { return 301 $1; }

    # Serve the extensionless URL from the on-disk .html file.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
