server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoints for the Kubernetes probes.
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /readyz  { access_log off; return 200 "ok\n"; }

    # The book renders to _book/en and _book/zh; send the apex to English.
    location = / { return 302 /en/; }

    location / {
        try_files $uri $uri/ =404;
    }
}
