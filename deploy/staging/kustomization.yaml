apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── STAGING (STUB — NOT DEPLOYED YET) ────────────────────────────────────────
# Placeholder overlay so a future staging environment is a small diff, not a
# new setup. Nothing applies this today; deploy/publish.sh only deploys
# deploy/prod/. Before using staging, provision the `latere-staging` namespace,
# the `aaai-db`/`aaai-auth` secrets, DNS + a cert for aaai-staging.latere.ai,
# and decide whether staging points at a separate auth service (AUTH_URL).
namespace: latere-staging

resources:
  - ../base

# Override the prod values the base carries with their staging equivalents.
patches:
  - target:
      kind: Deployment
      name: aaai-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: aaai-web
      spec:
        template:
          spec:
            containers:
              - name: aaai-web
                env:
                  - name: AUTH_REDIRECT_URL
                    value: https://aaai-staging.latere.ai/callback
  - target:
      kind: Ingress
      name: aaai-web
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: aaai-web
      spec:
        tls:
          - hosts:
              - aaai-staging.latere.ai
            secretName: aaai-web-staging-tls
        rules:
          - host: aaai-staging.latere.ai
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: aaai-web
                      port:
                        number: 80
