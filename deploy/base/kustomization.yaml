apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-neutral base for the ai-as-an-infrastructure web service. Overlays
# inject the namespace and patch env-specific values (public host, TLS secret,
# self-referential AUTH_REDIRECT_URL). The image is NOT overridden by kustomize:
# deployment.yaml pins the moving `:main` tag and publish.sh's `rollout restart`
# (imagePullPolicy: Always) re-pulls it on every deploy — the pipeline, not this
# base, owns which build `:main` resolves to.
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
