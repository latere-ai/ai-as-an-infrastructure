apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaai-web
  labels:
    app: aaai-web
spec:
  replicas: 1
  # maxSurge 0 is deliberate, not a default. The shared Postgres has 25
  # connection slots across every latere database, so a surge pod holds two
  # aaai-web pools at once and its migrations fail to connect (SQLSTATE 53300).
  # Replacing the pod rather than adding one keeps the peak at a single pool.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: aaai-web
  template:
    metadata:
      labels:
        app: aaai-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aaai-web
          image: ghcr.io/latere-ai/ai-as-an-infrastructure:main
          # :main is a moving tag; always re-pull so a rollout picks up the
          # freshly built image instead of the node's cached layer.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Comments database (created by terraform: kubernetes_secret.aaai_db).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aaai-db
                  key: DATABASE_URL
            # OIDC login (public client; PKCE, no client secret).
            - name: AUTH_URL
              value: https://auth.latere.ai
            - name: AUTH_CLIENT_ID
              value: aaai-web
            - name: AUTH_REDIRECT_URL
              value: https://aaai.latere.ai/callback
            # Local secret each deployment generates (openssl rand -hex 32),
            # stored in the aaai-auth secret. Required for a public client.
            - name: AUTH_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: aaai-auth
                  key: AUTH_COOKIE_KEY
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              # The binary embeds the whole book (~70Mi RSS); the pgx pool and Go
              # runtime add headroom on top.
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # The self-contained Go binary serves embedded assets from memory and
            # writes nothing to disk, so no writable volumes are needed.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
