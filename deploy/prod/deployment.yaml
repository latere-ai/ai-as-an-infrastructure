apiVersion: apps/v1
kind: Deployment
metadata:
  name: aaai-web
  namespace: latere
  labels:
    app: aaai-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aaai-web
  template:
    metadata:
      labels:
        app: aaai-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aaai-web
          image: ghcr.io/latere-ai/ai-as-an-infrastructure:main
          # :main is a moving tag; always re-pull so a rollout picks up the
          # freshly built image instead of the node's cached layer.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              # The binary embeds the whole book (~70Mi); its pages are mapped
              # read-only from the executable, so RSS sits below this headroom.
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # The self-contained Go binary serves embedded assets from memory and
            # writes nothing to disk, so no writable volumes are needed.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
