version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # modernize reports hand-written code that a standard library call or a
    # language builtin already covers: membership loops that are
    # slices.Contains, if/else pairs that are min/max, map loops that are
    # maps.Copy, HasPrefix/TrimPrefix pairs that are strings.CutPrefix.
    - modernize
  settings:
    modernize:
      disable:
        # newexpr rewrites pointer helpers such as func ptr(v T) *T to
        # new(v), then inlines call sites unevenly: the helper is left with
        # no callers (which trips unused), and an untyped constant argument
        # takes the wrong default type.
        - newexpr
        # errorsastype rewrites errors.As to errors.AsType[T], whose type
        # parameter is constrained to [E error]. A local non-error interface
        # target such as interface{ SQLState() string } does not satisfy it,
        # so the rewrite does not compile.
        - errorsastype

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/latere-ai/ai-as-an-infrastructure
