project:
  type: book
  output-dir: ../_book/zh

lang: zh

# Drop the soft line breaks pandoc would otherwise turn into visible spaces
# between CJK characters (the source wraps paragraphs at ~100 cols). The
# east_asian_line_breaks reader extension is not honored through Quarto, so a
# small AST filter does it instead.
filters:
  - ../cjk-softbreak.lua

book:
  title: "AI 基建"
  subtitle: "从系统到智能体：历史、设计与基石"
  author: "Changkun Ou"
  date: today
  publisher: "latere.ai"
  search: true
  page-footer:
    left: "© 2026 latere.ai"
    right: "CC BY-NC-ND 4.0"
  chapters:
    - index.qmd
    - part: "第 0 部分 · 入门定位"
      chapters:
        - orientation/01-whole-stack.qmd
        - orientation/02-field-map.qmd
        - orientation/03-borrowed-ideas.qmd
    - part: "第一部分 · 基础与预训练"
      chapters:
        - foundations/01-scaling-laws.qmd
        - foundations/02-data-curation.qmd
        - foundations/03-tokenization.qmd
        - foundations/04-transformer-architecture.qmd
        - foundations/05-moe-ssm-hybrids.qmd
        - foundations/06-training-at-scale.qmd
    - part: "第二部分 · 生成式与多模态架构"
      chapters:
        - generative/01-diffusion-flow-matching.qmd
        - generative/02-nar-diffusion-lms.qmd
        - generative/03-speech-and-voice.qmd
        - generative/04-multimodal-models.qmd
        - generative/05-beyond-text.qmd
    - part: "第三部分 · 适配与对齐"
      chapters:
        - adaptation/01-sft-peft.qmd
        - adaptation/02-rlhf-reward-modeling.qmd
        - adaptation/03-dpo-variants.qmd
        - adaptation/04-synthetic-data-self-improvement.qmd
    - part: "第四部分 · 推理与测试时算力"
      chapters:
        - reasoning/01-eliciting-reasoning.qmd
        - reasoning/02-training-to-reason.qmd
        - reasoning/03-inference-time-scaling.qmd
    - part: "第五部分 · 推理与服务"
      chapters:
        - inference/01-serving-problem.qmd
        - inference/02-memory-scheduling.qmd
        - inference/03-faster-decoding.qmd
        - inference/04-quantization-kernels.qmd
        - inference/05-structured-long-context.qmd
        - inference/06-serving-multimodal.qmd
    - part: "第六部分 · 编排：智能体、检索与上下文"
      chapters:
        - orchestration/01-training-agents-to-act.qmd
        - orchestration/02-agent-architectures.qmd
        - orchestration/03-memory-systems.qmd
        - orchestration/04-the-harness.qmd
        - orchestration/05-multi-agent-systems.qmd
        - orchestration/06-rag-retrieval.qmd
        - orchestration/07-embeddings-representation.qmd
        - orchestration/08-context-engineering.qmd
    - part: "第七部分 · 评测"
      chapters:
        - evaluation/01-benchmarks.qmd
        - evaluation/02-judging-holistic.qmd
        - evaluation/03-evaluating-agents.qmd
    - part: "第八部分 · 安全、可解释性与治理"
      chapters:
        - safety/01-mechanistic-interpretability.qmd
        - safety/02-scalable-oversight-control.qmd
        - safety/03-security-authorization.qmd
        - safety/04-runtime-safety.qmd
        - safety/05-adversarial-robustness.qmd
        - safety/06-privacy-provenance-unlearning.qmd
        - safety/07-law-regulation-policy.qmd
    - part: "第九部分 · 基础设施、算力与前沿"
      chapters:
        - infrastructure/01-accelerators-networking.qmd
        - infrastructure/02-orchestration-data-infra.qmd
        - infrastructure/03-the-compute-frontier.qmd
        - infrastructure/04-making-the-silicon.qmd
        - infrastructure/05-powering-it.qmd
        - infrastructure/06-the-machine-that-breaks.qmd
        - infrastructure/07-where-learning-hits-limits.qmd
        - infrastructure/08-the-capability-horizon.qmd
    - part: "第十部分 · 生态与经济"
      chapters:
        - ecosystem/01-model-landscape.qmd
        - ecosystem/02-tooling-ecosystem.qmd
        - ecosystem/03-economics.qmd
    - part: "第十一部分 · 实践与运营"
      chapters:
        - practice/01-choosing-a-model.qmd
        - practice/02-serving-and-compute.qmd
        - practice/03-edge-on-device.qmd
        - practice/04-training-finetuning-practice.qmd
        - practice/05-agents-and-sandboxes.qmd
        - practice/06-retrieval-and-documents.qmd
        - practice/07-evaluation-and-observability.qmd
        - practice/08-wiring-a-2026-stack.qmd
        - practice/09-deployment-lifecycle.qmd
        - practice/10-reliability-nondeterministic.qmd
        - practice/11-production-data-engine.qmd
    - summary.qmd
    - references.qmd

format:
  html:
    theme: [../theme.scss]
    toc: true
    code-link: true
    include-in-header:
      - ../fonts-head.html
      - ../reader-head.html
    include-after-body:
      - ../language-switch.html
      - ../live-runtime.html
      - ../viz-runtime.html
      - ../reader-shell.html
    mermaid:
      theme: neutral

execute:
  freeze: auto
