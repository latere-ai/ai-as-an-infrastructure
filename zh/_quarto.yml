project:
  type: book
  output-dir: ../_book/zh

lang: zh

# Drop the soft line breaks pandoc would otherwise turn into visible spaces
# between CJK characters (the source wraps paragraphs at ~100 cols). The
# east_asian_line_breaks reader extension is not honored through Quarto, so a
# small AST filter does it instead.
filters:
  - ../cjk-softbreak.lua

book:
  title: "AI 基建"
  subtitle: "从系统到智能体：历史、设计与基石"
  author: "Changkun Ou"
  date: today
  publisher: "latere.ai"
  search: true
  page-footer:
    left: "© 2026 latere.ai"
    right: "CC BY-NC-ND 4.0"
  chapters:
    - index.qmd
    - part: "第 0 部分 · 入门定位"
      chapters:
        - p0-orientation/01-whole-stack.qmd
        - p0-orientation/02-field-map.qmd
    - part: "第一部分 · 基础与预训练"
      chapters:
        - p1-foundations/03-scaling-laws.qmd
        - p1-foundations/04-data-curation.qmd
        - p1-foundations/05-tokenization.qmd
        - p1-foundations/06-transformer-architecture.qmd
        - p1-foundations/07-moe-ssm-hybrids.qmd
        - p1-foundations/08-training-at-scale.qmd
    - part: "第二部分 · 适配与对齐"
      chapters:
        - p2-adaptation/09-sft-peft.qmd
        - p2-adaptation/10-rlhf-reward-modeling.qmd
        - p2-adaptation/11-dpo-variants.qmd
        - p2-adaptation/12-synthetic-data-self-improvement.qmd
    - part: "第三部分 · 推理与测试时算力"
      chapters:
        - p3-reasoning/13-eliciting-reasoning.qmd
        - p3-reasoning/14-training-to-reason.qmd
        - p3-reasoning/15-inference-time-scaling.qmd
    - part: "第四部分 · 推理与服务"
      chapters:
        - p4-inference/16-serving-problem.qmd
        - p4-inference/17-memory-scheduling.qmd
        - p4-inference/18-faster-decoding.qmd
        - p4-inference/19-quantization-kernels.qmd
        - p4-inference/20-structured-long-context.qmd
        - p4-inference/21-serving-multimodal.qmd
    - part: "第五部分 · 编排：智能体、检索与上下文"
      chapters:
        - p5-orchestration/21-agent-architectures.qmd
        - p5-orchestration/22-memory-systems.qmd
        - p5-orchestration/23-the-harness.qmd
        - p5-orchestration/24-multi-agent-systems.qmd
        - p5-orchestration/25-rag-retrieval.qmd
        - p5-orchestration/26-context-engineering.qmd
    - part: "第六部分 · 评测"
      chapters:
        - p6-evaluation/27-benchmarks.qmd
        - p6-evaluation/28-judging-holistic.qmd
        - p6-evaluation/29-evaluating-agents.qmd
    - part: "第七部分 · 基础设施与系统"
      chapters:
        - p7-infrastructure/30-accelerators-networking.qmd
        - p7-infrastructure/31-orchestration-data-infra.qmd
    - part: "第八部分 · 安全、可解释性与治理"
      chapters:
        - p8-safety/32-mechanistic-interpretability.qmd
        - p8-safety/33-scalable-oversight-control.qmd
        - p8-safety/34-security-authorization.qmd
        - p8-safety/35-runtime-safety.qmd
        - p8-safety/36-adversarial-robustness.qmd
        - p8-safety/37-privacy-provenance-unlearning.qmd
        - p8-safety/38-law-regulation-policy.qmd
    - part: "第九部分 · 生态与经济"
      chapters:
        - p9-ecosystem/35-model-landscape.qmd
        - p9-ecosystem/36-tooling-ecosystem.qmd
        - p9-ecosystem/37-economics.qmd
    - part: "第十部分 · 实践：搭建 2026 技术栈"
      chapters:
        - p10-practical/38-choosing-a-model.qmd
        - p10-practical/39-serving-and-compute.qmd
        - p10-practical/40-training-finetuning-practice.qmd
        - p10-practical/41-agents-and-sandboxes.qmd
        - p10-practical/42-retrieval-and-documents.qmd
        - p10-practical/43-evaluation-and-observability.qmd
        - p10-practical/44-wiring-a-2026-stack.qmd
    - part: "第十一部分 · 前沿与瓶颈"
      chapters:
        - p11-frontiers/45-the-compute-frontier.qmd
        - p11-frontiers/46-making-the-silicon.qmd
        - p11-frontiers/47-powering-it.qmd
        - p11-frontiers/48-the-machine-that-breaks.qmd
        - p11-frontiers/49-where-learning-hits-limits.qmd
        - p11-frontiers/50-beyond-text.qmd
        - p11-frontiers/51-the-capability-horizon.qmd
    - part: "第十二部分 · 生产环境中的运营"
      chapters:
        - p12-operations/52-deployment-lifecycle.qmd
        - p12-operations/53-reliability-nondeterministic.qmd
        - p12-operations/54-production-data-engine.qmd
    - summary.qmd
    - references.qmd

bibliography: ../references.bib

format:
  html:
    theme: [../theme.scss]
    toc: true
    code-link: true
    include-in-header:
      - ../fonts-head.html
      - ../reader-head.html
    include-after-body:
      - ../language-switch.html
      - ../live-runtime.html
      - ../viz-runtime.html
      - ../reader-shell.html
    mermaid:
      theme: neutral
  pdf:
    documentclass: scrbook
    papersize: a4
  epub: default

execute:
  freeze: auto
