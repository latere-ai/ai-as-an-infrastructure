        - p4-inference/20-structured-long-context.qmd
    - part: "Part V: Orchestration: Agents, Retrieval, Context"
      chapters:
        - p5-orchestration/21-agent-architectures.qmd
        - p5-orchestration/22-memory-systems.qmd
        - p5-orchestration/23-the-harness.qmd
        - p5-orchestration/24-multi-agent-systems.qmd
        - p5-orchestration/25-rag-retrieval.qmd
        - p5-orchestration/26-context-engineering.qmd
    - part: "Part VI: Evaluation"
      chapters:
        - p6-evaluation/27-benchmarks.qmd
        - p6-evaluation/28-judging-holistic.qmd
        - p6-evaluation/29-evaluating-agents.qmd
    - part: "Part VII: Infrastructure and Systems"
      chapters:
        - p7-infrastructure/30-accelerators-networking.qmd
        - p7-infrastructure/31-orchestration-data-infra.qmd
