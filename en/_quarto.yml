        - p2-adaptation/11-dpo-variants.qmd
        - p2-adaptation/12-synthetic-data-self-improvement.qmd
    - part: "Part III: Reasoning and Test-Time Compute"
      chapters:
        - p3-reasoning/13-eliciting-reasoning.qmd
        - p3-reasoning/14-training-to-reason.qmd
