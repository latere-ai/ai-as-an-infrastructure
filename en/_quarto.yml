    - references.qmd

bibliography: ../references.bib

format:
  html:
    theme:
      light: ../theme.scss
      dark: [../theme.scss, ../theme-dark.scss]
    toc: true
    code-link: true
    include-in-header: ../fonts-head.html
    include-after-body:
      - ../language-switch.html
      - ../live-runtime.html
      - ../viz-runtime.html
    mermaid:
      theme: neutral
  pdf:
    documentclass: scrbook
    papersize: a4
  epub: default

execute:
  freeze: auto
