project:
  type: book
  output-dir: ../_book/en

lang: en

book:
  title: "AI as an Infrastructure"
  subtitle: "From Systems to Agents: History, Design Decisions, and Foundations"
  author: "Changkun Ou"
  date: today
  publisher: "latere.ai"
  search: true
  page-footer:
    left: "© 2026 latere.ai"
    right: "CC BY-NC-ND 4.0"
  chapters:
    - index.qmd
    - part: "Part 0: Orientation"
      chapters:
        - p0-orientation/01-whole-stack.qmd
