        - p9-ecosystem/37-economics.qmd
    - part: "Part X: A Practical 2026 Stack"
      chapters:
        - p10-practical/38-choosing-a-model.qmd
        - p10-practical/39-serving-and-compute.qmd
        - p10-practical/40-training-finetuning-practice.qmd
        - p10-practical/41-agents-and-sandboxes.qmd
        - p10-practical/42-retrieval-and-documents.qmd
