<script>
(function () {
  function init() {
    var p = location.pathname, to, label;
    if (p.indexOf('/zh/') !== -1) { to = p.replace('/zh/', '/en/'); label = 'EN'; }
    else { to = p.replace('/en/', '/zh/'); label = '中文'; }
    var a = document.createElement('a');
    a.id = 'lang-switch';
    a.href = to;
    a.textContent = label;
    a.title = 'Switch language';
    a.setAttribute('aria-label', 'Switch language');
    var title = document.querySelector('#quarto-sidebar .sidebar-title');
    var menu = document.querySelector('#quarto-sidebar .sidebar-menu-container');
    var sb = document.querySelector('#quarto-sidebar');
    if (title && title.parentNode) { title.parentNode.insertBefore(a, title.nextSibling); }
    else if (menu) { menu.insertBefore(a, menu.firstChild); }
    else if (sb) { sb.insertBefore(a, sb.firstChild); }
  }
  if (document.readyState !== 'loading') init();
  else document.addEventListener('DOMContentLoaded', init);
})();
</script>
