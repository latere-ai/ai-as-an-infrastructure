<style>
.live-cell { margin: 1.3em 0; border: 1px solid var(--border-strong, rgba(128,128,128,0.28)); border-radius: 8px; overflow: hidden; background: var(--bg-code, transparent); }
/* Code on the left, result on the right; stacks on narrow screens. */
.live-grid { display: flex; flex-wrap: wrap; align-items: stretch; }
.live-code { display: flex; flex-direction: column; flex: 1 1 56%; min-width: 0; }
.live-result { display: none; flex: 1 1 40%; min-width: 240px; flex-direction: column; border-left: 1px solid var(--border, rgba(128,128,128,0.22)); background: var(--bg-surface, rgba(128,128,128,0.03)); }
.live-cell.ran .live-result { display: flex; }
/* The editor: a syntax-highlighted layer behind a transparent textarea. Both
   share identical metrics so the caret lands on the right glyph. */
.live-edit { position: relative; flex: 1; }
.live-hl, .live-editor {
  margin: 0; box-sizing: border-box; padding: 0.85em 1em;
  font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 0.84em;
  line-height: 1.6; tab-size: 4; white-space: pre; word-wrap: normal;
}
.live-hl { position: absolute; inset: 0; overflow: auto; pointer-events: none; color: var(--fg-1, inherit); }
.live-hl code { font: inherit; }
.live-editor { position: relative; display: block; width: 100%; min-height: 100%; border: 0; outline: none; resize: none; overflow: auto; background: transparent; color: transparent; caret-color: var(--fg-1, currentColor); }
.live-editor::selection { background: var(--accent-glow, rgba(128,128,128,0.3)); }
.live-bar { display: flex; align-items: center; gap: 0.6em; padding: 0.45em 0.8em; border-top: 1px solid var(--border, rgba(128,128,128,0.22)); }
.live-run, .live-reset { font: inherit; font-size: 0.8em; padding: 2px 13px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border-strong, rgba(128,128,128,0.4)); background: var(--bg-raised, rgba(128,128,128,0.08)); color: inherit; }
.live-run { background: var(--accent, #3b82f6); color: var(--bg-surface, #fff); border-color: var(--accent, #3b82f6); }
.live-run:hover { background: var(--accent-hover, #2f6fe0); border-color: var(--accent-hover, #2f6fe0); }
.live-status { font-size: 0.78em; opacity: 0.7; }
.live-out { margin: 0; padding: 0.6em 1em; font-size: 0.82em; white-space: pre-wrap; word-break: break-word; background: transparent; flex: none; }
.live-out:empty { display: none; }
.live-img { display: block; max-width: 100%; margin: 0.4em auto 0.7em; }
/* Python token colors (one-light / one-dark style), themed for light/dark. */
.lt-kw { color: #a626a4; } .lt-str { color: #50a14f; } .lt-num { color: #b76b01; }
.lt-com { color: var(--fg-3, #9c9890); font-style: italic; } .lt-bi { color: #4078f2; } .lt-dec { color: #c18401; }
.reader[data-theme="dark"] .lt-kw { color: #c678dd; }
.reader[data-theme="dark"] .lt-str { color: #98c379; }
.reader[data-theme="dark"] .lt-num { color: #d19a66; }
.reader[data-theme="dark"] .lt-bi { color: #61afef; }
.reader[data-theme="dark"] .lt-dec { color: #e5c07b; }
@media (max-width: 720px) {
  .live-result { flex-basis: 100%; border-left: 0; border-top: 1px solid var(--border, rgba(128,128,128,0.22)); }
}
/* Mobile overflow guards (wide tables, long links/code, wide math). */
.table-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
mjx-container[display="true"], .math.display, .katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
@media (max-width: 575.98px) {
  .table-scroll table { display: table; width: auto; max-width: none; }
  a, .math, span.math { overflow-wrap: anywhere; word-break: break-word; }
  /* Inline code (not a code block) must wrap; its white-space:pre otherwise
     paints outside a narrow list item and widens the page. */
  :not(pre) > code { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
  span.math.inline, mjx-container:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; vertical-align: middle; }
}
</style>
<script>
// Runnable Python, client-side via Pyodide. Mark a code block in Quarto with
//   ::: {.runnable}
//   ```python
//   ...
//   ```
//   :::
// and it becomes an editable, runnable cell (no server). Pyodide loads lazily
// on the first Run, once per page.
(function () {
  var PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';
  var BLANK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  var pyPromise = null;

  // Minimal, dependency-free Python highlighter for the editor overlay. Strings
  // and comments are matched before identifiers so keywords inside them stay
  // plain. Identifiers are \w-only, so they need no HTML escaping.
  var PY_KW = /^(False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|match|case)$/;
  var PY_BI = /^(print|len|range|int|float|str|list|dict|set|tuple|bool|bytes|abs|min|max|sum|sorted|reversed|enumerate|zip|map|filter|open|type|isinstance|issubclass|super|object|format|repr|round|input|any|all|getattr|setattr|hasattr|next|iter|id|hash|ord|chr|bin|hex|oct|pow|divmod|vars|dir)$/;
  var PY_RE = /(#[^\n]*)|([rbuf]{0,3}"""[\s\S]*?"""|[rbuf]{0,3}'''[\s\S]*?'''|[rbuf]{0,3}"(?:\\.|[^"\\\n])*"|[rbuf]{0,3}'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?\b)|(@[A-Za-z_]\w*)|([A-Za-z_]\w*)/g;
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function highlightPy(src) {
    var out = '', last = 0, m;
    PY_RE.lastIndex = 0;
    while ((m = PY_RE.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="lt-com">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="lt-str">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="lt-num">' + esc(m[3]) + '</span>';
      else if (m[4]) out += '<span class="lt-dec">' + esc(m[4]) + '</span>';
      else if (PY_KW.test(m[5])) out += '<span class="lt-kw">' + m[5] + '</span>';
      else if (PY_BI.test(m[5])) out += '<span class="lt-bi">' + m[5] + '</span>';
      else out += m[5];
      last = PY_RE.lastIndex;
    }
    out += esc(src.slice(last));
    return out;
  }

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = function () { rej(new Error('load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function getPyodide(status) {
    if (!pyPromise) {
      pyPromise = (async function () {
        status('Loading Python (Pyodide), first run only...');
        await loadScript(PYODIDE + 'pyodide.js');
        var py = await loadPyodide({ indexURL: PYODIDE });
        await py.loadPackage('micropip');
        return py;
      })();
    }
    return pyPromise;
  }

  var HARNESS = [
    'import sys, io, base64, json',
    'def __run_user_code(__src):',
    '    __out = io.StringIO()',
    '    __old = sys.stdout',
    '    sys.stdout = __out',
    '    __img = None',
    '    try:',
    '        try:',
    '            import matplotlib',
    '            matplotlib.use("Agg")',  // Agg: plt.show() is a no-op, so the figure is never injected into the page body; we capture it via savefig below.
    '        except Exception:',
    '            pass',
    '        exec(__src, {"__name__": "__main__"})',
    '        try:',
    '            import matplotlib',
    '            if "matplotlib.pyplot" in sys.modules:',
    '                import matplotlib.pyplot as plt',
    '                if plt.get_fignums():',
    '                    __b = io.BytesIO()',
    '                    plt.savefig(__b, format="png", dpi=110, bbox_inches="tight")',
    '                    plt.close("all")',
    '                    __img = base64.b64encode(__b.getvalue()).decode()',
    '        except Exception:',
    '            pass',
    '    finally:',
    '        sys.stdout = __old',
    '    return json.dumps({"out": __out.getvalue(), "img": __img})'
  ].join('\n');

  async function run(cell, code, status, outEl, imgEl) {
    cell.classList.add('ran');
    outEl.textContent = ''; imgEl.src = BLANK; imgEl.style.display = 'none';
    var py;
    try { py = await getPyodide(status); }
    catch (e) { status('Failed to load Python: ' + e.message); return; }
    status('Running...');
    try {
      // Load common packages on demand if the code imports them.
      var pkgs = [];
      if (/\b(numpy|np)\b/.test(code)) pkgs.push('numpy');
      if (/matplotlib|pyplot|plt/.test(code)) pkgs.push('matplotlib');
      if (pkgs.length) { status('Loading ' + pkgs.join(', ') + '...'); await py.loadPackage(pkgs); }
      py.runPython(HARNESS);
      var res = py.globals.get('__run_user_code')(code);
      var data = JSON.parse(res);
      outEl.textContent = data.out || '';
      if (data.img) { imgEl.src = 'data:image/png;base64,' + data.img; imgEl.style.display = 'block'; }
      status(data.out || data.img ? '' : 'Ran (no output).');
    } catch (e) {
      outEl.textContent = String(e && e.message ? e.message : e);
      status('Error.');
    }
  }

  function enhance(block) {
    var codeEl = block.querySelector('code');
    if (!codeEl) return;
    var source = codeEl.textContent.replace(/\n$/, '');
    block.classList.add('live-ready');
    var pre = block.querySelector('pre, div.sourceCode');

    var wrap = document.createElement('div'); wrap.className = 'live-cell';
    var grid = document.createElement('div'); grid.className = 'live-grid';
    var codeCol = document.createElement('div'); codeCol.className = 'live-code';
    var resultCol = document.createElement('div'); resultCol.className = 'live-result';

    var edit = document.createElement('div'); edit.className = 'live-edit';
    var hl = document.createElement('pre'); hl.className = 'live-hl'; hl.setAttribute('aria-hidden', 'true');
    var hlCode = document.createElement('code'); hl.appendChild(hlCode);
    var ta = document.createElement('textarea'); ta.className = 'live-editor';
    ta.spellcheck = false; ta.value = source;
    ta.rows = Math.min(24, source.split('\n').length + 1);

    var bar = document.createElement('div'); bar.className = 'live-bar';
    var runBtn = document.createElement('button'); runBtn.className = 'live-run'; runBtn.textContent = 'Run';
    var resetBtn = document.createElement('button'); resetBtn.className = 'live-reset'; resetBtn.textContent = 'Reset';
    var status = document.createElement('span'); status.className = 'live-status';
    bar.appendChild(runBtn); bar.appendChild(resetBtn); bar.appendChild(status);
    var out = document.createElement('pre'); out.className = 'live-out';
    var img = document.createElement('img'); img.className = 'live-img'; img.alt = 'figure output'; img.style.display = 'none';
    img.src = BLANK;

    // Keep the highlight layer in sync with the textarea (content + scroll).
    function paint() { hlCode.innerHTML = highlightPy(ta.value); }
    function syncScroll() { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; }
    paint();
    ta.addEventListener('input', function () { paint(); syncScroll(); });
    ta.addEventListener('scroll', syncScroll, { passive: true });
    // Insert a tab as spaces instead of moving focus.
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        var s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4; paint();
      }
    });

    function setStatus(t) { status.textContent = t; }
    runBtn.addEventListener('click', function () { run(wrap, ta.value, setStatus, out, img); });
    resetBtn.addEventListener('click', function () {
      ta.value = source; paint(); syncScroll();
      out.textContent = ''; img.style.display = 'none'; setStatus('');
      wrap.classList.remove('ran');
    });
    ta.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(wrap, ta.value, setStatus, out, img); }
    });

    if (pre) pre.style.display = 'none';
    edit.appendChild(hl); edit.appendChild(ta);
    codeCol.appendChild(edit); codeCol.appendChild(bar);
    resultCol.appendChild(out); resultCol.appendChild(img);
    grid.appendChild(codeCol); grid.appendChild(resultCol);
    wrap.appendChild(grid);
    block.appendChild(wrap);
  }

  function init() {
    var blocks = document.querySelectorAll('.runnable');
    for (var i = 0; i < blocks.length; i++) {
      if (!blocks[i].classList.contains('live-ready')) enhance(blocks[i]);
    }
  }
  // Driven by the React reader after hydration (owns the article DOM).
  window.__rdrLive = init;
})();
</script>
<script>
// Wrap content tables in a horizontal-scroll box so a wide table scrolls
// inside its column instead of widening the page on mobile.
(function () {
  function wrapTables() {
    var tables = document.querySelectorAll('#quarto-document table, main table, .cell table');
    for (var i = 0; i < tables.length; i++) {
      var t = tables[i], par = t.parentNode;
      if (!par || (par.classList && par.classList.contains('table-scroll'))) continue;
      var w = document.createElement('div'); w.className = 'table-scroll';
      par.insertBefore(w, t); w.appendChild(t);
    }
  }
  window.__rdrTables = wrapTables;
})();
</script>
