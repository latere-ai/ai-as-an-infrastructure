# The gate configuration for ai-as-an-infrastructure.
#
# This repository calls the shared workflow for the Go gates and the image
# gate. The one job of its own is .github/workflows/book.yml: the prose lint,
# the Bun reader's build and tests (which need the Python packages in
# app/requirements-test.txt that the frontend gate does not install), and the
# Go tests that serve the built pages. The suite gate runs before any book
# build, so those tests skip there and run in book.yml after the build.
#
# The Go gates stand alone because _book/ carries a committed .gitkeep, so the
# go:embed directive resolves without a build, and the two tests that serve
# real pages say they need one and skip when it is absent. The image gate
# below builds the book inside the image.

hermetic:
  # The system directories. The suite reaches no binary of its own, but the
  # toolchain alone is too strict for the Go test runner here.
  allow: [/usr/bin, /bin]

# The code is MIT and the book's text CC BY-NC-SA 4.0 (LICENSE, LICENSE-TEXT).
# The notice goes into the Go files; the text carries its license on every page.
license:
  spdx: MIT
  holder: Latere AI

# No cover section: this is a book with a small server in front of it, and a
# per-package floor over the render tooling would measure the wrong thing.
# No spec section: there is no specs/ tree here.

# Gates this repository does not run yet. Each entry is temporary by
# construction: after the date the gate runs and fails on its own terms.
waive:
  cover:
    reason: >-
      the renderer's five packages sit between 0% and 56.6%; authn and
      config have no tests and api and store are exercised only through
      the rendered site. Closing that is test work rather than a threshold
      to choose
    until: 2026-11-30

# The identity shape of the family: specs/infrastructure/identity.md in latere-ai/specs
identity:
  role: none

# The database shape: which endpoint the serving path connects on.
postgres:
  # Serving traffic opens the pooled endpoint and falls back to the direct one;
  # migrations keep the direct endpoint.
  role: pooled

# The image the release ships. The gate builds the multi-stage Dockerfile,
# which compiles the book with Bun and embeds it in the Go binary, so a change
# that breaks the build or the embedded book fails here, not at release.
image:
  images:
    - name: aaai-web
      # The binary prints its build on "version"; the prefix proves the image
      # holds this server and not a stale layer.
      version_args: [version]
      version_expect: "aaai-web "
      # The server starts with no database and no OIDC client (both are
      # optional), serves the embedded book, and answers its liveness probe.
      port: 8080
      probe: /healthz
      wait_seconds: 20
