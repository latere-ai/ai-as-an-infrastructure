# The gate configuration for ai-as-an-infrastructure.
#
# This repository calls the shared go-verify pipeline for the Go gates and
# keeps a job of its own for the half go-verify cannot host: the book is built
# by bun and Quarto, and the Go server embeds the result.
#
# The Go gates stand alone because _book/ carries a committed .gitkeep, so the
# go:embed directive resolves without a build, and the two tests that serve
# real pages now say they need one and skip when it is absent.

hermetic:
  # The system directories. The suite reaches no binary of its own, but the
  # toolchain alone is too strict for the Go test runner here.
  allow: [/usr/bin, /bin]

modernize:
  disable: [newexpr, errorsastype]

# No cover section: this is a book with a small server in front of it, and a
# per-package floor over the render tooling would measure the wrong thing.
# No spec section: there is no specs/ tree here.
